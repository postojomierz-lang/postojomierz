# Publikuje stronę na GitHub Pages bez danych terenu (region/ jest w Cloudflare R2) i bez ue5/.
# Wymaga: Settings → Pages → Source = „GitHub Actions”.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            rysy
            plastic-front
            toy-soldiers
      - name: Złóż stronę
        run: |
          mkdir _site
          cp -r rysy plastic-front toy-soldiers _site/
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.webmanifest' -o -name '*.png' -o -name '*.ico' -o -name '*.svg' \) -exec cp {} _site/ \;
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
