<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>Postojomierz</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  /* ===== Design tokens ===== */
  :root {
    color-scheme: light;
    --page:        #EEF1EF;
    --surface:     #FCFDFC;
    --surface-2:   #F2F5F3;
    --border:      rgba(20,32,31,0.13);
    --border-soft: rgba(20,32,31,0.07);
    --ink:         #16211F;
    --ink-2:       #47605C;
    --ink-muted:   #7C8B89;
    --brand:       #0F6E6B;
    --brand-ink:   #FCFDFC;
    --brand-wash:  rgba(15,110,107,0.09);
    --focus:       #0F6E6B;

    --status-good:     #0ca30c;
    --status-good-wash:#0ca30c1a;
    --status-warn:     #b06d00;
    --status-warn-wash:#fab2192b;
    --status-crit:     #d03b3b;
    --status-crit-wash:#d03b3b1a;

    --chart-avail: #0089A6;
    --chart-perf:  #6B4FC7;
    --chart-qual:  #96660B;

    --shadow: 0 1px 2px rgba(16,24,23,0.06), 0 8px 24px -12px rgba(16,24,23,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0F1615;
      --surface:     #17201F;
      --surface-2:   #1D2726;
      --border:      rgba(233,238,237,0.12);
      --border-soft: rgba(233,238,237,0.07);
      --ink:         #E9EEED;
      --ink-2:       #AABAB7;
      --ink-muted:   #85938F;
      --brand:       #3FB3AC;
      --brand-ink:   #0B1211;
      --brand-wash:  rgba(63,179,172,0.14);
      --focus:       #3FB3AC;

      --status-good-wash: #0ca30c2b;
      --status-warn:      #e0a531;
      --status-warn-wash: #fab21930;
      --status-crit-wash: #d03b3b2b;

      --chart-avail: #1B93A6;
      --chart-perf:  #7C67D9;
      --chart-qual:  #C99A1E;

      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0F1615;
    --surface:     #17201F;
    --surface-2:   #1D2726;
    --border:      rgba(233,238,237,0.12);
    --border-soft: rgba(233,238,237,0.07);
    --ink:         #E9EEED;
    --ink-2:       #AABAB7;
    --ink-muted:   #85938F;
    --brand:       #3FB3AC;
    --brand-ink:   #0B1211;
    --brand-wash:  rgba(63,179,172,0.14);
    --focus:       #3FB3AC;

    --status-good-wash: #0ca30c2b;
    --status-warn:      #e0a531;
    --status-warn-wash: #fab21930;
    --status-crit-wash: #d03b3b2b;

    --chart-avail: #1B93A6;
    --chart-perf:  #7C67D9;
    --chart-qual:  #C99A1E;

    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  h1, h2, h3 { text-wrap: balance; margin: 0; }
  .num { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .tabular { font-variant-numeric: tabular-nums; }

  a { color: var(--brand); }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ===== Header ===== */
  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }
  .brand-block { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .wordmark {
    font-family: "Big Shoulders Display", "IBM Plex Sans", sans-serif;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: 0.005em;
    color: var(--ink);
    line-height: 1;
  }
  .wordmark span { color: var(--brand); }
  .tagline { color: var(--ink-2); font-size: 14.5px; max-width: 30ch; }
  .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .topbar-meta {
    text-align: right;
    color: var(--ink-muted);
    font-size: 12.5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-end;
  }
  .topbar-meta .num { color: var(--ink-2); font-size: 13px; }

  .role-tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .role-tab {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }
  .role-tab.active { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }

  .readonly-banner {
    background: var(--status-warn-wash);
    color: var(--ink);
    border: 1px solid var(--status-warn);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
  }
  .readonly-banner b { color: var(--status-warn); }

  /* ===== Section headings ===== */
  .eyebrow {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .section-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .section-title {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--ink);
  }
  .section-title.small { font-size: 21px; }
  .section-sub { color: var(--ink-2); font-size: 13.5px; max-width: 62ch; }

  /* ===== Hero ===== */
  .hero {
    display: grid;
    grid-template-columns: minmax(220px, 300px) 1fr;
    gap: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    box-shadow: var(--shadow);
  }
  @media (max-width: 720px) { .hero { grid-template-columns: 1fr; } }

  .gauge-col { display: flex; flex-direction: column; align-items: center; gap: 10px; justify-content: center; }
  .gauge-figure { position: relative; width: 200px; height: 200px; }
  .gauge-figure svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge-track { fill: none; stroke: var(--surface-2); stroke-width: 14; }
  .gauge-fill { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dasharray 0.6s ease; }
  .gauge-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .gauge-value { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 40px; letter-spacing: -0.01em; }
  .gauge-caption { font-size: 11.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px 4px 8px;
    border-radius: 100px;
    font-size: 12px; font-weight: 600;
    white-space: nowrap;
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status-pill.good { color: var(--status-good); background: var(--status-good-wash); }
  .status-pill.good .dot { background: var(--status-good); }
  .status-pill.warn { color: var(--status-warn); background: var(--status-warn-wash); }
  .status-pill.warn .dot { background: var(--status-warn); }
  .status-pill.crit { color: var(--status-crit); background: var(--status-crit-wash); }
  .status-pill.crit .dot { background: var(--status-crit); }

  .meters-col { display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .meter-row { display: flex; flex-direction: column; gap: 6px; }
  .meter-label-row { display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; }
  .meter-label { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-weight: 500; }
  .meter-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .meter-val { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--ink); }
  .meter-track { height: 8px; border-radius: 100px; background: var(--surface-2); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 100px; }
  .hero-foot { grid-column: 1 / -1; color: var(--ink-muted); font-size: 12.5px; border-top: 1px solid var(--border-soft); padding-top: 14px; }

  /* ===== Legend ===== */
  .legend-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .legend-swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

  /* ===== Machine grid ===== */
  .machine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-name { font-weight: 600; font-size: 15.5px; }
  .card-oee { display: flex; align-items: baseline; gap: 6px; }
  .card-oee .num { font-size: 30px; font-weight: 600; line-height: 1; }
  .card-oee .unit { color: var(--ink-muted); font-size: 13px; }

  .apq-rows { display: flex; flex-direction: column; gap: 7px; }
  .apq-row { display: grid; grid-template-columns: 88px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; }
  .apq-name { color: var(--ink-muted); }
  .apq-track { height: 6px; border-radius: 100px; background: var(--surface-2); overflow: hidden; }
  .apq-fill { height: 100%; border-radius: 100px; }
  .apq-val { text-align: right; color: var(--ink-2); font-weight: 500; }

  .bottleneck { font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  .bottleneck b { color: var(--ink); }

  .spark-wrap { position: relative; }
  .spark-wrap svg { width: 100%; height: 46px; display: block; overflow: visible; }
  .spark-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-muted); margin-top: 4px; }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--ink);
    color: var(--page);
    font-size: 11.5px;
    padding: 5px 9px;
    border-radius: 7px;
    transform: translate(-50%, -130%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s ease;
    z-index: 40;
    font-family: "IBM Plex Mono", monospace;
  }
  .tooltip.show { opacity: 1; }

  /* ===== Panels / forms ===== */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .form-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-top: 18px; }
  @media (max-width: 900px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.span-2 { grid-column: span 2; }
  .field.span-3 { grid-column: span 3; }
  @media (max-width: 900px) { .field.span-2, .field.span-3 { grid-column: span 2; } }
  @media (max-width: 480px) { .field.span-2, .field.span-3 { grid-column: span 1; } }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field .hint { font-size: 11px; color: var(--ink-muted); }
  .field .hint.warn { color: var(--status-warn); }
  input, select {
    font: inherit;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13.5px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    width: 100%;
  }
  select { font-family: "IBM Plex Sans", sans-serif; }
  input:focus, select:focus { border-color: var(--brand); }
  input:disabled, select:disabled { opacity: 0.55; cursor: not-allowed; }
  .form-actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin-top: 4px; flex-wrap: wrap; }
  button.primary {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    background: var(--brand);
    color: var(--brand-ink);
    border: none;
    padding: 11px 20px;
    border-radius: 9px;
    cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.06); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
  button.ghost {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    background: transparent;
    color: var(--ink-2);
    border: 1px dashed var(--border);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  button.small {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    background: var(--surface-2);
    color: var(--ink-2);
    border: 1px solid var(--border);
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
  }
  .form-msg { font-size: 12.5px; color: var(--status-good); opacity: 0; transition: opacity 0.2s ease; }
  .form-msg.show { opacity: 1; }
  .form-msg.error { color: var(--status-crit); }

  /* ===== Card actions / diagnosis ===== */
  .card-actions { display: flex; flex-direction: column; gap: 6px; }
  .btn-suggest {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    background: var(--brand-wash);
    color: var(--brand);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
  }
  .btn-suggest:hover { filter: brightness(1.04); }
  .diag-note {
    font-size: 11.5px;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .diag-note button {
    font: inherit;
    background: none;
    border: none;
    color: var(--brand);
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }

  /* ===== Modal ===== */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(8,12,11,0.55);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 5vh 16px;
    overflow-y: auto;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    max-width: 640px;
    width: 100%;
    box-shadow: var(--shadow);
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .modal-head h3 {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 22px;
  }
  .modal-sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .modal-close {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--ink-2);
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    flex: none;
    line-height: 1;
  }

  .q-block { display: flex; flex-direction: column; gap: 9px; padding: 14px 0; border-top: 1px solid var(--border-soft); }
  .q-block:first-of-type { border-top: none; padding-top: 0; }
  .q-legend { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .q-num { color: var(--brand); font-family: "IBM Plex Mono", monospace; margin-right: 6px; }
  .q-options { display: flex; flex-direction: column; gap: 6px; }
  .q-option {
    display: flex; align-items: flex-start; gap: 9px;
    font-size: 13px; color: var(--ink-2);
    cursor: pointer;
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid transparent;
  }
  .q-option:hover { background: var(--surface-2); }
  .q-option input { margin-top: 2px; accent-color: var(--brand); flex: none; width: auto; }
  .q-option.checked { background: var(--brand-wash); border-color: var(--brand); color: var(--ink); }

  .rec-summary {
    font-size: 13px;
    color: var(--ink-2);
    background: var(--surface-2);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .rec-summary b { color: var(--ink); }
  .foundational-box {
    font-size: 13px;
    border: 1px dashed var(--status-warn);
    background: var(--status-warn-wash);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--ink);
  }
  .foundational-box .rec-tag { color: var(--status-warn); }
  .rec-list { display: flex; flex-direction: column; gap: 10px; }
  .rec-item { display: flex; gap: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .rec-rank {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 15px;
    color: var(--brand);
    flex: none;
    width: 22px;
  }
  .rec-tag {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    font-weight: 600;
    display: block;
    margin-bottom: 3px;
  }
  .rec-text { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* ===== Table ===== */
  .table-scroll { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; min-width: 860px; background: var(--surface); }
  table.compact { min-width: 560px; }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    font-weight: 600;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    white-space: nowrap;
  }
  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 13px;
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }
  td.rank-1 .num { color: var(--status-good); font-weight: 700; }

  /* ===== Admin utility panels ===== */
  .admin-tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); flex-wrap: wrap; }
  .admin-tab {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }
  .admin-tab.active { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }
  .import-box { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 8px; }
  .import-head { display: flex; flex-direction: column; gap: 3px; }
  .import-head .hint { font-size: 11.5px; color: var(--ink-muted); max-width: 60ch; }
  .import-box input[type="file"] { font-family: "IBM Plex Sans", sans-serif; font-size: 12px; padding: 6px; width: auto; flex: 1; min-width: 180px; }
  .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .admin-grid { grid-template-columns: 1fr; } }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 100px; padding: 6px 8px 6px 13px; font-size: 12.5px;
  }
  .chip button {
    background: none; border: none; color: var(--ink-muted); cursor: pointer;
    width: 18px; height: 18px; border-radius: 50%; font-size: 12px; line-height: 1;
  }
  .chip button:hover { background: var(--status-crit-wash); color: var(--status-crit); }
  .chip .pending-tag { color: var(--status-warn); font-size: 11px; font-weight: 600; }

<script>
(function () {
  "use strict";

  /* =====================================================================
     POŁĄCZENIE Z SUPABASE — prawdziwa, wielofirmowa baza danych.
     Klucz poniżej to klucz "publishable" (odpowiednik dawnego "anon public")
     — jest bezpieczny do umieszczenia w kodzie strony, którą widzi każdy;
     rzeczywistą ochronę danych między firmami zapewnia Row Level Security
     skonfigurowane w schema.sql.
     ===================================================================== */

  var SUPABASE_URL = "https://kromnqqtldcfpmsiknww.supabase.co";
  var SUPABASE_KEY = "sb_publishable_S7NINu5fKti7Akn0aE_chw_zTVkpwKV";
  var REDIRECT_TO = window.location.origin + window.location.pathname;

  var sb = null;
  try {
    if (window.supabase && typeof window.supabase.createClient === "function") {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
  } catch (e) { sb = null; }

  var view = "operator";      // "operator" | "admin"
  var adminTab = "overview";  // "overview" | "machines" | "operators" | "products" | "history" | "settings"
  var booting = true;
  var session = null;         // { user, profile:{id,role,displayName}, company:{id,name,shiftsPerDay} }
  var authScreen = "login";   // "login" | "signup" | "check-email"
  var authError = "";
  var bannerMsg = "";

  function uid() { return Math.random().toString(36).slice(2, 10); }
  function escAttr(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function fmtPct(x) { return (x * 100).toFixed(1).replace(".", ",") + "%"; }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function fmtDate(d) {
    var dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString("pl-PL", { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  var state = { machines: [], operators: [], people: [], products: [], productRates: {}, shifts: [], diagnoses: {}, settings: { shiftsPerDay: 2 } };

  /* =====================================================================
     WCZYTYWANIE DANYCH FIRMY Z SUPABASE
     RLS filtruje automatycznie do firmy zalogowanej osoby — nie trzeba
     samodzielnie dopisywać "where company_id = ...".
     ===================================================================== */

  function rowsToProductRates(rows) {
    var out = {};
    rows.forEach(function (r) {
      if (!out[r.product_id]) out[r.product_id] = {};
      out[r.product_id][r.machine_id] = Number(r.ideal_cycle_sec);
    });
    return out;
  }

  function rowsToDiagnoses(rows) {
    var out = {};
    rows.forEach(function (r) {
      out[r.machine_id] = { answers: r.answers, date: (r.updated_at || "").slice(0, 10) };
    });
    return out;
  }

  function shiftFromRow(r) {
    return {
      id: r.id, machineId: r.machine_id, operatorId: r.operator_id,
      shiftNumber: r.shift_number, productId: r.product_id, date: r.shift_date,
      plannedMin: Number(r.planned_min), downtimeMin: Number(r.downtime_min),
      idealCycleSec: Number(r.ideal_cycle_sec), good: Number(r.good_count), bad: Number(r.bad_count)
    };
  }

  async function loadCompanyData() {
    var results = await Promise.all([
      sb.from("machines").select("*").order("created_at"),
      sb.from("products").select("*").order("created_at"),
      sb.from("product_rates").select("*"),
      sb.from("shifts").select("*").order("shift_date", { ascending: false }).limit(500),
      sb.from("diagnoses").select("*"),
      sb.from("operators").select("*").order("created_at")
    ]);
    var errs = results.map(function (r) { return r.error; }).filter(Boolean);
    if (errs.length) {
      bannerMsg = "Nie udało się wczytać części danych (" + errs[0].message + "). Odśwież stronę.";
    } else {
      bannerMsg = "";
    }

    state.machines = (results[0].data || []).map(function (m) { return { id: m.id, name: m.name }; });
    state.products = (results[1].data || []).map(function (p) { return { id: p.id, name: p.name }; });
    state.productRates = rowsToProductRates(results[2].data || []);
    state.shifts = (results[3].data || []).map(shiftFromRow);
    state.diagnoses = rowsToDiagnoses(results[4].data || []);
    state.settings = { shiftsPerDay: session.company.shiftsPerDay || 2 };

    // operatorzy — proste rekordy imię + PIN, nie konta logowania (patrz renderOperator)
    state.operators = (results[5].data || []).map(function (o) { return { id: o.id, name: o.name, pin: o.pin }; });
    state.people = state.operators; // do wyświetlania imion przy zmianach (leaderboard, dziennik)
  }

  /* ---------- obliczenia OEE (bez zmian w metodzie) ---------- */

  function calc(shift) {
    var operatingMin = Math.max(0, shift.plannedMin - shift.downtimeMin);
    var operatingSec = operatingMin * 60;
    var produced = shift.good + shift.bad;
    var availability = shift.plannedMin > 0 ? clamp01(operatingMin / shift.plannedMin) : 0;
    var performance = operatingSec > 0 ? clamp01((shift.idealCycleSec * produced) / operatingSec) : 0;
    var quality = produced > 0 ? clamp01(shift.good / produced) : 0;
    var oee = availability * performance * quality;
    return { availability: availability, performance: performance, quality: quality, oee: oee, produced: produced };
  }

  function tier(oee) {
    if (oee >= 0.85) return { key: "good", label: "Dobrze" };
    if (oee >= 0.60) return { key: "warn", label: "Do poprawy" };
    return { key: "crit", label: "Krytycznie" };
  }

  function machineShifts(machineId) {
    return state.shifts
      .filter(function (s) { return s.machineId === machineId; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  }

  function bottleneckLabel(m) {
    var vals = [
      { key: "availability", label: "dostępność", v: m.availability },
      { key: "performance", label: "wydajność", v: m.performance },
      { key: "quality", label: "jakość", v: m.quality }
    ];
    vals.sort(function (a, b) { return a.v - b.v; });
    return vals[0];
  }

  function machineName(id) { var m = state.machines.filter(function (x) { return x.id === id; })[0]; return m ? m.name : "—"; }
  function operatorName(id) { var o = state.people.filter(function (x) { return x.id === id; })[0]; return o ? o.name : "—"; }
  function productName(id) { var p = state.products.filter(function (x) { return x.id === id; })[0]; return p ? p.name : "—"; }

  /* =====================================================================
     KWESTIONARIUSZ I REKOMENDACJE (bez zmian w metodzie)
     ===================================================================== */

  var SCALE_NEVER_OFTEN = [
    { v: 0, t: "Prawie nigdy" },
    { v: 1, t: "Rzadko" },
    { v: 2, t: "Kilka razy w tygodniu" },
    { v: 3, t: "Codziennie lub częściej" }
  ];

  var QUESTIONS = [
    { id: "breakdown", comp: "availability", label: "Awarie", text: "Jak często zdarzają się nieplanowane awarie tej maszyny?", type: "scale", options: SCALE_NEVER_OFTEN },
    { id: "changeover", comp: "availability", label: "Przezbrojenia", text: "Jak wygląda przezbrojenie / zmiana ustawień na inny produkt?", type: "scale", options: [
      { v: 0, t: "Szybkie, mamy spisane kroki" }, { v: 1, t: "Zajmuje trochę czasu, ale bez problemów" },
      { v: 2, t: "Długie, zależy kto je robi" }, { v: 3, t: "Bardzo długie i za każdym razem inaczej" }
    ]},
    { id: "minor_stops", comp: "performance", label: "Mikroprzestoje", text: "Czy zdarzają się częste, krótkie zatrzymania (zacięcia, czyszczenie, drobne poprawki), które nikt nie liczy jako 'poważny' przestój?", type: "scale", options: [
      { v: 0, t: "Prawie nigdy" }, { v: 1, t: "Sporadycznie" }, { v: 2, t: "Kilka razy na zmianę" }, { v: 3, t: "Bardzo często, prawie ciągle" }
    ]},
    { id: "material", comp: "availability", label: "Braki materiałowe", text: "Czy maszyna czeka na materiał, półprodukt albo komponenty do montażu?", type: "scale", options: [
      { v: 0, t: "Nigdy, zaopatrzenie działa płynnie" }, { v: 1, t: "Rzadko" }, { v: 2, t: "Czasami, kilka razy w tygodniu" }, { v: 3, t: "Często, to główny problem" }
    ]},
    { id: "people", comp: "availability", label: "Obsada i kompetencje", text: "Czy brakuje przeszkolonych operatorów albo zdarza się duża rotacja / absencja na tym stanowisku?", type: "scale", options: [
      { v: 0, t: "Nie, stały, doświadczony zespół" }, { v: 1, t: "Rzadko bywa zastępstwo" }, { v: 2, t: "Często pracują mniej doświadczeni ludzie" }, { v: 3, t: "To ciągły problem" }
    ]},
    { id: "speed", comp: "performance", label: "Tempo pracy", text: "Czy maszyna często pracuje wolniej niż zakładana norma?", type: "scale", options: [
      { v: 0, t: "Nie, trzyma normę" }, { v: 1, t: "Czasem, bez wyraźnego powodu" }, { v: 2, t: "Często, z powodu stanu maszyny lub narzędzi" }, { v: 3, t: "Prawie zawsze wolniej niż norma" }
    ]},
    { id: "engagement", comp: "performance", label: "Zaangażowanie operatorów", text: "Czy operatorzy sami zgłaszają problemy i pomysły na poprawę tempa, czy tylko wykonują polecenia i czekają na instrukcje?", type: "scale", options: [
      { v: 0, t: "Regularnie zgłaszają problemy i pomysły" }, { v: 1, t: "Czasami, gdy o to poproszę" }, { v: 2, t: "Rzadko, głównie wykonują polecenia" }, { v: 3, t: "Prawie nigdy, brak inicjatywy w poprawie normy" }
    ]},
    { id: "startup", comp: "quality", label: "Straty rozruchowe", text: "Ile trwa 'rozruch' po starcie zmiany lub po przezbrojeniu, zanim jakość się ustabilizuje?", type: "scale", options: [
      { v: 0, t: "Prawie od razu dobra jakość" }, { v: 1, t: "Kilka pierwszych sztuk do poprawki" }, { v: 2, t: "Wyraźny okres 'docierania się'" }, { v: 3, t: "Regularnie sporo braków na starcie" }
    ]},
    { id: "quality", comp: "quality", label: "Przyczyny braków", text: "Jaka jest najczęstsza przyczyna wadliwych sztuk?", type: "choice", options: [
      { v: "settings", t: "Złe ustawienia maszyny" }, { v: "material", t: "Jakość materiału wejściowego" },
      { v: "tool", t: "Zużyte narzędzie / oprzyrządowanie" }, { v: "operator", t: "Błąd operatora" }, { v: "unknown", t: "Nie wiadomo / trudno powiedzieć" }
    ]},
    { id: "maintenance", comp: "availability", label: "Konserwacja zapobiegawcza", text: "Czy maszyna ma harmonogram przeglądów zapobiegawczych, czy naprawia się dopiero, gdy się zepsuje?", type: "scale", options: [
      { v: 0, t: "Regularne przeglądy wg harmonogramu" }, { v: 1, t: "Przeglądy, ale nieregularnie" }, { v: 2, t: "Głównie naprawy po awarii" }, { v: 3, t: "Brak jakiejkolwiek konserwacji" }
    ]},
    { id: "tracking", comp: null, label: "Rejestrowanie przestojów", text: "Czy przestoje i ich przyczyny są gdzieś zapisywane, czy tylko 'w pamięci' operatora?", type: "scale", options: [
      { v: 0, t: "Tak, zapisujemy przyczynę każdego przestoju" }, { v: 1, t: "Zapisujemy tylko poważniejsze" }, { v: 2, t: "Rzadko, głównie pamięć ludzi" }, { v: 3, t: "Wcale nie zapisujemy" }
    ]}
  ];

  var REC_TEXT = {
    breakdown: "Awarie zdarzają się regularnie. Wprowadź krótkie, 5-minutowe oględziny maszyny przed startem zmiany (hałas, wibracje, poziom oleju, luzy) — większość awarii daje sygnały ostrzegawcze na kilka dni wcześniej.",
    changeover: "Przezbrojenie jest długie i niepowtarzalne. Spisz obecny proces krok po kroku, a potem rozdziel czynności na te możliwe do zrobienia PRZED zatrzymaniem maszyny (przygotowanie narzędzi, materiału) i te wymagające postoju — samo to zwykle skraca przezbrojenie o 20–30% bez żadnej inwestycji.",
    minor_stops: "Częste krótkie zatrzymania, których nikt nie liczy, potrafią zabrać więcej wydajności niż jedna duża awaria. Poproś operatora, żeby przez tydzień zaznaczał każde zatrzymanie na kartce — dopiero suma pokaże, gdzie naprawdę znika czas.",
    material: "Maszyna czeka na materiał. Sprawdź, czy to problem zaopatrzenia (zamówienia za późno) czy wewnętrznej logistyki (materiał jest w magazynie, ale nie trafia na czas na stanowisko) — to dwa różne rozwiązania.",
    people: "Brak stałej, przeszkolonej obsady bezpośrednio obniża wynik. Spisz w 1–2 stronach instrukcję stanowiskową (ustawienia, typowe błędy, co robić przy zatrzymaniu) — to najtańszy sposób, żeby zastępstwo nie oznaczało spadku wydajności.",
    speed: "Maszyna pracuje wolniej niż norma. Ustal wspólnie z operatorem konkretną przyczynę — stan maszyny/narzędzi, obawa o jakość, czy brak motywacji do trzymania tempa — bo każda z nich wymaga innego rozwiązania: naprawy sprzętu, zmiany parametrów albo rozmowy o oczekiwaniach.",
    engagement: "Operatorzy nie zgłaszają problemów ani pomysłów i nie dążą sami do poprawy tempa. Zamiast liczyć na samodzielną inicjatywę, wprowadź widoczny, bieżący wynik (np. tablica z dzisiejszym OEE) i krótką rozmowę na koniec zmiany o tym, co przeszkadzało — jawny cel i informacja zwrotna zwykle podnoszą zaangażowanie skuteczniej niż samo przypominanie. Jeśli to nie pomoże w kilka tygodni, to sygnał do rozmowy indywidualnej o oczekiwaniach.",
    startup: "Spory czas 'dochodzenia' do dobrej jakości po starcie lub przezbrojeniu. Ustal jeden, spisany zestaw parametrów startowych zamiast ustawiania 'na oko' — powtarzalny rozruch skraca ten czas najbardziej.",
    maintenance: "Maszyna jest naprawiana głównie po awarii, bez przeglądów zapobiegawczych. Ustal najprostszy możliwy harmonogram (np. raz w miesiącu, 15 minut) dla elementów, które psują się najczęściej — zwykle wychodzi taniej niż kolejna awaria.",
    tracking: "Przestoje nie są nigdzie zapisywane, więc trudno mieć pewność, co naprawdę zabiera najwięcej czasu. Zanim wprowadzisz inne zmiany, poproś, żeby każdy przestój — nawet krótki — był zapisywany z przyczyną. Jedna kartka przy maszynie wystarczy na start."
  };

  var REC_QUALITY_CAUSE = {
    settings: "Główną przyczyną braków są ustawienia maszyny. Spisz i oznacz prawidłowe parametry przy samej maszynie — to eliminuje 'ustawianie z pamięci' i różnice między operatorami.",
    material: "Główną przyczyną braków jest jakość materiału wejściowego. Wprowadź prostą kontrolę wyrywkową przy przyjęciu materiału — taniej jest odrzucić wadliwą dostawę niż wadliwy gotowy produkt.",
    tool: "Główną przyczyną braków jest zużyte narzędzie lub oprzyrządowanie. Ustal konkretny limit (czas pracy albo liczba sztuk), po którym narzędzie wymieniasz z góry — zanim zacznie psuć produkt.",
    operator: "Główną przyczyną braków jest błąd operatora. To zwykle sygnał braku checklisty, nie braku umiejętności — krótka lista kontrolna przy stanowisku pomaga zwykle bardziej niż samo szkolenie.",
    unknown: "Nikt nie jest pewien, co powoduje braki — to samo w sobie priorytet. Przez tydzień zapisuj przy każdej wadliwej sztuce jedno słowo przyczyny, zanim zaczniesz cokolwiek zmieniać."
  };

  var GENERIC_TIP = {
    availability: "Największą dźwignią pozostaje dostępność maszyny — sprawdź w dzienniku zmian, która przyczyna przestoju powtarza się najczęściej, i zacznij od niej.",
    performance: "Największą dźwignią pozostaje tempo pracy — sprawdź, czy maszyna trzyma normę przez całą zmianę, czy tylko na początku.",
    quality: "Największą dźwignią pozostaje jakość — sprawdź, czy braki grupują się w konkretnych porach zmiany albo przy konkretnym operatorze."
  };

  function computeRecommendations(machineId, answers) {
    var hist = machineShifts(machineId);
    var last = hist.length ? calc(hist[hist.length - 1]) : null;
    var bn = last ? bottleneckLabel(last) : null;

    var candidates = [];
    QUESTIONS.forEach(function (q) {
      if (q.id === "tracking") return;
      if (q.type === "scale") {
        var score = answers[q.id];
        if (typeof score !== "number" || score < 2) return;
        var weight = score + (bn && q.comp === bn.key ? 1.5 : 0);
        candidates.push({ key: q.id, comp: q.comp, label: q.label, weight: weight, text: REC_TEXT[q.id] });
      } else if (q.type === "choice" && q.id === "quality") {
        var cause = answers.quality;
        if (!cause) return;
        var w = 2 + (bn && q.comp === bn.key ? 1.5 : 0);
        candidates.push({ key: "quality", comp: "quality", label: q.label, weight: w, text: REC_QUALITY_CAUSE[cause] || REC_QUALITY_CAUSE.unknown });
      }
    });
    candidates.sort(function (a, b) { return b.weight - a.weight; });
    var top = candidates.slice(0, 4);

    var trackingScore = answers.tracking;
    var foundational = (typeof trackingScore === "number" && trackingScore >= 2) ? REC_TEXT.tracking : null;

    if (top.length === 0 && bn) top.push({ key: "generic", comp: bn.key, label: "Priorytet z danych", weight: 0, text: GENERIC_TIP[bn.key] });

    var summary = "";
    if (bn) {
      summary = "Dane z pomiarów pokazują, że najsłabszym ogniwem tej maszyny jest <b>" + bn.label + "</b> (" + Math.round(bn.v * 100) + "%). ";
      summary += (top.length && top[0].comp === bn.key) ? "Odpowiedzi z kwestionariusza wskazują na to samo źródło strat." : "Kwestionariusz wskazuje głównie na inny obszar — warto sprawdzić oba tropy.";
    }
    return { summary: summary, foundational: foundational, items: top };
  }

  /* =====================================================================
     MODAL (diagnoza) — zapis do tabeli diagnoses
     ===================================================================== */

  var backdrop, modalBox;

  function openModal() { backdrop.classList.add("open"); document.body.style.overflow = "hidden"; }
  function closeModal() { backdrop.classList.remove("open"); document.body.style.overflow = ""; modalBox.innerHTML = ""; }

  function renderQuestionForm(machineId) {
    var saved = state.diagnoses[machineId] ? state.diagnoses[machineId].answers : {};
    var qHtml = QUESTIONS.map(function (q, i) {
      var opts = q.options.map(function (o) {
        var checked = saved[q.id] === o.v ? " checked" : "";
        return '<label class="q-option' + (checked ? " checked" : "") + '">' +
          '<input type="radio" name="' + q.id + '" value="' + o.v + '"' + checked + '>' +
          '<span>' + o.t + '</span></label>';
      }).join("");
      return '<div class="q-block"><div class="q-legend"><span class="q-num">' + (i + 1) + '.</span>' + q.text + '</div>' +
        '<div class="q-options" data-qid="' + q.id + '">' + opts + '</div></div>';
    }).join("");

    modalBox.innerHTML =
      '<div class="modal-head"><div><h3 id="modalTitle">Zaproponuj poprawę</h3><div class="modal-sub">' + machineName(machineId) + ' — 10+1 pytań do osoby, która zna tę maszynę na co dzień.</div></div>' +
      '<button type="button" class="modal-close" id="modalCloseBtn" aria-label="Zamknij">✕</button></div>' +
      '<form id="diagForm">' + qHtml +
      '<div class="modal-actions" style="margin-top:6px;"><span class="modal-sub" id="diagFormMsg">Odpowiedz najlepiej jak potrafisz — brak pewności też jest odpowiedzią.</span>' +
      '<button type="submit" class="primary">Wydaj rekomendacje</button></div></form>';

    modalBox.querySelectorAll(".q-options").forEach(function (group) {
      group.addEventListener("change", function () {
        group.querySelectorAll(".q-option").forEach(function (lbl) { lbl.classList.toggle("checked", lbl.querySelector("input").checked); });
      });
    });
    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    document.getElementById("diagForm").addEventListener("submit", async function (evt) {
      evt.preventDefault();
      var answers = {};
      QUESTIONS.forEach(function (q) {
        var checked = modalBox.querySelector('input[name="' + q.id + '"]:checked');
        if (!checked) return;
        answers[q.id] = q.type === "scale" ? parseInt(checked.value, 10) : checked.value;
      });
      var btn = modalBox.querySelector('button[type="submit"]');
      btn.disabled = true;
      var res = await sb.from("diagnoses").upsert(
        { machine_id: machineId, company_id: session.company.id, answers: answers, updated_at: new Date().toISOString() },
        { onConflict: "machine_id" }
      );
      btn.disabled = false;
      if (res.error) {
        var msg = document.getElementById("diagFormMsg");
        if (msg) { msg.textContent = "Nie udało się zapisać: " + res.error.message; msg.style.color = "var(--status-crit)"; }
        return;
      }
      await loadCompanyData();
      renderApp();
      renderResults(machineId);
    });
    openModal();
  }

    var r = computeRecommendations(machineId, diag.answers);

  function apqRow(name, val, color) {
    return '<div class="apq-row"><span class="apq-name">' + name + '</span>' +
      '<span class="apq-track"><span class="apq-fill" style="width:' + (clamp01(val) * 100) + '%;background:' + color + '"></span></span>' +

  }

  function buildSparkline(hist) {
    var w = 280, h = 46, pad = 4;
    if (hist.length < 2) return { svg: '<svg viewBox="0 0 ' + w + ' ' + h + '"></svg>', points: [] };
    var vals = hist.map(function (s) { return calc(s).oee; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var range = (max - min) || 0.0001;
    var points = vals.map(function (v, i) {
      var x = pad + (i / (vals.length - 1)) * (w - pad * 2);
      var y = h - pad - ((v - min) / range) * (h - pad * 2);
      return { x: x, y: y, v: v, date: hist[i].date };
    });
    var linePath = points.map(function (p, i) { return (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
    var areaPath = linePath + " L" + points[points.length - 1].x.toFixed(1) + "," + h + " L" + points[0].x.toFixed(1) + "," + h + " Z";
    var last = points[points.length - 1];
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<path d="' + areaPath + '" fill="var(--brand-wash)" stroke="none"></path>' +
      '<path d="' + linePath + '" fill="none" stroke="var(--brand)" stroke-width="2" vector-effect="non-scaling-stroke"></path>' +
      '<circle cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) + '" r="3.2" fill="var(--brand)"></circle></svg>';
    return { svg: svg, points: points, w: w };
  }

  function attachSparklineHover(wrapEl, points, w) {
    if (!points.length) return;
    var svg = wrapEl.querySelector("svg");
    var tooltip = document.getElementById("tooltip");
    svg.addEventListener("mousemove", function (evt) {
      var rect = svg.getBoundingClientRect();
      var relX = ((evt.clientX - rect.left) / rect.width) * w;
      var nearest = points[0], best = Infinity;
      points.forEach(function (p) { var d = Math.abs(p.x - relX); if (d < best) { best = d; nearest = p; } });
      tooltip.textContent = fmtDate(nearest.date) + " · " + fmtPct(nearest.v);
      tooltip.style.left = evt.clientX + "px"; tooltip.style.top = evt.clientY + "px";
      tooltip.classList.add("show");
    });
    svg.addEventListener("mouseleave", function () { tooltip.classList.remove("show"); });
  }

  function heroHtml() {
    var latestByMachine = state.machines.map(function (m) {
      var hist = machineShifts(m.id); var last = hist[hist.length - 1];
      return last ? calc(last) : null;
    }).filter(Boolean);
    if (!latestByMachine.length) return "";
    function avg(key) { return latestByMachine.reduce(function (sum, x) { return sum + x[key]; }, 0) / latestByMachine.length; }
    var shop = { availability: avg("availability"), performance: avg("performance"), quality: avg("quality") };
    shop.oee = shop.availability * shop.performance * shop.quality;
    var t = tier(shop.oee);
    var circumference = 2 * Math.PI * 82;
    var dash = (circumference * clamp01(shop.oee)) + " " + circumference;
    var strokeVar = "var(--status-" + t.key + ")";
    return '<section aria-labelledby="heroTitle"><div class="section-head"><div class="eyebrow">Stan na dziś</div>' +
      '<h1 id="heroTitle" class="section-title">OEE całego warsztatu</h1>' +
      '<div class="section-sub">Średnia z ostatnich zmian każdej maszyny. Dostępność × Wydajność × Jakość = OEE.</div></div>' +
      '<div class="hero"><div class="gauge-col"><div class="gauge-figure"><svg viewBox="0 0 200 200">' +
      '<circle class="gauge-track" cx="100" cy="100" r="82"></circle>' +
      '<circle class="gauge-fill" cx="100" cy="100" r="82" style="stroke-dasharray:' + dash + ';stroke:' + strokeVar + '"></circle></svg>' +
      '<div class="gauge-center"><div class="gauge-value num tabular">' + fmtPct(shop.oee) + '</div><div class="gauge-caption">OEE</div></div></div>' +
      '<span class="status-pill ' + t.key + '"><span class="dot"></span>' + t.label + '</span></div>' +
      '<div class="meters-col">' +
      '<div class="meter-row"><div class="meter-label-row"><span class="meter-label"><span class="meter-swatch" style="background:var(--chart-avail)"></span>Dostępność</span><span class="meter-val num tabular">' + fmtPct(shop.availability) + '</span></div><div class="meter-track"><div class="meter-fill" style="width:' + (shop.availability * 100) + '%;background:var(--chart-avail)"></div></div></div>' +
      '<div class="meter-row"><div class="meter-label-row"><span class="meter-label"><span class="meter-swatch" style="background:var(--chart-perf)"></span>Wydajność</span><span class="meter-val num tabular">' + fmtPct(shop.performance) + '</span></div><div class="meter-track"><div class="meter-fill" style="width:' + (shop.performance * 100) + '%;background:var(--chart-perf)"></div></div></div>' +
      '<div class="meter-row"><div class="meter-label-row"><span class="meter-label"><span class="meter-swatch" style="background:var(--chart-qual)"></span>Jakość</span><span class="meter-val num tabular">' + fmtPct(shop.quality) + '</span></div><div class="meter-track"><div class="meter-fill" style="width:' + (shop.quality * 100) + '%;background:var(--chart-qual)"></div></div></div>' +
      '</div><div class="hero-foot">Benchmark: ≥ 85% to wynik światowej klasy, 60–84% to typowy warsztat bez optymalizacji, poniżej 60% zwykle oznacza łatwe do znalezienia straty.</div></div></section>';
  }

    }).sort(function (a, b) { return b.avgOee - a.avgOee; });

     ===================================================================== */

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  };

  function importBlockHtml(kind) {
    var meta = IMPORT_LABELS[kind];
    var k = cap(kind);
    return '<div class="import-box"><div class="import-head"><span class="eyebrow">Import z pliku</span><span class="hint">' + meta.hint + '</span></div>' +
      '<div class="inline-add">' +
      '<input type="file" id="import' + k + 'File" accept=".csv,.txt,.xlsx,.xls">' +
      '<button type="button" class="ghost small" id="import' + k + 'Btn">Importuj</button>' +
      '</div><span class="form-msg" id="import' + k + 'Msg"></span></div>';
  }

  function parseImportFile(file, cb) {
    var lower = file.name.toLowerCase();
    if (lower.endsWith(".xlsx") || lower.endsWith(".xls")) {
      if (!window.XLSX) { cb(null, new Error("Biblioteka do czytania plików Excel się nie wczytała. Odśwież stronę albo użyj pliku .csv/.txt.")); return; }
      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var data = new Uint8Array(e.target.result);
          var wb = XLSX.read(data, { type: "array" });
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
          cb(rows, null);
        } catch (err) { cb(null, err); }
      };
      reader.onerror = function () { cb(null, new Error("Nie udało się odczytać pliku.")); };
      reader.readAsArrayBuffer(file);
    } else {
      var reader2 = new FileReader();
      reader2.onload = function (e) {
        var text = (e.target.result || "").toString();
        var lines = text.split(/\r\n|\r|\n/).filter(function (l) { return l.trim() !== ""; });
        var rows = lines.map(function (l) {
          var delim = l.indexOf(";") !== -1 ? ";" : (l.indexOf(",") !== -1 ? "," : (l.indexOf("\t") !== -1 ? "\t" : null));
          return delim ? l.split(delim).map(function (x) { return x.trim(); }) : [l.trim()];
        });
        cb(rows, null);
      };
      reader2.onerror = function () { cb(null, new Error("Nie udało się odczytać pliku.")); };
      reader2.readAsText(file, "UTF-8");
    }
  }

  var IMPORT_HEADER_WORDS = ["nazwa", "name", "maszyna", "machine", "produkt", "product", "imię", "imie", "operator", "imię i nazwisko"];

  function rowsToNewNames(rows, existing) {
    var existingLower = existing.map(function (x) { return x.name.trim().toLowerCase(); });
    var seen = {}, out = [];
    rows.forEach(function (r) {
      var v = (Array.isArray(r) ? r[0] : r);
      v = (v == null ? "" : v).toString().trim();
      if (!v) return;
      var low = v.toLowerCase();
      if (IMPORT_HEADER_WORDS.indexOf(low) !== -1) return;
      if (existingLower.indexOf(low) !== -1) return;
      if (seen[low]) return;
      seen[low] = true;
      out.push(v);
    });
    return out;
  }

  function rowsToNewOperators(rows, existing) {
    var existingLower = existing.map(function (x) { return x.name.trim().toLowerCase(); });
    var seen = {}, out = [];
    rows.forEach(function (r) {
      var name = (Array.isArray(r) ? r[0] : "");
      var pin = (Array.isArray(r) ? r[1] : "");
      name = (name == null ? "" : name).toString().trim();
      pin = (pin == null ? "" : pin).toString().trim();
      if (!name) return;
      var low = name.toLowerCase();
      if (IMPORT_HEADER_WORDS.indexOf(low) !== -1) return;
      if (!pin) return;
      if (existingLower.indexOf(low) !== -1) return;
      if (seen[low]) return;
      seen[low] = true;
      out.push({ name: name, pin: pin });
    });
    return out;
  }

  function wireImportHandler(kind, table, mapRowsToRecords) {
    var btn = document.getElementById("import" + cap(kind) + "Btn");
    var fileInput = document.getElementById("import" + cap(kind) + "File");
    var msgEl = document.getElementById("import" + cap(kind) + "Msg");
    if (!btn || !fileInput) return;
    btn.addEventListener("click", function () {
      msgEl.classList.remove("show", "error");
      var file = fileInput.files[0];
      if (!file) { msgEl.textContent = "Najpierw wybierz plik."; msgEl.classList.add("show", "error"); return; }
      btn.disabled = true;
      parseImportFile(file, async function (rows, err) {
        if (err) { btn.disabled = false; msgEl.textContent = "Błąd odczytu pliku: " + err.message; msgEl.classList.add("show", "error"); return; }
        var records = mapRowsToRecords(rows);
        if (!records.length) {
          btn.disabled = false;
          msgEl.textContent = "Nie znaleziono żadnych nowych, poprawnych wierszy do zaimportowania (puste, bez PIN-u albo już na liście).";
          msgEl.classList.add("show", "error");
          return;
        }
        var res = await sb.from(table).insert(records);
        btn.disabled = false;
        if (res.error) { msgEl.textContent = "Nie udało się zaimportować: " + res.error.message; msgEl.classList.add("show", "error"); return; }
        var importedCount = records.length;
        await loadCompanyData();
        renderAdmin(document.getElementById("adminRoot"));
        var freshMsg = document.getElementById("import" + cap(kind) + "Msg");
        if (freshMsg) {
          freshMsg.textContent = "Zaimportowano: " + importedCount + ".";
          freshMsg.classList.add("show");
          setTimeout(function () { freshMsg.classList.remove("show"); }, 3000);
        }
      });
    });
  }

  var IMPORT_HEADER_WORDS_PRODUCTS = ["produkt", "product", "nazwa", "maszyna", "machine", "ilość", "ilosc", "ilość maksymalna dzienna", "ilosc maksymalna dzienna", "qty", "max"];

  function wireProductsImportHandler() {
    var btn = document.getElementById("importProductsBtn");
    var fileInput = document.getElementById("importProductsFile");
    var msgEl = document.getElementById("importProductsMsg");
    if (!btn || !fileInput) return;
    btn.addEventListener("click", function () {
      msgEl.classList.remove("show", "error");
      var file = fileInput.files[0];
      if (!file) { msgEl.textContent = "Najpierw wybierz plik."; msgEl.classList.add("show", "error"); return; }
      btn.disabled = true;
      parseImportFile(file, async function (rows, err) {
        if (err) { btn.disabled = false; msgEl.textContent = "Błąd odczytu pliku: " + err.message; msgEl.classList.add("show", "error"); return; }

        var parsed = [];
        rows.forEach(function (r) {
          var name = (Array.isArray(r) ? r[0] : "");
          var machineName = (Array.isArray(r) ? r[1] : "");
          var qtyRaw = (Array.isArray(r) ? r[2] : "");
          name = (name == null ? "" : name).toString().trim();
          machineName = (machineName == null ? "" : machineName).toString().trim();
          qtyRaw = (qtyRaw == null ? "" : qtyRaw).toString().trim();
          if (!name) return;
          if (IMPORT_HEADER_WORDS_PRODUCTS.indexOf(name.toLowerCase()) !== -1) return;
          parsed.push({ name: name, machineName: machineName, qty: parseFloat(qtyRaw.replace(",", ".")) });
        });

        if (!parsed.length) {
          btn.disabled = false;
          msgEl.textContent = "Nie znaleziono żadnych poprawnych wierszy (oczekiwany format: Produkt;Maszyna;Ilość maksymalna dzienna).";
          msgEl.classList.add("show", "error");
          return;
        }

        // 1) dopisz brakujące produkty
        var existingProductsLower = {};
        state.products.forEach(function (p) { existingProductsLower[p.name.trim().toLowerCase()] = p.id; });
        var newProductNames = [], seenNew = {};
        parsed.forEach(function (row) {
          var low = row.name.toLowerCase();
          if (!existingProductsLower[low] && !seenNew[low]) { seenNew[low] = true; newProductNames.push(row.name); }
        });
        var insertedCount = 0;
        if (newProductNames.length) {
          var insRes = await sb.from("products").insert(newProductNames.map(function (n) { return { company_id: session.company.id, name: n }; }));
          if (insRes.error) {
            btn.disabled = false;
            msgEl.textContent = "Nie udało się dodać nowych produktów: " + insRes.error.message;
            msgEl.classList.add("show", "error");
            return;
          }
          insertedCount = newProductNames.length;
          (insRes.data || []).forEach(function (p) { existingProductsLower[p.name.trim().toLowerCase()] = p.id; });
        }

        // 2) dopasuj maszyny po nazwie i przelicz orientacyjny czas cyklu z ilości dziennej
        var machinesByLower = {};
        state.machines.forEach(function (m) { machinesByLower[m.name.trim().toLowerCase()] = m.id; });
        var dailyMinutes = (state.settings.shiftsPerDay || 2) * 480; // założenie: 8h na zmianę, do poprawienia ręcznie w tabeli

        var upserts = [], skippedMachine = 0, skippedQty = 0;
        parsed.forEach(function (row) {
          var pid = existingProductsLower[row.name.toLowerCase()];
          var mid = machinesByLower[row.machineName.toLowerCase()];
          if (!mid) { skippedMachine++; return; }
          if (!row.qty || row.qty <= 0) { skippedQty++; return; }
          upserts.push({ product_id: pid, machine_id: mid, ideal_cycle_sec: (dailyMinutes * 60) / row.qty });
        });

        var rateError = null;
        if (upserts.length) {
          var upRes = await sb.from("product_rates").upsert(upserts, { onConflict: "product_id,machine_id" });
          if (upRes.error) rateError = upRes.error;
        }

        btn.disabled = false;
        await loadCompanyData();
        renderAdmin(document.getElementById("adminRoot"));
        var freshMsg = document.getElementById("importProductsMsg");
        if (freshMsg) {
          if (rateError) {
            freshMsg.textContent = "Produkty dodane, ale zapisanie wydajności nie powiodło się: " + rateError.message;
            freshMsg.classList.add("show", "error");
          } else {
            var parts = [];
            if (insertedCount) parts.push("nowych produktów: " + insertedCount);
            parts.push("zapisanych wydajności: " + upserts.length);
            if (skippedMachine) parts.push("pominięto, nieznana maszyna: " + skippedMachine);
            if (skippedQty) parts.push("pominięto, brak ilości: " + skippedQty);
            freshMsg.textContent = "Zaimportowano — " + parts.join(", ") + ".";
            freshMsg.classList.add("show");
            setTimeout(function () { freshMsg.classList.remove("show"); }, 6000);
          }
        }
      });
    });
  }

    });
    wireImportHandler("operators", "operators", function (rows) {
      return rowsToNewOperators(rows, state.operators).map(function (o) { return { company_id: session.company.id, name: o.name, pin: o.pin }; });
    });
    wireProductsImportHandler();
  }

  /* =====================================================================
     WIDOK OPERATORA
     ===================================================================== */

  function shiftOptionsHtml(n) {
    var labels = ["I", "II", "III"];
    var html = "";
    for (var i = 1; i <= n; i++) html += '<option value="' + i + '">Zmiana ' + labels[i - 1] + '</option>';
    return html;
  }

  function renderOperator(root) {
    if (!state.machines.length) {
      root.innerHTML = bannerHtml() + '<div class="op-hero"><div class="op-card"><div class="op-title">Jeszcze nie ma żadnej maszyny</div>' +
        '<div class="op-sub">Administrator musi najpierw dodać maszynę w panelu administratora, zanim będzie można wpisywać zmiany.</div></div></div>';
      return;
    }
    if (!state.operators.length) {
      root.innerHTML = bannerHtml() + '<div class="op-hero"><div class="op-card"><div class="op-title">Jeszcze nie ma żadnego operatora</div>' +
        '<div class="op-sub">Administrator musi najpierw dodać operatora (imię + PIN) w panelu administratora, zanim będzie można wpisywać zmiany.</div></div></div>';
      return;
    }
    var machOpts = state.machines.map(function (m) { return '<option value="' + m.id + '">' + m.name + '</option>'; }).join("");
    var opOpts = state.operators.map(function (o) { return '<option value="' + o.id + '">' + o.name + '</option>'; }).join("");

    root.innerHTML = bannerHtml() +
      '<div class="op-hero"><div class="op-card">' +
      '<div class="op-title">Wpis zmiany</div><div class="op-sub">Wybierz siebie z listy, podaj swój PIN i wpisz dane po zakończonej zmianie — OEE policzy się automatycznie.</div>' +
      '<div class="op-feedback" id="opFeedback"><span>Zapisano zmianę.</span><span class="big num tabular" id="opFeedbackOee">—</span><span id="opFeedbackNote"></span></div>' +
      '<form class="form-grid" id="opForm" style="margin-top:20px;">' +
      '<div class="field span-3"><label for="fOperator">Kto wypełnia?</label><select id="fOperator">' + opOpts + '</select></div>' +
      '<div class="field span-3"><label for="fPin">Twój PIN</label><input id="fPin" type="text" inputmode="numeric" maxlength="6" placeholder="np. 1234"></div>' +
      '<div class="field span-3"><label for="fShiftNum">Zmiana</label><select id="fShiftNum">' + shiftOptionsHtml(state.settings.shiftsPerDay) + '</select></div>' +
      '<div class="field span-3"><label for="fMachine">Maszyna</label><select id="fMachine">' + machOpts + '</select></div>' +
      '<div class="field span-3"><label for="fDate">Data</label><input id="fDate" type="date"></div>' +
      '<div class="field span-3"><label for="fProduct">Produkt</label><select id="fProduct"></select></div>' +
      '<div class="field span-3" id="cycleField"><label>Norma (s/szt.)</label><input id="fCycleAuto" type="text" disabled></div>' +
      '<div id="rateHintSlot"></div>' +
      '<div class="field"><label for="fPlanned">Czas planowany (min)</label><input id="fPlanned" type="number" min="1" step="1" placeholder="480"></div>' +
      '<div class="field"><label for="fDowntime">Przestoje (min)</label><input id="fDowntime" type="number" min="0" step="1" placeholder="45"></div>' +
      '<div class="field"><label for="fGood">Sztuki dobre</label><input id="fGood" type="number" min="0" step="1" placeholder="720"></div>' +
      '<div class="field"><label for="fBad">Sztuki wadliwe</label><input id="fBad" type="number" min="0" step="1" placeholder="18"></div>' +
      '<div class="form-actions"><button type="submit" class="primary" id="opSubmitBtn">Zapisz zmianę</button><span class="form-msg" id="opFormMsg">Zapisano.</span></div>' +
      '</form></div></div>';

    document.getElementById("fDate").value = new Date().toISOString().slice(0, 10);

    var machSel = document.getElementById("fMachine");
    var prodSel = document.getElementById("fProduct");
    var cycleAuto = document.getElementById("fCycleAuto");
    var hintSlot = document.getElementById("rateHintSlot");

    function refreshProducts() {
      var machineId = machSel.value;
      var matching = state.products.filter(function (p) { return state.productRates[p.id] && state.productRates[p.id][machineId] != null; });
      if (matching.length) {
        prodSel.disabled = false;
        prodSel.innerHTML = matching.map(function (p) { return '<option value="' + p.id + '">' + p.name + '</option>'; }).join("");
        hintSlot.innerHTML = "";
        updateCycle();
      } else {
        prodSel.innerHTML = '<option value="">— brak zdefiniowanych produktów —</option>';
        cycleAuto.value = "";
        hintSlot.innerHTML = '<div class="field span-3"><label for="fCycleManual">Czas cyklu ręcznie (s/szt.)</label><input id="fCycleManual" type="number" min="0.1" step="0.1" placeholder="30"><span class="hint warn">Administrator nie ustawił jeszcze wydajności produktów dla tej maszyny.</span></div>';
      }
    }
    function updateCycle() {
      var machineId = machSel.value, productId = prodSel.value;
      var rate = state.productRates[productId] ? state.productRates[productId][machineId] : null;
      cycleAuto.value = rate ? (rate + " s/szt.") : "";
    }
    machSel.addEventListener("change", refreshProducts);
    prodSel.addEventListener("change", updateCycle);
    refreshProducts();

    document.getElementById("opForm").addEventListener("submit", async function (evt) {
      evt.preventDefault();
      var opMsg = document.getElementById("opFormMsg");
      opMsg.classList.remove("show", "error");

      var operatorId = document.getElementById("fOperator").value;
      var enteredPin = document.getElementById("fPin").value.trim();
      var chosenOp = state.operators.filter(function (o) { return o.id === operatorId; })[0];
      if (!chosenOp || enteredPin !== chosenOp.pin) {
        opMsg.textContent = "Błędny PIN dla wybranej osoby.";
        opMsg.classList.add("show", "error");
        document.getElementById("fPin").focus();
        return;
      }

      var machineId = machSel.value, productId = prodSel.value || null;
      var manualCycle = document.getElementById("fCycleManual");
      var idealCycleSec = productId ? (state.productRates[productId] ? state.productRates[productId][machineId] : null) : (manualCycle ? parseFloat(manualCycle.value) : null);
      if (!idealCycleSec) { (manualCycle || cycleAuto).focus(); return; }

      var row = {
        company_id: session.company.id,
        machine_id: machineId,
        operator_id: operatorId,
        shift_number: parseInt(document.getElementById("fShiftNum").value, 10),
        product_id: productId,
        shift_date: document.getElementById("fDate").value || new Date().toISOString().slice(0, 10),
        planned_min: parseFloat(document.getElementById("fPlanned").value) || 0,
        downtime_min: parseFloat(document.getElementById("fDowntime").value) || 0,
        ideal_cycle_sec: idealCycleSec,
        good_count: parseFloat(document.getElementById("fGood").value) || 0,
        bad_count: parseFloat(document.getElementById("fBad").value) || 0
      };
      var submitBtn = document.getElementById("opSubmitBtn");
      submitBtn.disabled = true;
      var res = await sb.from("shifts").insert(row);
      submitBtn.disabled = false;

      if (res.error) {
        var msg = document.getElementById("opFormMsg");
        if (msg) { msg.textContent = "Nie udało się zapisać: " + res.error.message; msg.classList.add("show", "error"); }
        return;
      }

      await loadCompanyData();
      var shiftForCalc = { plannedMin: row.planned_min, downtimeMin: row.downtime_min, idealCycleSec: row.ideal_cycle_sec, good: row.good_count, bad: row.bad_count };
      var m = calc(shiftForCalc); var t = tier(m.oee);
      renderOperator(root); // odśwież formularz (pusty, gotowy na kolejny wpis) PRZED wypełnieniem podsumowania
      document.getElementById("opFeedbackOee").textContent = fmtPct(m.oee) + " OEE";
      document.getElementById("opFeedbackOee").style.color = "var(--status-" + t.key + ")";
      document.getElementById("opFeedbackNote").textContent = "— " + t.label + ", zapisano dla " + machineName(machineId);
      document.getElementById("opFeedback").classList.add("show");
    });
  }

  /* =====================================================================
     LOGOWANIE (magic link, bez haseł)
     ===================================================================== */

  function loginScreenHtml() {
    if (authScreen === "check-email") {
      return '<div class="gate-card"><div class="section-head"><div class="eyebrow">Sprawdź skrzynkę</div><div class="section-title small">Wysłaliśmy link logowania</div>' +
        '<div class="section-sub">Kliknij link w wiadomości e-mail, żeby się zalogować. Możesz zamknąć tę kartę.</div></div>' +
        '<button type="button" class="ghost" id="backToLoginBtn">Wróć</button></div>';
    }
    var isSignup = authScreen === "signup";
    return '<div class="gate-card' + (isSignup ? ' wide' : '') + '">' +
      '<div class="brand-block" style="margin-bottom:2px;"><div class="wordmark">POSTOJOMIERZ<span>.</span></div></div>' +
      '<div class="section-head"><div class="eyebrow">' + (isSignup ? "Nowy warsztat" : "Logowanie") + '</div>' +
      '<div class="section-title small">' + (isSignup ? "Załóż konto firmy" : "Zaloguj się") + '</div>' +
      '<div class="section-sub">' + (isSignup ? "Dostaniesz e-mailem link logowania — bez hasła do zapamiętania." : "Podaj e-mail, wyślemy link logowania.") + '</div></div>' +
      '<form id="authForm">' +
      (isSignup ? '<div class="field"><label for="authCompany">Nazwa firmy</label><input id="authCompany" type="text" placeholder="np. Warsztat Kowalski" required></div>' +
        '<div class="field"><label for="authName">Twoje imię i nazwisko</label><input id="authName" type="text" placeholder="Jan Kowalski" required></div>' : '') +
      '<div class="field"><label for="authEmail">E-mail</label><input id="authEmail" type="email" placeholder="ty@firma.pl" required></div>' +
      '<button type="submit" class="primary">Wyślij link logowania</button>' +
      (authError ? '<div class="form-msg show error">' + authError + '</div>' : '') +
      '</form>' +
      '<button type="button" class="ghost" id="toggleAuthMode">' + (isSignup ? "Masz już konto? Zaloguj się" : "Zakładasz warsztat pierwszy raz? Załóż konto firmy") + '</button>' +
      '</div>';
  }

  function wireLoginEvents() {
    var toggle = document.getElementById("toggleAuthMode");
    if (toggle) toggle.addEventListener("click", function () {
      authScreen = authScreen === "signup" ? "login" : "signup";
      authError = "";
      renderApp();
    });
    var back = document.getElementById("backToLoginBtn");
    if (back) back.addEventListener("click", function () { authScreen = "login"; renderApp(); });

    var form = document.getElementById("authForm");
    if (form) form.addEventListener("submit", async function (evt) {
      evt.preventDefault();
      authError = "";
      var email = document.getElementById("authEmail").value.trim();
      if (!email) return;
      var opts = { emailRedirectTo: REDIRECT_TO };
      if (authScreen === "signup") {
        var company = document.getElementById("authCompany").value.trim();
        var name = document.getElementById("authName").value.trim();
        if (!company || !name) return;
        opts.data = { company_name: company, display_name: name };
      }
      var submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      var res = await sb.auth.signInWithOtp({ email: email, options: opts });
      submitBtn.disabled = false;
      if (res.error) { authError = res.error.message; renderApp(); return; }
      authScreen = "check-email";
      renderApp();
    });
  }

  /* =====================================================================
     SZKIELET / PRZEŁĄCZNIK WIDOKÓW
     ===================================================================== */

  function headerHtml() {
    var isAdmin = session.profile.role === "admin";
    return '<header class="topbar"><div class="brand-block"><div class="wordmark">POSTOJOMIERZ<span>.</span></div>' +
      '<div class="tagline">Widzisz w minutę, gdzie warsztat traci produkcję.</div></div>' +
      '<div class="topbar-right"><div class="role-tabs">' +
      '<button type="button" class="role-tab ' + (view === "operator" ? "active" : "") + '" data-role="operator">Wpis operatora</button>' +
      (isAdmin ? '<button type="button" class="role-tab ' + (view === "admin" ? "active" : "") + '" data-role="admin">Panel administratora</button>' : '') +
      '</div><div class="topbar-meta"><span class="num tabular" id="todayLabel"></span>' +
      '<button type="button" class="ghost small" id="signOutBtn">Wyloguj (' + session.user.email + ')</button></div></div></header>';
  }

  function footerHtml() {
    return '<footer><span>Dane firmy „' + session.company.name + '" są bezpiecznie oddzielone od danych innych firm.</span><span>Postojomierz — ' + new Date().getFullYear() + '</span></footer>';
  }

  function renderApp() {
    var app = document.getElementById("app");

    if (booting) { app.innerHTML = '<div class="boot-loading">Wczytywanie…</div>'; return; }

    if (!session) {
      app.innerHTML = loginScreenHtml();
      wireLoginEvents();
      return;
    }

    if (view === "admin" && session.profile.role !== "admin") view = "operator";

    var viewportHtml = view === "admin" ? '<div id="adminRoot"></div>' : '<div id="operatorRoot"></div>';
    app.innerHTML = headerHtml() + '<div id="viewport">' + viewportHtml + '</div>' + footerHtml();
    document.getElementById("todayLabel").textContent = new Date().toLocaleDateString("pl-PL", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });

    app.querySelectorAll("[data-role]").forEach(function (btn) {
      btn.addEventListener("click", function () { view = btn.getAttribute("data-role"); renderApp(); });
    });
    var signOutBtn = document.getElementById("signOutBtn");
    if (signOutBtn) signOutBtn.addEventListener("click", function () { sb.auth.signOut(); });

    if (view === "admin") renderAdmin(document.getElementById("adminRoot"));
    else renderOperator(document.getElementById("operatorRoot"));
  }

  /* ---------- autoryzacja i start ---------- */

  async function handleAuthChange(authSession) {
    if (!authSession) {
      session = null;
      booting = false;
      renderApp();
      return;
    }
    var profR = await sb.from("profiles").select("*, companies(*)").eq("id", authSession.user.id).single();
    if (profR.error || !profR.data) {
      // Trigger, który tworzy profil, mógł jeszcze nie zdążyć — spróbuj raz jeszcze po chwili.
      await new Promise(function (r) { setTimeout(r, 1200); });
      profR = await sb.from("profiles").select("*, companies(*)").eq("id", authSession.user.id).single();
    }
    if (profR.error || !profR.data) {
      authError = "Nie udało się wczytać konta. Odśwież stronę za chwilę.";
      session = null;
      booting = false;
      renderApp();
      return;
    }
    session = {
      user: authSession.user,
      profile: { id: profR.data.id, role: profR.data.role, displayName: profR.data.display_name },
      company: { id: profR.data.companies.id, name: profR.data.companies.name, shiftsPerDay: profR.data.companies.shifts_per_day }
    };
    view = session.profile.role === "admin" ? "admin" : "operator";
    await loadCompanyData();
    booting = false;
    renderApp();
  }

  async function boot() {
    backdrop = document.getElementById("modalBackdrop");
    modalBox = document.getElementById("modalBox");
    backdrop.addEventListener("click", function (evt) { if (evt.target === backdrop) closeModal(); });
    document.addEventListener("keydown", function (evt) { if (evt.key === "Escape" && backdrop.classList.contains("open")) closeModal(); });

    if (!sb) {
      booting = false;
      var app = document.getElementById("app");
      app.innerHTML = '<div class="gate-card"><div class="section-head"><div class="eyebrow">Błąd konfiguracji</div><div class="section-title small">Brak połączenia z bazą danych</div>' +
        '<div class="section-sub">Nie udało się wczytać biblioteki Supabase. Sprawdź połączenie z internetem i odśwież stronę.</div></div></div>';
      return;
    }

    sb.auth.onAuthStateChange(function (event, authSession) {
      if (event === "SIGNED_OUT") { session = null; renderApp(); return; }
      if (event === "INITIAL_SESSION") return; // obsłużone niżej przez getSession()
      handleAuthChange(authSession);
    });

    var got = await sb.auth.getSession();
    await handleAuthChange(got.data ? got.data.session : null);
  }

  boot();
})();
</script>
