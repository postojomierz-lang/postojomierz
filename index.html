  // eksport do Excela (SheetJS, ta sama biblioteka co import plików) — kilka arkuszy:
  // podsumowanie, maszyny, przestoje, operatorzy
  function exportReportExcel(data) {
    if (!window.XLSX) { bannerMsg = "Biblioteka do zapisu Excela się nie wczytała. Odśwież stronę i spróbuj ponownie."; renderApp(); return; }
    var wb = XLSX.utils.book_new();
    var rangeTxt = data.from && data.to ? (fmtDate(data.from) + " – " + fmtDate(data.to)) : "—";
    var summary = [
      ["Postojomierz+ — raport okresu"],
      ["Firma", session.company.name],
      ["Okres", rangeTxt],
      ["Liczba zmian", data.shiftCount],
      ["Wygenerowano", fmtDate(data.generatedAt)],
      [],
      ["OEE", fmtPct(data.shop.oee)],
      ["Dostępność", fmtPct(data.shop.availability)],
      ["Wydajność", fmtPct(data.shop.performance)],
      ["Jakość", fmtPct(data.shop.quality)],
      ["Sztuk dobrych", data.totalGood],
      ["Sztuk wadliwych", data.totalBad]
    ];
    if (data.hasDowntimeCost) summary.push(["Koszt przestojów (zł)" + (data.downtimeCostComplete ? "" : ", co najmniej"), Math.round(data.totalDowntimeCost * 100) / 100]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), "Podsumowanie");

    var machineRows = [["Maszyna", "OEE", "Dostępność", "Wydajność", "Jakość", "Zmian", "Dobrych", "Wadliwych"]]
      .concat(data.perMachine.map(function (m) { return [m.name, fmtPct(m.oee), fmtPct(m.availability), fmtPct(m.performance), fmtPct(m.quality), m.shiftCount, m.good, m.bad]; }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(machineRows), "Maszyny");

    var paretoRows = [["Powód przestoju", "Minuty", "Udział", "Narastająco"]]
      .concat(data.pareto.rows.map(function (r) { return [reasonName(r.reasonId), Math.round(r.minutes), Math.round(r.pct * 100) + "%", Math.round(r.cumPct * 100) + "%"]; }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(paretoRows), "Przestoje");

    if (data.perOperator.length) {
      var opRows = [["Operator", "Zmian", "Śr. OEE"]].concat(data.perOperator.map(function (o) { return [o.name, o.count, fmtPct(o.avgOee)]; }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(opRows), "Operatorzy");
    }

    var fname = "raport-" + (session.company.name || "postojomierz").replace(/[^a-z0-9]+/gi, "_").toLowerCase() + "-" + todayStr() + ".xlsx";
    XLSX.writeFile(wb, fname);
  }

      function avgM(key) { return ms.reduce(function (sum, x) { return sum + x[key]; }, 0) / ms.length; }
      return { availability: avgM("availability"), performance: avgM("performance"), quality: avgM("quality") };
    }).filter(Boolean);
    if (!latestByMachine.length) return "";
    function avg(key) { return latestByMachine.reduce(function (sum, x) { return sum + x[key]; }, 0) / latestByMachine.length; }

  function productsHtml() {
    var machineCount = state.machines.length;

    var effectiveFilter = productsMachineFilter;
    if (effectiveFilter === "" && machineCount > 0 && machineCount <= 6) effectiveFilter = "__all__";
    var visibleMachines = effectiveFilter === "__all__" ? state.machines
      : (effectiveFilter ? state.machines.filter(function (m) { return m.id === effectiveFilter; }) : []);

    var q = productsSearch.trim().toLowerCase();
    var visibleProducts = !q ? state.products : state.products.filter(function (p) {
      return (p.name + " " + (p.code || "")).toLowerCase().indexOf(q) !== -1;
    });

    var rateHead = visibleMachines.map(function (m) { return '<th class="num">' + m.name + '</th>'; }).join("");
    var rows = visibleProducts.map(function (p) {
      var search = (p.name + " " + (p.code || "")).toLowerCase();
      var cells = visibleMachines.map(function (m) {
        var v = (state.productRates[p.id] && state.productRates[p.id][m.id] != null) ? state.productRates[p.id][m.id] : "";

        '<td><input type="number" min="0" step="0.01" data-product-min="' + p.id + '" value="' + (p.minQty != null ? p.minQty : "") + '" placeholder="—" style="max-width:90px;"></td>' +
        '<td><input type="number" min="0" step="0.01" data-product-cost="' + p.id + '" value="' + (p.unitCost != null ? p.unitCost : "") + '" placeholder="—" style="max-width:100px;"></td>' +
        cells +
        '<td style="width:1%;white-space:nowrap;"><button type="button" class="small" data-remove-product="' + p.id + '">usuń</button></td></tr>';

    var machineOptions = '<option value="__all__">Wszystkie maszyny</option>' +
      state.machines.map(function (m) { return '<option value="' + m.id + '"' + (effectiveFilter === m.id ? " selected" : "") + '>' + m.name + '</option>'; }).join("");

    var controls = state.products.length
      ? '<div class="inline-add" style="margin-top:6px;">' +
        '<input type="text" id="productsSearchInput" placeholder="Szukaj po nazwie lub kodzie…" value="' + escAttr(productsSearch) + '">' +
        (machineCount ? '<select id="productsMachineFilter">' + machineOptions + '</select>' : '') +
        '</div>'
      : '';

    var hintMsg = (!visibleMachines.length && machineCount > 6)
      ? '<div class="empty-hint">Masz ' + machineCount + ' maszyn — wybierz jedną z listy wyżej, żeby zobaczyć i ustawić jej wydajności. Bez wyboru tabela pokazuje tylko kod i nazwę produktu.</div>'
      : '';

    var table = '<div class="table-scroll" style="margin-top:12px;"><table class="compact"><thead><tr><th style="min-width:120px;">Kod produktu</th><th style="min-width:220px;">Nazwa produktu</th><th>Próg min.</th><th>Koszt jedn. (zł)</th>' + rateHead + '<th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    var tableOrHint = state.products.length ? (hintMsg + table) : '<div class="empty-hint">Brak produktów — dodaj pierwszy poniżej.</div>';

    return '<div class="panel"><div class="section-head"><div class="eyebrow">Słownik</div><h2 class="section-title small">Produkty i wydajność na maszynach</h2>' +
      '<div class="section-sub">Kod i nazwę produktu edytujesz wprost w tabeli. Próg min. jest opcjonalny — jeśli go wpiszesz, spadek sumy stanu (Stan wyrobów gotowych niżej) poniżej progu trafi do Alertów w Panelu kierownika. Koszt jednostkowy jest opcjonalny — jeśli go wpiszesz, appka policzy orientacyjną wartość magazynu (zakładka Magazyny). Czas cyklu idealnego (s/szt.) dla każdej pary produkt–maszyna — puste pole = produkt nie jest robiony na tej maszynie.' +
      (state.machines.length ? '' : ' Dodaj najpierw przynajmniej jedną maszynę, żeby ustawiać wydajności.') + '</div></div>' +
      controls + tableOrHint +
      '<form class="inline-add" id="addProductForm">' +
      '<input type="text" id="newProductCode" placeholder="Kod produktu (opcjonalnie)" maxlength="30" style="max-width:180px;">' +
      '<input type="text" id="newProductName" placeholder="Nazwa produktu" maxlength="250">' +
      '<button type="submit" class="primary">Dodaj</button></form>' +
      (state.products.length ? '<div class="form-actions" style="margin-top:14px;"><button type="button" class="ghost" id="saveRatesBtn">Zapisz zmiany</button><span class="form-msg" id="rateMsg">Zapisano.</span></div>' : '') +
      '</div>';

  // stan magazynowy WYROBÓW GOTOWYCH (product_stock) — osobny panel od tabeli produktów/wydajności
  // wyżej, bo to inny rytm pracy (rzadkie wczytanie stanu, nie codzienna edycja). Ten sam wzorzec
  // co stan surowców w Zapotrzebowaniu: suma po zaznaczonych magazynach + import do jednego magazynu.
  function productStockHtml() {
    var rows = state.products.map(function (p) {
      var stock = productStockQty(p.id, prodStockWarehouseFilter);
      return { p: p, stock: stock };
    }).filter(function (r) { return r.stock != null; })
      .sort(function (a, b) { return a.p.name.localeCompare(b.p.name, "pl", { sensitivity: "base" }); });
    var body = rows.map(function (r) {
      // próg min. dotyczy zawsze SUMY ze wszystkich magazynów (jak w Alertach), niezależnie
      // od tego, czy powyższy filtr aktualnie zawęża widok do części magazynów
      var totalStock = productStockQty(r.p.id, null);
      var low = r.p.minQty != null && totalStock != null && totalStock < r.p.minQty;
      return '<tr><td>' + escAttr(r.p.code ? r.p.code + " — " + r.p.name : r.p.name) + '</td>' +
        '<td class="num tabular"' + (low ? ' style="color:var(--status-warn);font-weight:600;"' : '') + '>' + fmtQty(r.stock) + (low ? " ⚠" : "") + '</td></tr>';
    }).join("");
    var table = body
      ? '<div class="table-scroll" style="margin-top:12px;"><table class="compact"><thead><tr><th>Produkt</th><th class="num">Stan' + (prodStockWarehouseFilter ? " (wybrane magazyny)" : "") + '</th></tr></thead><tbody>' + body + '</tbody></table></div>'
      : '<div class="empty-hint">Żaden produkt nie ma jeszcze wczytanego stanu magazynowego — wczytaj go poniżej.</div>';
    var warehouseFilterBlock = state.warehouses.length
      ? '<div class="inline-add" style="margin-top:10px;flex-wrap:wrap;"><span class="hint">Licz stan z magazynów:</span> ' + warehouseCheckboxesHtml("prodstock", prodStockWarehouseFilter) + '</div>'
      : '<div class="empty-hint">Brak zdefiniowanych magazynów — dodaj je w zakładce Magazyny, żeby móc wczytać stan.</div>';
    var importWhOptions = state.warehouses.map(function (w) { return '<option value="' + w.id + '">' + escAttr(w.name) + '</option>'; }).join("");
    var importBlock = state.warehouses.length
      ? '<div class="import-box" style="margin-top:14px;"><div class="import-head"><span class="eyebrow">Wczytaj stan magazynowy produktów</span><span class="hint">Jeden produkt w linii: Kod albo Nazwa;Ilość na stanie (działa też przecinek albo tabulator). Dopasowujemy po kodzie, a jeśli go nie ma — po nazwie; produkt musi już być na liście powyżej. Nadpisuje stan TYLKO w wybranym niżej magazynie. Plik Excel (.xlsx): pierwsza kolumna kod/nazwa, druga ilość.</span></div>' +
      '<div class="inline-add"><select id="importProdStockWarehouse">' + importWhOptions + '</select><input type="file" id="importProdStockFile" accept=".csv,.txt,.xlsx,.xls"><button type="button" class="ghost small" id="importProdStockBtn">Wczytaj</button></div>' +
      '<span class="form-msg" id="importProdStockMsg"></span></div>'
      : '';
    return '<div class="panel" style="margin-top:16px;"><div class="section-head"><div class="eyebrow">Stan magazynowy</div><h2 class="section-title small">Stan wyrobów gotowych</h2>' +
      '<div class="section-sub">Ile którego produktu jest fizycznie na stanie — per magazyn, sumowane po zaznaczonych niżej. Ustawiasz go wyłącznie importem z pliku (tak jak stan surowców w Zapotrzebowaniu).</div></div>' +
      warehouseFilterBlock + table + importBlock + '</div>';
  }

    return MATERIAL_UNITS.map(function (u) { return '<option value="' + u.key + '"' + (u.key === selected ? " selected" : "") + '>' + u.label + '</option>'; }).join("");

  function materialsAdminHtml() {

        '<div class="form-actions" style="margin-top:12px;"><button type="button" class="ghost" id="saveMaterialsBtn">Zapisz zmiany</button><span class="form-msg" id="materialsMsg">Zapisano.</span></div>'

      table +
      '<form class="inline-add" id="addMaterialForm"><input type="text" id="newMaterialCode" placeholder="Kod (opcjonalnie)" maxlength="30" style="max-width:140px;">' +
      '<input type="text" id="newMaterialName" placeholder="Nazwa surowca">' +
      '<select id="newMaterialUnit" style="max-width:110px;">' + materialUnitOptionsHtml("szt") + '</select>' +
      '<button type="submit" class="primary">Dodaj</button></form></div>';
  }

  function warehousesAdminHtml() {
    var totalValue = 0, totalComplete = true;
    var rows = state.warehouses.map(function (w) {
      var matCount = (state.materialStockByMaterial ? Object.keys(state.materialStockByMaterial).reduce(function (n, mid) {
        return n + state.materialStockByMaterial[mid].filter(function (r) { return r.warehouseId === w.id; }).length;
      }, 0) : 0);
      var value = warehouseValue(w.id);
      var complete = warehouseValueComplete(w.id);
      var hasAnyStock = state.materialStock.some(function (r) { return r.warehouseId === w.id && r.qty > 0; }) ||
        state.productStock.some(function (r) { return r.warehouseId === w.id && r.qty > 0; });
      totalValue += value;
      if (!complete) totalComplete = false;
      var valueTxt = hasAnyStock ? (complete ? "" : "≥ ") + fmtQty(value) + " zł" : "—";
      return '<tr><td><input type="text" data-warehouse-name="' + w.id + '" value="' + escAttr(w.name) + '"></td>' +
        '<td class="num">' + matCount + '</td>' +
        '<td class="num tabular">' + valueTxt + '</td>' +
        '<td style="width:1%;white-space:nowrap;"><button type="button" class="small" data-remove-warehouse="' + w.id + '">usuń</button></td></tr>';
    }).join("");
    var valueNote = state.warehouses.length
      ? '<div class="hint" style="margin-top:8px;">Łącznie: ' + (totalComplete ? "" : "≥ ") + fmtQty(totalValue) + ' zł' +
        (totalComplete ? "" : " — nie wszystkie pozycje mają wpisany koszt jednostkowy (Surowce/Produkty), więc to dolna granica, nie pełna wartość") + '.</div>'
      : "";
    var table = state.warehouses.length
      ? '<div class="table-scroll" style="margin-top:12px;"><table class="compact"><thead><tr><th>Nazwa</th><th class="num">Pozycji stanu</th><th class="num">Wartość</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' + valueNote +
        '<div class="form-actions" style="margin-top:12px;"><button type="button" class="ghost" id="saveWarehousesBtn">Zapisz zmiany</button><span class="form-msg" id="warehousesMsg">Zapisano.</span></div>'
      : '<div class="empty-hint">Brak magazynów — dodaj pierwszy poniżej.</div>';
    return '<div class="panel"><div class="section-head"><div class="eyebrow">Słownik</div><h2 class="section-title small">Magazyny</h2>' +
      '<div class="section-sub">Fizyczne lub logiczne miejsca, w których leżą surowce i produkty (np. „Hala A", „Magazyn wyrobów gotowych"). Surowiec/produkt może mieć różny stan w różnych magazynach naraz — sumę i podział ustawiasz w Zapotrzebowaniu (surowce) i tutaj przy Produktach. Magazyny wybierasz też przy tworzeniu inwentaryzacji. Kolumna „Wartość" to ilość razy koszt jednostkowy (Surowce/Produkty) — puste, jeśli nic w tym magazynie nie ma wpisanej ceny. Usunięcie magazynu kasuje stan magazynowy, jaki był w nim zapisany.</div></div>' +
      table +
      '<form class="inline-add" id="addWarehouseForm"><input type="text" id="newWarehouseName" placeholder="Nazwa magazynu"><button type="submit" class="primary">Dodaj</button></form></div>';
  }

     z hali, ci są w Panelu administratora → Operatorzy). Zaproszona osoba
