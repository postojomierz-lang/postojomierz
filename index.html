<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>Postojomierz+</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  /* ===== Design tokens ===== */
  :root {
    color-scheme: light;
    --page:        #EEF1EF;
    --surface:     #FCFDFC;
    --surface-2:   #F2F5F3;
    --border:      rgba(20,32,31,0.13);
    --border-soft: rgba(20,32,31,0.07);
    --ink:         #16211F;
    --ink-2:       #47605C;
    --ink-muted:   #7C8B89;
    --brand:       #0F6E6B;
    --brand-ink:   #FCFDFC;
    --brand-wash:  rgba(15,110,107,0.09);
    --focus:       #0F6E6B;

    --status-good:     #0ca30c;
    --status-good-wash:#0ca30c1a;
    --status-warn:     #b06d00;
    --status-warn-wash:#fab2192b;
    --status-crit:     #d03b3b;
    --status-crit-wash:#d03b3b1a;

    --chart-avail: #0089A6;
    --chart-perf:  #6B4FC7;
    --chart-qual:  #96660B;

    --shadow: 0 1px 2px rgba(16,24,23,0.06), 0 8px 24px -12px rgba(16,24,23,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0F1615;
      --surface:     #17201F;
      --surface-2:   #1D2726;
      --border:      rgba(233,238,237,0.12);
      --border-soft: rgba(233,238,237,0.07);
      --ink:         #E9EEED;
      --ink-2:       #AABAB7;
      --ink-muted:   #85938F;
      --brand:       #3FB3AC;
      --brand-ink:   #0B1211;
      --brand-wash:  rgba(63,179,172,0.14);
      --focus:       #3FB3AC;

      --status-good-wash: #0ca30c2b;
      --status-warn:      #e0a531;
      --status-warn-wash: #fab21930;
      --status-crit-wash: #d03b3b2b;

      --chart-avail: #1B93A6;
      --chart-perf:  #7C67D9;
      --chart-qual:  #C99A1E;

      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0F1615;
    --surface:     #17201F;
    --surface-2:   #1D2726;
    --border:      rgba(233,238,237,0.12);
    --border-soft: rgba(233,238,237,0.07);
    --ink:         #E9EEED;
    --ink-2:       #AABAB7;
    --ink-muted:   #85938F;
    --brand:       #3FB3AC;
    --brand-ink:   #0B1211;
    --brand-wash:  rgba(63,179,172,0.14);
    --focus:       #3FB3AC;

    --status-good-wash: #0ca30c2b;
    --status-warn:      #e0a531;
    --status-warn-wash: #fab21930;
    --status-crit-wash: #d03b3b2b;

    --chart-avail: #1B93A6;
    --chart-perf:  #7C67D9;
    --chart-qual:  #C99A1E;

    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  h1, h2, h3 { text-wrap: balance; margin: 0; }
  .num { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .tabular { font-variant-numeric: tabular-nums; }

  a { color: var(--brand); }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ===== Header ===== */
  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }
  .brand-block { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .wordmark {
    font-family: "Big Shoulders Display", "IBM Plex Sans", sans-serif;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: 0.005em;
    color: var(--ink);
    line-height: 1;
  }
  .wordmark span { color: var(--brand); }
  .tagline { color: var(--ink-2); font-size: 14.5px; max-width: 30ch; }
  .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .topbar-meta {
    text-align: right;
    color: var(--ink-muted);
    font-size: 12.5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-end;
  }
  .topbar-meta .num { color: var(--ink-2); font-size: 13px; }

  .role-tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .role-tab {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }
  .role-tab.active { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }

  .readonly-banner {
    background: var(--status-warn-wash);
    color: var(--ink);
    border: 1px solid var(--status-warn);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
  }
  .readonly-banner b { color: var(--status-warn); }

  /* ===== Section headings ===== */
  .eyebrow {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .section-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .section-title {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--ink);
  }
  .section-title.small { font-size: 21px; }
  .section-sub { color: var(--ink-2); font-size: 13.5px; max-width: 62ch; }

  /* ===== Hero ===== */
  .hero {
    display: grid;
    grid-template-columns: minmax(220px, 300px) 1fr;
    gap: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    box-shadow: var(--shadow);
  }
  @media (max-width: 720px) { .hero { grid-template-columns: 1fr; } }

  .gauge-col { display: flex; flex-direction: column; align-items: center; gap: 10px; justify-content: center; }
  .gauge-figure { position: relative; width: 200px; height: 200px; }
  .gauge-figure svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge-track { fill: none; stroke: var(--surface-2); stroke-width: 14; }
  .gauge-fill { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dasharray 0.6s ease; }
  .gauge-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .gauge-value { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 40px; letter-spacing: -0.01em; }
  .gauge-caption { font-size: 11.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px 4px 8px;
    border-radius: 100px;
    font-size: 12px; font-weight: 600;
    white-space: nowrap;
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status-pill.good { color: var(--status-good); background: var(--status-good-wash); }
  .status-pill.good .dot { background: var(--status-good); }
  .status-pill.warn { color: var(--status-warn); background: var(--status-warn-wash); }
  .status-pill.warn .dot { background: var(--status-warn); }
  .status-pill.crit { color: var(--status-crit); background: var(--status-crit-wash); }
  .status-pill.crit .dot { background: var(--status-crit); }

  .meters-col { display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .meter-row { display: flex; flex-direction: column; gap: 6px; }
  .meter-label-row { display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; }
  .meter-label { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-weight: 500; }
  .meter-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .meter-val { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--ink); }
  .meter-track { height: 8px; border-radius: 100px; background: var(--surface-2); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 100px; }
  .hero-foot { grid-column: 1 / -1; color: var(--ink-muted); font-size: 12.5px; border-top: 1px solid var(--border-soft); padding-top: 14px; }

  /* ===== Legend ===== */
  .legend-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .legend-swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

  /* ===== Machine grid ===== */
  .machine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-name { font-weight: 600; font-size: 15.5px; }
  .card-oee { display: flex; align-items: baseline; gap: 6px; }
  .card-oee .num { font-size: 30px; font-weight: 600; line-height: 1; }
  .card-oee .unit { color: var(--ink-muted); font-size: 13px; }

  .apq-rows { display: flex; flex-direction: column; gap: 7px; }
  .apq-row { display: grid; grid-template-columns: 88px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; }
  .apq-name { color: var(--ink-muted); }
  .apq-track { height: 6px; border-radius: 100px; background: var(--surface-2); overflow: hidden; }
  .apq-fill { height: 100%; border-radius: 100px; }
  .apq-val { text-align: right; color: var(--ink-2); font-weight: 500; }

  .bottleneck { font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  .bottleneck b { color: var(--ink); }

  .spark-wrap { position: relative; }
  .spark-wrap svg { width: 100%; height: 46px; display: block; overflow: visible; }
  .spark-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-muted); margin-top: 4px; }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--ink);
    color: var(--page);
    font-size: 11.5px;
    padding: 5px 9px;
    border-radius: 7px;
    transform: translate(-50%, -130%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s ease;
    z-index: 40;
    font-family: "IBM Plex Mono", monospace;
  }
  .tooltip.show { opacity: 1; }

  /* ===== Panels / forms ===== */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .form-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-top: 18px; }
  @media (max-width: 900px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.span-2 { grid-column: span 2; }
  .field.span-3 { grid-column: span 3; }
  @media (max-width: 900px) { .field.span-2, .field.span-3 { grid-column: span 2; } }
  @media (max-width: 480px) { .field.span-2, .field.span-3 { grid-column: span 1; } }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field .hint { font-size: 11px; color: var(--ink-muted); }
  .field .hint.warn { color: var(--status-warn); }
  input, select {
    font: inherit;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13.5px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    width: 100%;
  }
  select { font-family: "IBM Plex Sans", sans-serif; }
  input:focus, select:focus { border-color: var(--brand); }
  input:disabled, select:disabled { opacity: 0.55; cursor: not-allowed; }
  .form-actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin-top: 4px; flex-wrap: wrap; }
  button.primary {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    background: var(--brand);
    color: var(--brand-ink);
    border: none;
    padding: 11px 20px;
    border-radius: 9px;
    cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.06); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
  button.ghost {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    background: transparent;
    color: var(--ink-2);
    border: 1px dashed var(--border);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  button.small {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    background: var(--surface-2);
    color: var(--ink-2);
    border: 1px solid var(--border);
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
  }
  .form-msg { font-size: 12.5px; color: var(--status-good); opacity: 0; transition: opacity 0.2s ease; }
  .form-msg.show { opacity: 1; }
  .form-msg.error { color: var(--status-crit); }
  .form-msg.warn { color: var(--status-warn); }

  /* ===== Card actions / diagnosis ===== */
  .card-actions { display: flex; flex-direction: column; gap: 6px; }
  .btn-suggest {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    background: var(--brand-wash);
    color: var(--brand);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
  }
  .btn-suggest:hover { filter: brightness(1.04); }
  .diag-note {
    font-size: 11.5px;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .diag-note button {
    font: inherit;
    background: none;
    border: none;
    color: var(--brand);
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }

  /* ===== Modal ===== */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(8,12,11,0.55);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 5vh 16px;
    overflow-y: auto;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    max-width: 640px;
    width: 100%;
    box-shadow: var(--shadow);
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .modal-head h3 {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 22px;
  }
  .modal-sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .modal-close {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--ink-2);
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    flex: none;
    line-height: 1;
  }

  .q-block { display: flex; flex-direction: column; gap: 9px; padding: 14px 0; border-top: 1px solid var(--border-soft); }
  .q-block:first-of-type { border-top: none; padding-top: 0; }
  .q-legend { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .q-num { color: var(--brand); font-family: "IBM Plex Mono", monospace; margin-right: 6px; }
  .q-options { display: flex; flex-direction: column; gap: 6px; }
  .q-option {
    display: flex; align-items: flex-start; gap: 9px;
    font-size: 13px; color: var(--ink-2);
    cursor: pointer;
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid transparent;
  }
  .q-option:hover { background: var(--surface-2); }
  .q-option input { margin-top: 2px; accent-color: var(--brand); flex: none; width: auto; }
  .q-option.checked { background: var(--brand-wash); border-color: var(--brand); color: var(--ink); }

  .rec-summary {
    font-size: 13px;
    color: var(--ink-2);
    background: var(--surface-2);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .rec-summary b { color: var(--ink); }
  .foundational-box {
    font-size: 13px;
    border: 1px dashed var(--status-warn);
    background: var(--status-warn-wash);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--ink);
  }
  .foundational-box .rec-tag { color: var(--status-warn); }
  .rec-list { display: flex; flex-direction: column; gap: 10px; }
  .rec-item { display: flex; gap: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .rec-rank {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 15px;
    color: var(--brand);
    flex: none;
    width: 22px;
  }
  .rec-tag {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    font-weight: 600;
    display: block;
    margin-bottom: 3px;
  }
  .rec-text { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* ===== Table ===== */
  .table-scroll { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; min-width: 860px; background: var(--surface); }
  table.compact { min-width: 560px; }
  table.fixed-layout { table-layout: fixed; }
  table.fixed-layout td { overflow-wrap: break-word; }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    font-weight: 600;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    white-space: nowrap;
  }
  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 13px;
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }
  td.rank-1 .num { color: var(--status-good); font-weight: 700; }

  /* ===== Admin utility panels ===== */
  .admin-tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); flex-wrap: wrap; }
  .admin-tab {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }
  .admin-tab.active { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }
  .period-picker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 14px; }
  .period-tab {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }
  .period-tab.active { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }
  .period-extra { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); padding: 0 6px; }
  .period-extra input[type="number"] { width: 64px; }
  .period-extra input { font-family: "IBM Plex Sans", sans-serif; font-size: 12.5px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  .import-box { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 8px; }

  function unitLabel(key) { var u = MATERIAL_UNITS.filter(function (x) { return x.key === key; })[0]; return u ? u.label : key; }

  /* =====================================================================
     WCZYTYWANIE DANYCH FIRMY Z SUPABASE
     RLS filtruje automatycznie do firmy zalogowanej osoby — nie trzeba
     samodzielnie dopisywać "where company_id = ...".
     ===================================================================== */

  function rowsToProductRates(rows) {
    var out = {};
    rows.forEach(function (r) {
      if (!out[r.product_id]) out[r.product_id] = {};
      out[r.product_id][r.machine_id] = Number(r.ideal_cycle_sec);
    });
    return out;
  }

  function rowsToDiagnoses(rows) {
    var out = {};
    rows.forEach(function (r) {
      out[r.machine_id] = { answers: r.answers, date: (r.updated_at || "").slice(0, 10) };
    });
    return out;
  }

  function shiftFromRow(r) {
    return {
      id: r.id, machineId: r.machine_id, operatorId: r.operator_id,
      shiftNumber: r.shift_number, productId: r.product_id, date: r.shift_date,
      plannedMin: Number(r.planned_min), downtimeMin: Number(r.downtime_min),
      idealCycleSec: Number(r.ideal_cycle_sec), good: Number(r.good_count), bad: Number(r.bad_count),
      status: r.status || "active", createdAt: r.created_at || null, orderId: r.order_id || null
    };
  }

  function orderFromRow(r) {
    return {
      id: r.id, machineId: r.machine_id, productId: r.product_id, targetQty: Number(r.target_qty),
      dueDate: r.due_date || null, note: r.note || "", position: Number(r.position || 0),
      status: r.status || "active", createdAt: r.created_at || null,
      // "Pilne" — ręczny priorytet kierownika, NIE zmienia dueDate (patrz komentarz przy
      // ordersForMachine) — termin zostaje prawdziwy dla Zapotrzebowania/Raportu
      priority: !!r.priority,
      // zlecenia rozpisane automatycznie z receptury na kilka maszyn po kolei dzielą ten
      // sam chainId — chainSeq/chainTotal to tylko etykieta "etap X/N", czysto informacyjna
      // (patrz komentarz przy renderOrderQueue) — reszta zlecenia działa tak samo jak dodane ręcznie
      chainId: r.chain_id || null,
      chainSeq: r.chain_seq != null ? Number(r.chain_seq) : null,
      chainTotal: r.chain_total != null ? Number(r.chain_total) : null
    };
  }

  async function loadCompanyData() {
    var results = await Promise.all([
      sb.from("machines").select("*").order("created_at"),
      sb.from("products").select("*").order("created_at"),
      sb.from("product_rates").select("*"),
      sb.from("shifts").select("*").order("shift_date", { ascending: false }).limit(500),
      sb.from("diagnoses").select("*"),
      sb.from("operators").select("*").order("created_at"),
      sb.from("downtime_reasons").select("*").order("created_at"),
      sb.from("shift_downtimes").select("*").order("created_at", { ascending: false }).limit(2000),
      sb.from("production_orders").select("*").order("position"),
      sb.from("materials").select("*").order("name"),
      sb.from("recipe_materials").select("*"),
      sb.from("recipe_steps").select("*").order("seq_no"),
      sb.from("maintenance_logs").select("*").order("log_date", { ascending: false }).limit(1000),
      sb.from("stocktakes").select("*").order("created_at", { ascending: false }),
      sb.from("stocktake_items").select("*"),
      sb.from("warehouses").select("*").order("name"),
      sb.from("material_stock").select("*"),
      sb.from("product_stock").select("*"),
      sb.from("warehouse_documents").select("*").order("created_at", { ascending: false }),
      sb.from("warehouse_document_items").select("*"),
      sb.from("contractors").select("*").order("name"),
      sb.from("invites").select("*").order("created_at", { ascending: false })
    ]);
    var errs = results.map(function (r) { return r.error; }).filter(Boolean);
    if (errs.length) {
      bannerMsg = "Nie udało się wczytać części danych (" + errs[0].message + "). Odśwież stronę.";
    } else {
      bannerMsg = "";
    }

    // alfabetycznie po nazwie (lokalizacja "pl", bez rozróżniania wielkości liter) — łatwiej
    // znaleźć maszynę/produkt na oko, gdy jest ich dużo, niż po kolejności dodania
    function byName(a, b) { return a.name.localeCompare(b.name, "pl", { sensitivity: "base" }); }
    state.machines = (results[0].data || []).map(function (m) {
      return {
        id: m.id, name: m.name, tpzMin: Number(m.tpz_min || 0),
        // orientacyjny koszt minuty przestoju TEJ maszyny — null = nie wpisano, appka wtedy
        // nie liczy kosztu przestoju wcale (patrz downtimeCostFor w aplikacji)
        downtimeCostPerMin: m.downtime_cost_per_min != null ? Number(m.downtime_cost_per_min) : null
      };
    }).sort(byName);
    state.products = (results[1].data || []).map(function (p) {
      return {
        id: p.id, name: p.name, code: p.code || "", unitCost: p.unit_cost != null ? Number(p.unit_cost) : null,
        minQty: p.min_qty != null ? Number(p.min_qty) : null
      };
    }).sort(byName);
    state.productRates = rowsToProductRates(results[2].data || []);
    state.shifts = (results[3].data || []).map(shiftFromRow);
    state.diagnoses = rowsToDiagnoses(results[4].data || []);
    state.settings = {
      shiftsPerDay: session.company.shiftsPerDay || 2,
      shiftLengthMin: session.company.shiftLengthMin != null ? session.company.shiftLengthMin : 480,
      breakMin: session.company.breakMin || 0,
      ineffectiveMin: session.company.ineffectiveMin || 0,
      alertOeeThreshold: session.company.alertOeeThreshold != null ? session.company.alertOeeThreshold : 0.6,
      alertDowntimePendingHours: session.company.alertDowntimePendingHours != null ? session.company.alertDowntimePendingHours : 24,
      alertNormMissStreak: session.company.alertNormMissStreak != null ? session.company.alertNormMissStreak : 3
    };

    // operatorzy — proste rekordy imię + PIN, nie konta logowania (patrz renderOperator)
    state.operators = (results[5].data || []).map(function (o) { return { id: o.id, name: o.name, pin: o.pin }; });
    state.people = state.operators; // do wyświetlania imion przy zmianach (leaderboard, dziennik)

    state.downtimeReasons = (results[6].data || []).map(function (r) { return { id: r.id, name: r.name }; });
    state.shiftDowntimes = (results[7].data || []).map(function (d) {
      return { id: d.id, shiftId: d.shift_id, reasonId: d.reason_id, minutes: Number(d.minutes), note: d.note || "", status: d.status, createdAt: d.created_at };
    });
    state.downtimesByShift = {};
    state.shiftDowntimes.forEach(function (d) {
      if (!state.downtimesByShift[d.shiftId]) state.downtimesByShift[d.shiftId] = [];
      state.downtimesByShift[d.shiftId].push(d);
    });

    state.orders = (results[8].data || []).map(orderFromRow);

    state.materials = (results[9].data || []).map(function (m) {
      return {
        id: m.id, name: m.name, unit: m.unit, code: m.code || "",
        // stan magazynowy: migawka z ostatniego importu (patrz Zapotrzebowanie), NIE licznik
        // wyliczany na bieżąco — to jedyna wartość w tym module, którą świadomie TRZYMAMY,
        // bo pochodzi z zewnątrz (MRP zakładu), nie da się jej policzyć z niczego w aplikacji.
        // null = nigdy nie zaimportowano (pokazujemy "—", nie 0 — inaczej fałszywy alarm "brak")
        stockQty: m.stock_qty != null ? Number(m.stock_qty) : null,
        stockUpdatedAt: m.stock_updated_at || null,
        location: m.location || "",
        unitCost: m.unit_cost != null ? Number(m.unit_cost) : null,
        minQty: m.min_qty != null ? Number(m.min_qty) : null
      };
    })
      .sort(function (a, b) { return a.name.localeCompare(b.name, "pl", { sensitivity: "base" }); });
    state.recipeMaterials = (results[10].data || []).map(function (r) { return { productId: r.product_id, materialId: r.material_id, qtyPerUnit: Number(r.qty_per_unit) }; });
    state.recipeMaterialsByProduct = {};
    state.recipeMaterials.forEach(function (r) {
      if (!state.recipeMaterialsByProduct[r.productId]) state.recipeMaterialsByProduct[r.productId] = [];
      state.recipeMaterialsByProduct[r.productId].push(r);
    });
    state.recipeSteps = (results[11].data || []).map(function (r) { return { productId: r.product_id, seqNo: Number(r.seq_no), machineId: r.machine_id, cycleTimeSec: Number(r.cycle_time_sec) }; });
    state.recipeStepsByProduct = {};
    state.recipeSteps.forEach(function (r) {
      if (!state.recipeStepsByProduct[r.productId]) state.recipeStepsByProduct[r.productId] = [];
      state.recipeStepsByProduct[r.productId].push(r);
    });
    Object.keys(state.recipeStepsByProduct).forEach(function (pid) {
      state.recipeStepsByProduct[pid].sort(function (a, b) { return a.seqNo - b.seqNo; });
    });

    state.maintenanceLogs = (results[12].data || []).map(function (m) {
      return {
        id: m.id, machineId: m.machine_id, date: m.log_date, kind: m.kind,
        description: m.description || "",
        downtimeMin: m.downtime_min != null ? Number(m.downtime_min) : null,
        cost: m.cost != null ? Number(m.cost) : null
      };
    });

    state.stocktakes = (results[13].data || []).map(function (s) {
      return { id: s.id, name: s.name, createdAt: s.created_at, closedAt: s.closed_at || null };
    });
    // jeden arkusz (stocktake_item) = jeden surowiec/produkt W JEDNYM magazynie (sheetNo —
    // unikalny numer arkusza w obrębie spisu, patrz Inwentaryzacja). itemKind rozróżnia
    // surowiec/produkt (materialId/productId — tylko jeden z nich ustawiony, albo żaden dla
    // "pustego" arkusza spisanego ręcznie na hali bez ewidencji).
    state.stocktakeItems = (results[14].data || []).map(function (i) {
      return {
        id: i.id, stocktakeId: i.stocktake_id, sheetNo: Number(i.sheet_no),
        materialId: i.material_id || null, productId: i.product_id || null,
        itemKind: i.item_kind || null, warehouseId: i.warehouse_id || null,
        code: i.code || "", name: i.name || "", unit: i.unit || "", createdAt: i.created_at,
        count1Qty: i.count1_qty != null ? Number(i.count1_qty) : null,
        count2Qty: i.count2_qty != null ? Number(i.count2_qty) : null
      };
    }).sort(function (a, b) { return a.sheetNo - b.sheetNo; });
    state.stocktakeItemsByStocktake = {};
    state.stocktakeItems.forEach(function (i) {
      if (!state.stocktakeItemsByStocktake[i.stocktakeId]) state.stocktakeItemsByStocktake[i.stocktakeId] = [];
      state.stocktakeItemsByStocktake[i.stocktakeId].push(i);
    });

    // magazyny — prosty słownik firmy (jak maszyny/powody przestojów)
    state.warehouses = (results[15].data || []).map(function (w) { return { id: w.id, name: w.name }; }).sort(byName);

    // stan magazynowy PER magazyn — surowiec/produkt może mieć różne ilości w różnych
    // magazynach naraz (zastępuje dawne materials.stock_qty, patrz migration-warehouses.sql).
    state.materialStock = (results[16].data || []).map(function (r) {
      return { id: r.id, materialId: r.material_id, warehouseId: r.warehouse_id, qty: Number(r.qty), updatedAt: r.updated_at };
    });
    state.materialStockByMaterial = {};
    state.materialStock.forEach(function (r) {
      if (!state.materialStockByMaterial[r.materialId]) state.materialStockByMaterial[r.materialId] = [];
      state.materialStockByMaterial[r.materialId].push(r);
    });
    state.productStock = (results[17].data || []).map(function (r) {
      return { id: r.id, productId: r.product_id, warehouseId: r.warehouse_id, qty: Number(r.qty), updatedAt: r.updated_at };
    });
    state.productStockByProduct = {};
    state.productStock.forEach(function (r) {
      if (!state.productStockByProduct[r.productId]) state.productStockByProduct[r.productId] = [];
      state.productStockByProduct[r.productId].push(r);
    });

    // kontrahenci — prosta lista dostawców/odbiorców, opcjonalnie podpinana pod WZ/PZ
    // (patrz contractorId niżej w warehouseDocuments).
    state.contractors = (results[20].data || []).map(function (c) {
      return { id: c.id, name: c.name, kind: c.kind || "both", note: c.note || "" };
    });

    // zaproszenia — konta z login-em (nie operatorzy z hali): drugi admin/współwłaściciel
    // albo magazynier. Tylko admin je widzi (RLS invites_admin_all) i tylko admin je tworzy —
    // patrz teamAdminHtml/zakładka "Zespół" niżej.
    state.invites = (results[21].data || []).map(function (i) {
      return { id: i.id, email: i.email, role: i.role, displayName: i.display_name, createdAt: i.created_at, consumedAt: i.consumed_at || null };
    }).sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });

    // dokumenty magazynowe WZ/PZ/RW/MM — patrz komentarz przy warehouseDocumentsHtml niżej.
    // confirmedAt === null -> szkic (stan magazynowy jeszcze nietknięty).
    state.warehouseDocuments = (results[18].data || []).map(function (d) {
      return {
        id: d.id, docType: d.doc_type, docNo: Number(d.doc_no),
        warehouseId: d.warehouse_id || null, targetWarehouseId: d.target_warehouse_id || null,
        contractorId: d.contractor_id || null,
        note: d.note || "", createdAt: d.created_at, confirmedAt: d.confirmed_at || null
      };
    });
    state.warehouseDocumentItems = (results[19].data || []).map(function (i) {
      return {
        id: i.id, documentId: i.document_id, materialId: i.material_id || null, productId: i.product_id || null,
        itemKind: i.item_kind || null, code: i.code || "", name: i.name || "", unit: i.unit || "",
        qty: Number(i.qty), createdAt: i.created_at
      };
    });
    state.warehouseDocumentItemsByDocument = {};
    state.warehouseDocumentItems.forEach(function (i) {
      if (!state.warehouseDocumentItemsByDocument[i.documentId]) state.warehouseDocumentItemsByDocument[i.documentId] = [];
      state.warehouseDocumentItemsByDocument[i.documentId].push(i);
    });
  }

  // suma stanu surowca/produktu po wybranych magazynach (warehouseIds === null → wszystkie
  // magazyny). Używane przez Zapotrzebowanie (checkbox filtr magazynów) i przez wyświetlanie
  // stanu produktów. Zwraca null, jeśli w ogóle nie ma żadnego wpisu stanu (nigdy nie
  // importowano) — odróżniamy to od prawdziwego zera, żeby nie pokazywać fałszywego braku.
  function sumStock(stockRows, warehouseIds) {
    var rows = warehouseIds ? stockRows.filter(function (r) { return warehouseIds.indexOf(r.warehouseId) !== -1; }) : stockRows;
    if (!rows.length) return null;
    return rows.reduce(function (sum, r) { return sum + r.qty; }, 0);
  }
  function materialStockQty(materialId, warehouseIds) {
    return sumStock(state.materialStockByMaterial[materialId] || [], warehouseIds);
  }
  function productStockQty(productId, warehouseIds) {
    return sumStock(state.productStockByProduct[productId] || [], warehouseIds);
  }
  function warehouseName(id) { var w = state.warehouses.filter(function (x) { return x.id === id; })[0]; return w ? w.name : "—"; }

  // orientacyjna wartość magazynu (suma ilość × koszt jednostkowy) — POMIJA ciszej pozycje
  // bez wpisanej ceny (unitCost null), więc to zawsze wartość "co najmniej tyle", nie pełna
  // wycena, jeśli nie wszystko ma wpisaną cenę (patrz warehouseValueComplete niżej)
  function warehouseValue(warehouseId) {
    var matVal = state.materialStock.filter(function (r) { return r.warehouseId === warehouseId; }).reduce(function (sum, r) {
      var mat = state.materials.filter(function (m) { return m.id === r.materialId; })[0];
      return (mat && mat.unitCost != null) ? sum + r.qty * mat.unitCost : sum;
    }, 0);
    var prodVal = state.productStock.filter(function (r) { return r.warehouseId === warehouseId; }).reduce(function (sum, r) {
      var p = state.products.filter(function (x) { return x.id === r.productId; })[0];
      return (p && p.unitCost != null) ? sum + r.qty * p.unitCost : sum;
    }, 0);
    return matVal + prodVal;
  }
  // czy WSZYSTKIE pozycje ze stanem > 0 w tym magazynie mają wpisaną cenę — decyduje, czy
  // warehouseValue() pokazać jako pewną sumę, czy jako "co najmniej" z ostrzeżeniem
  function warehouseValueComplete(warehouseId) {
    var matMissing = state.materialStock.some(function (r) {
      if (r.warehouseId !== warehouseId || !r.qty) return false;
      var mat = state.materials.filter(function (m) { return m.id === r.materialId; })[0];
      return !mat || mat.unitCost == null;
    });
    if (matMissing) return false;
    var prodMissing = state.productStock.some(function (r) {
      if (r.warehouseId !== warehouseId || !r.qty) return false;
      var p = state.products.filter(function (x) { return x.id === r.productId; })[0];
      return !p || p.unitCost == null;
    });
    return !prodMissing;
  }
  function contractorById(id) { return state.contractors.filter(function (c) { return c.id === id; })[0]; }
  function contractorName(id) { var c = contractorById(id); return c ? c.name : "—"; }

  // minuty przestoju faktycznie liczone do OEE dla tej zmiany: tylko ZATWIERDZONE
  // wpisy przestoju się liczą. Zmiany sprzed tej funkcji (albo bez żadnych wpisów
  // przestoju) nie mają nic w downtimesByShift — wtedy ufamy staremu, ręcznie
  // wpisanemu polu downtimeMin, żeby nic wstecz nie przestało się zgadzać.
  function effectiveDowntimeMin(shift) {
    var items = state.downtimesByShift[shift.id];
    if (!items || !items.length) return shift.downtimeMin;
    return items.filter(function (d) { return d.status === "approved"; }).reduce(function (sum, d) { return sum + d.minutes; }, 0);
  }
  function reasonName(id) { var r = state.downtimeReasons.filter(function (x) { return x.id === id; })[0]; return r ? r.name : "—"; }

  // orientacyjny koszt przestoju TEJ zmiany w PLN — null, jeśli maszyna nie ma wpisanego
  // kosztu minuty (patrz machines.downtimeCostPerMin) — pokazujemy wtedy "—", nie 0 zł
  function downtimeCostFor(shift) {
    var m = state.machines.filter(function (x) { return x.id === shift.machineId; })[0];
    if (!m || m.downtimeCostPerMin == null) return null;
    return effectiveDowntimeMin(shift) * m.downtimeCostPerMin;
  }

  /* ---------- cofanie błędów operatorów: poprawki i anulowanie zmian ----------
     Anulowana zmiana (status "cancelled") zostaje widoczna (przekreślona) w
     Historii i na ekranie operatora — dla śladu — ale wypada ze WSZYSTKICH
     wyliczeń OEE/normy/podsumowań (hero, karty maszyn, ranking, Moje wyniki).
     Operator może sam poprawić/anulować WŁASNY wpis tylko tego samego dnia,
     w którym go zapisał (patrz selfEditWindowOpen) — potem tylko kierownik,
     bez ograniczenia czasowego, w Historii. */
  function isActiveShift(s) { return s.status !== "cancelled"; }
  function selfEditWindowOpen(s) { return isActiveShift(s) && (s.createdAt || "").slice(0, 10) === todayStr(); }

  /* ---------- planowanie: kolejka zleceń na maszynę ----------
     Zlecenie (production_orders) nie trzyma "ile zostało" jako osobnej,
     aktualizowanej liczby — postęp (producedForOrder) liczy się za każdym
     razem na nowo z sumy AKTYWNYCH zmian podpiętych przez shifts.order_id,
     tak samo jak norma/OEE. Dzięki temu poprawka albo anulowanie zmiany
     (patrz wyżej) automatycznie i poprawnie przelicza też postęp zlecenia,
     bez dodatkowego kodu synchronizującego — i bez ryzyka rozjazdu, które
     już raz naprawialiśmy przy liczbach opartych na osobnym liczniku. */
  function isActiveOrder(o) { return o.status !== "cancelled"; }
  function orderById(id) { return state.orders.filter(function (o) { return o.id === id; })[0]; }
  function producedForOrder(orderId) {
    return state.shifts.filter(function (s) { return s.orderId === orderId && isActiveShift(s); })
      .reduce(function (sum, s) { return sum + s.good + s.bad; }, 0);
  }
  function orderDone(o) { return producedForOrder(o.id) >= o.targetQty; }
  function orderOverdue(o) { return !!o.dueDate && o.dueDate < todayStr() && !orderDone(o); }
  // kolejka sortuje się automatycznie od najwcześniejszego terminu — przeterminowane
  // (termin wcześniejszy niż dziś) trafiają na górę same z siebie, bo ich data jest
  // najmniejsza. Zlecenia bez terminu (starsze wpisy sprzed wymogu daty) lądują na
  // końcu — nie wiadomo, jak pilne są, więc nie zgadujemy. Przy takim samym terminie
  // `position` jest tylko cichym tie-breakerem (kolejność dodania), nic więcej nie ustawia.
  //
  // Wyjątek: zlecenia oznaczone ręcznie jako "Pilne" (priority) zawsze wskakują NAD
  // resztę, niezależnie od terminu — to świadomy wentyl bezpieczeństwa dla kierownika
  // (zwolniła się maszyna, telefon od klienta) BEZ fałszowania samego terminu, bo na
  // dueDate liczy się Zapotrzebowanie i Raport. Wewnątrz obu grup (pilne / niepilne)
  // nadal obowiązuje sortowanie po terminie jak wyżej.
  function ordersForMachine(machineId) {
    return state.orders.filter(function (o) { return o.machineId === machineId && isActiveOrder(o); })
      .sort(function (a, b) {
        if (!!a.priority !== !!b.priority) return a.priority ? -1 : 1;
        if (a.dueDate !== b.dueDate) {
          if (!a.dueDate) return 1;
          if (!b.dueDate) return -1;
          return a.dueDate < b.dueDate ? -1 : 1;
        }
        return a.position - b.position;
      });
  }
  // etap N-1 tego samego łańcucha (patrz recipeOrderFormHtml) — używane WYŁĄCZNIE do pokazania
  // kierownikowi/operatorowi informacyjnej notatki "poprzedni etap: X/Y szt.", nigdy do blokowania
  // rozpoczęcia produkcji (ustalone wprost: sekwencja receptury jest informacyjna, zawsze da się
  // obejść ręcznie)
  function prevChainOrder(o) {
    if (!o.chainId || !o.chainSeq || o.chainSeq <= 1) return null;
    return state.orders.filter(function (x) { return x.chainId === o.chainId && x.chainSeq === o.chainSeq - 1; })[0] || null;
  }

  /* ---------- planowanie surowców: zapotrzebowanie z aktywnych zleceń × receptura ----------
     "compute, don't store", tak jak reszta planowania: zapotrzebowanie liczy się za każdym
     razem na nowo z AKTYWNYCH, NIEZREALIZOWANYCH zleceń i receptur (BOM), nigdy z osobnego
     zapisanego licznika — więc automatycznie reaguje na każdą zmianę zlecenia/receptury/
     wykonania, bez żadnego kodu synchronizującego. */
  function orderRemainingQty(o) { return Math.max(0, o.targetQty - producedForOrder(o.id)); }

  // zlecenia rozpisane automatycznie z JEDNEJ receptury na kilka maszyn (patrz chainId) to
  // te same fizyczne sztuki przechodzące przez kolejne etapy — surowiec się na nie zużywa
  // RAZ, przy starcie (pierwszy etap łańcucha), więc do zapotrzebowania liczymy tylko etap
  // o najniższym chainSeq w danym łańcuchu; dalsze etapy pomijamy, żeby nie liczyć surowca
  // po raz drugi/trzeci za te same sztuki
  function materialDemandOrders() {
    var byChain = {}, solo = [];
    state.orders.filter(isActiveOrder).forEach(function (o) {
      if (!o.chainId) { solo.push(o); return; }
      if (!byChain[o.chainId] || o.chainSeq < byChain[o.chainId].chainSeq) byChain[o.chainId] = o;
    });
    return solo.concat(Object.keys(byChain).map(function (k) { return byChain[k]; }));
  }

  // "pilność" zlecenia po terminie — tylko do pogrupowania zapotrzebowania w widoku, nie
  // wpływa na nic innego
  function dueBucket(dueDate) {
    if (!dueDate) return "none";
    if (dueDate < todayStr()) return "overdue";
    if (dueDate <= daysFromNowStr(7)) return "soon";
    if (dueDate <= daysFromNowStr(30)) return "month";
    return "later";
  }

  // {materialId: {total, overdue, soon, month, later, none}} — ile którego surowca trzeba
  // ŁĄCZNIE (total) i w rozbiciu na pilność terminu zleceń, z których to zapotrzebowanie
  // pochodzi
  function materialRequirements() {
    var out = {};
    materialDemandOrders().forEach(function (o) {
      var remaining = orderRemainingQty(o);
      if (remaining <= 0) return;
      var bucket = dueBucket(o.dueDate);
      (state.recipeMaterialsByProduct[o.productId] || []).forEach(function (line) {
        var need = line.qtyPerUnit * remaining;
        if (!out[line.materialId]) out[line.materialId] = { total: 0, overdue: 0, soon: 0, month: 0, later: 0, none: 0 };
        out[line.materialId].total += need;
        out[line.materialId][bucket] += need;
      });
    });
    return out;
  }
  // produkty, dla których administrator ustawił wydajność na danej maszynie — używane i przy
  // wpisie zmiany (wybór produktu), i przy dodawaniu zlecenia (żeby nie dało się zaplanować
  // pary maszyna+produkt, której i tak nie da się później wpisać jako zmiany)
  function productsForMachine(machineId) {
    return state.products.filter(function (p) { return state.productRates[p.id] && state.productRates[p.id][machineId] != null; });
  }

  // migawka pól zmiany do zapisania w shift_edits (old_values/new_values) — bez pól
  // czysto technicznych (id/createdAt), żeby log był czytelny przy porównaniu
  function shiftSnapshot(s) {
    return {
      machineId: s.machineId, operatorId: s.operatorId, shiftNumber: s.shiftNumber, productId: s.productId,
      date: s.date, plannedMin: s.plannedMin, good: s.good, bad: s.bad, status: s.status, idealCycleSec: s.idealCycleSec
    };
  }

  async function insertShiftEdit(shiftId, action, editedAs, reason, oldSnap, newSnap) {
    return sb.from("shift_edits").insert({
      shift_id: shiftId, company_id: session.company.id, action: action, edited_as: editedAs,
      reason: reason || null, old_values: oldSnap, new_values: newSnap
    });
  }

  // efektywny, sugerowany "czas planowany" (min) dla danej maszyny: długość zmiany
  // minus przerwa, czas nieefektywny (ustawienia firmy) i TPZ tej konkretnej maszyny
  function effectiveShiftMinutes(machineId) {
    var m = state.machines.filter(function (x) { return x.id === machineId; })[0];
    var tpz = m ? (m.tpzMin || 0) : 0;
    var mins = (state.settings.shiftLengthMin || 0) - (state.settings.breakMin || 0) - (state.settings.ineffectiveMin || 0) - tpz;
    return Math.max(0, mins);
  }

  /* ---------- obliczenia OEE (bez zmian w metodzie) ---------- */

  function calc(shift) {
    var downtimeMin = effectiveDowntimeMin(shift);
    var operatingMin = Math.max(0, shift.plannedMin - downtimeMin);
    var operatingSec = operatingMin * 60;
    var produced = shift.good + shift.bad;
    var availability = shift.plannedMin > 0 ? clamp01(operatingMin / shift.plannedMin) : 0;
    // ile sztuk POWINNO powstać w faktycznie dostępnym czasie (plan minus zatwierdzony
    // przestój) przy normie (idealCycleSec) — to jest punkt odniesienia "norma wykonana czy nie"
    // ORAZ liczba, którą widzi operator jako cel na ekranie. Liczone na nowo za każdym razem
    // z aktualnego stanu zatwierdzeń, więc zatwierdzenie albo odrzucenie przestoju przez
    // admina/kierownika od razu przelicza wynik i ocenę normy.
    var expectedQty = shift.idealCycleSec > 0 ? Math.floor(operatingSec / shift.idealCycleSec) : 0;
    // Wydajność liczona względem TEJ SAMEJ zaokrąglonej w dół liczby sztuk (expectedQty), a nie
    // względem ułamkowej teoretycznej pojemności czasu (operatingSec / idealCycleSec) — inaczej
    // operator, który zrobi dokładnie tyle, ile pokazuje mu ekran jako cel, nigdy nie zobaczy
    // 100%, tylko np. 97,8%, i będzie szukał błędu tam, gdzie go nie ma (samo zaokrąglenie normy
    // w dół zjada resztę). Jeśli dostępny czas nie starcza nawet na jedną całą sztukę
    // (expectedQty = 0, więc nie ma sensownego celu w sztukach), zostaje stara metoda ciągła.
    var performance = expectedQty > 0
      ? clamp01(produced / expectedQty)
      : (operatingSec > 0 ? clamp01((shift.idealCycleSec * produced) / operatingSec) : 0);
    var quality = produced > 0 ? clamp01(shift.good / produced) : 0;
    var oee = availability * performance * quality;
    var normMet = expectedQty > 0 ? produced >= expectedQty : null;
    return { availability: availability, performance: performance, quality: quality, oee: oee, produced: produced, downtimeMin: downtimeMin, expectedQty: expectedQty, normMet: normMet };
  }

  function tier(oee) {
    if (oee >= 0.85) return { key: "good", label: "Dobrze" };
    if (oee >= 0.60) return { key: "warn", label: "Do poprawy" };
    return { key: "crit", label: "Krytycznie" };
  }

  function machineShifts(machineId) {
    return state.shifts
      .filter(function (s) { return s.machineId === machineId && isActiveShift(s); })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  }

  function bottleneckLabel(m) {
    var vals = [
      { key: "availability", label: "dostępność", v: m.availability },
      { key: "performance", label: "wydajność", v: m.performance },
      { key: "quality", label: "jakość", v: m.quality }
    ];
    vals.sort(function (a, b) { return a.v - b.v; });
    return vals[0];
  }

  function machineName(id) { var m = state.machines.filter(function (x) { return x.id === id; })[0]; return m ? m.name : "—"; }
  function operatorName(id) { var o = state.people.filter(function (x) { return x.id === id; })[0]; return o ? o.name : "—"; }
  function productName(id) { var p = state.products.filter(function (x) { return x.id === id; })[0]; return p ? (p.code ? p.code + " — " + p.name : p.name) : "—"; }

  var REC_TEXT = {

  function computeRecommendations(machineId, answers) {
    var hist = machineShifts(machineId);
    var last = hist.length ? calc(hist[hist.length - 1]) : null;
    var bn = last ? bottleneckLabel(last) : null;

    var candidates = [];
    QUESTIONS.forEach(function (q) {
      if (q.id === "tracking") return;
      if (q.type === "scale") {
        var score = answers[q.id];
        if (typeof score !== "number" || score < 2) return;
        var weight = score + (bn && q.comp === bn.key ? 1.5 : 0);
        candidates.push({ key: q.id, comp: q.comp, label: q.label, weight: weight, text: REC_TEXT[q.id] });
      } else if (q.type === "choice" && q.id === "quality") {
        var cause = answers.quality;
        if (!cause) return;
        var w = 2 + (bn && q.comp === bn.key ? 1.5 : 0);
        candidates.push({ key: "quality", comp: "quality", label: q.label, weight: w, text: REC_QUALITY_CAUSE[cause] || REC_QUALITY_CAUSE.unknown });
      }
    });
    candidates.sort(function (a, b) { return b.weight - a.weight; });
    var top = candidates.slice(0, 4);

    var trackingScore = answers.tracking;
    var foundational = (typeof trackingScore === "number" && trackingScore >= 2) ? REC_TEXT.tracking : null;

    if (top.length === 0 && bn) top.push({ key: "generic", comp: bn.key, label: "Priorytet z danych", weight: 0, text: GENERIC_TIP[bn.key] });

    var summary = "";
    if (bn) {
      summary = "Dane z pomiarów pokazują, że najsłabszym ogniwem tej maszyny jest <b>" + bn.label + "</b> (" + Math.round(bn.v * 100) + "%). ";
      summary += (top.length && top[0].comp === bn.key) ? "Odpowiedzi z kwestionariusza wskazują na to samo źródło strat." : "Kwestionariusz wskazuje głównie na inny obszar — warto sprawdzić oba tropy.";
    }
    return { summary: summary, foundational: foundational, items: top };
  }

  function renderQuestionForm(machineId) {
    var saved = state.diagnoses[machineId] ? state.diagnoses[machineId].answers : {};
    var qHtml = QUESTIONS.map(function (q, i) {

    modalBox.innerHTML =
      '<div class="modal-head"><div><h3 id="modalTitle">Zaproponuj poprawę</h3><div class="modal-sub">' + machineName(machineId) + ' — 10+1 pytań do osoby, która zna tę maszynę na co dzień.</div></div>' +

      '<div class="modal-actions" style="margin-top:6px;"><span class="modal-sub" id="diagFormMsg">Odpowiedz najlepiej jak potrafisz — brak pewności też jest odpowiedzią.</span>' +

    modalBox.querySelectorAll(".q-options").forEach(function (group) {
      group.addEventListener("change", function () {
        group.querySelectorAll(".q-option").forEach(function (lbl) { lbl.classList.toggle("checked", lbl.querySelector("input").checked); });
      });
    });
    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    document.getElementById("diagForm").addEventListener("submit", async function (evt) {
      evt.preventDefault();
      var answers = {};

        var checked = modalBox.querySelector('input[name="' + q.id + '"]:checked');
        if (!checked) return;
        answers[q.id] = q.type === "scale" ? parseInt(checked.value, 10) : checked.value;
      });
      var btn = modalBox.querySelector('button[type="submit"]');
      btn.disabled = true;
      var res = await sb.from("diagnoses").upsert(
        { machine_id: machineId, company_id: session.company.id, answers: answers, updated_at: new Date().toISOString() },
        { onConflict: "machine_id" }
      );
      btn.disabled = false;
      if (res.error) {
        var msg = document.getElementById("diagFormMsg");
        if (msg) { msg.textContent = "Nie udało się zapisać: " + res.error.message; msg.style.color = "var(--status-crit)"; }
        return;
      }
      await loadCompanyData();
      renderApp();
      renderResults(machineId);
    });
    openModal();
  }

  function renderResults(machineId) {
    var diag = state.diagnoses[machineId];
    if (!diag) { renderQuestionForm(machineId); return; }
    var r = computeRecommendations(machineId, diag.answers);
    var itemsHtml = r.items.map(function (it, i) {
      return '<div class="rec-item"><span class="rec-rank num">' + (i + 1) + '</span>' +

      '<button type="button" class="modal-close" id="modalCloseBtn" aria-label="Zamknij">✕</button></div>' +
      (r.summary ? '<div class="rec-summary">' + r.summary + '</div>' : '') +

      '<div class="rec-list">' + itemsHtml + '</div>' +
      '<div class="modal-actions"><button type="button" class="ghost" id="redoBtn">Wypełnij ponownie</button><button type="button" class="primary" id="closeResultsBtn">Zamknij</button></div>';

    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    document.getElementById("closeResultsBtn").addEventListener("click", closeModal);
    document.getElementById("redoBtn").addEventListener("click", function () { renderQuestionForm(machineId); });

  /* =====================================================================
     WIDOK ADMINA
     ===================================================================== */

  function apqRow(name, val, color) {
    return '<div class="apq-row"><span class="apq-name">' + name + '</span>' +
      '<span class="apq-track"><span class="apq-fill" style="width:' + (clamp01(val) * 100) + '%;background:' + color + '"></span></span>' +
      '<span class="apq-val num tabular">' + Math.round(val * 100) + '%</span></div>';
  }

  function buildSparkline(hist) {
    var w = 280, h = 46, pad = 4;
    if (hist.length < 2) return { svg: '<svg viewBox="0 0 ' + w + ' ' + h + '"></svg>', points: [] };
    var vals = hist.map(function (s) { return calc(s).oee; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var range = (max - min) || 0.0001;
    var points = vals.map(function (v, i) {
      var x = pad + (i / (vals.length - 1)) * (w - pad * 2);
      var y = h - pad - ((v - min) / range) * (h - pad * 2);
      return { x: x, y: y, v: v, date: hist[i].date };
    });
    var linePath = points.map(function (p, i) { return (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
    var areaPath = linePath + " L" + points[points.length - 1].x.toFixed(1) + "," + h + " L" + points[0].x.toFixed(1) + "," + h + " Z";
    var last = points[points.length - 1];
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<path d="' + areaPath + '" fill="var(--brand-wash)" stroke="none"></path>' +
      '<path d="' + linePath + '" fill="none" stroke="var(--brand)" stroke-width="2" vector-effect="non-scaling-stroke"></path>' +
      '<circle cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) + '" r="3.2" fill="var(--brand)"></circle></svg>';
    return { svg: svg, points: points, w: w };
  }

  function attachSparklineHover(wrapEl, points, w) {
    if (!points.length) return;
    var svg = wrapEl.querySelector("svg");
    var tooltip = document.getElementById("tooltip");
    svg.addEventListener("mousemove", function (evt) {
      var rect = svg.getBoundingClientRect();
      var relX = ((evt.clientX - rect.left) / rect.width) * w;
      var nearest = points[0], best = Infinity;
      points.forEach(function (p) { var d = Math.abs(p.x - relX); if (d < best) { best = d; nearest = p; } });
      tooltip.textContent = fmtDate(nearest.date) + " · " + fmtPct(nearest.v);
      tooltip.style.left = evt.clientX + "px"; tooltip.style.top = evt.clientY + "px";
      tooltip.classList.add("show");
    });
    svg.addEventListener("mouseleave", function () { tooltip.classList.remove("show"); });
  }

  /* =====================================================================
     ANALITYKA — trend OEE w czasie (agregacja dzienna) i Pareto przyczyn
     przestojów, na tych samych zmianach z wybranego okresu (i opcjonalnie
     jednej maszyny) co reszta Panelu kierownika — żadnej nowej tabeli w
     bazie, to wszystko dane, które już zbieramy (shifts, shift_downtimes).
     ===================================================================== */

  // dzienne średnie A/P/Q/OEE ze zmian w okresie (i opcjonalnie jednej maszyny),
  // posortowane rosnąco po dacie — do wykresu trendu
  function analyticsTrendData(period, machineId) {
    var pool = machineId ? machineShifts(machineId) : state.shifts.filter(isActiveShift);
    var inPeriod = periodShiftsFor(pool, period);
    var byDate = {};
    inPeriod.forEach(function (s) {
      if (!byDate[s.date]) byDate[s.date] = [];
      byDate[s.date].push(calc(s));
    });
    return Object.keys(byDate).sort().map(function (date) {
      var ms = byDate[date];
      function avg(key) { return ms.reduce(function (sum, m) { return sum + m[key]; }, 0) / ms.length; }
      var a = avg("availability"), p = avg("performance"), q = avg("quality");
      return { date: date, availability: a, performance: p, quality: q, oee: a * p * q, count: ms.length };
    });
  }

  // Pareto: minuty ZATWIERDZONEGO przestoju na powód, z tych samych zmian co trend
  // (te same zasady co effectiveDowntimeMin — tylko approved się liczy), posortowane
  // malejąco, z udziałem % i sumą narastająco
  function downtimeParetoData(period, machineId) {
    var pool = machineId ? machineShifts(machineId) : state.shifts.filter(isActiveShift);
    var inPeriod = periodShiftsFor(pool, period);
    var byReason = {};
    inPeriod.forEach(function (s) {
      (state.downtimesByShift[s.id] || []).forEach(function (d) {
        if (d.status !== "approved") return;
        byReason[d.reasonId] = (byReason[d.reasonId] || 0) + d.minutes;
      });
    });
    var total = Object.keys(byReason).reduce(function (sum, k) { return sum + byReason[k]; }, 0);
    var rows = Object.keys(byReason).map(function (id) { return { reasonId: id, minutes: byReason[id] }; })
      .sort(function (a, b) { return b.minutes - a.minutes; });
    var cum = 0;
    rows.forEach(function (r) {
      r.pct = total > 0 ? (r.minutes / total) : 0;
      cum += r.pct;
      r.cumPct = cum;
    });
    return { rows: rows, total: total };
  }

  // wykres liniowy OEE + A/P/Q, jedna wspólna oś 0–100% (nigdy dwie osie na jednym
  // wykresie) — te same kolory co reszta aplikacji (hero, karty maszyn)
  function buildTrendChart(data) {
    var w = 720, h = 220, padL = 34, padR = 10, padT = 10, padB = 22;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    if (data.length < 2) return { svg: '<svg viewBox="0 0 ' + w + ' ' + h + '"></svg>', points: [], w: w };
    function xFor(i) { return padL + (i / (data.length - 1)) * innerW; }
    function yFor(v) { return padT + innerH - clamp01(v) * innerH; }
    var seriesDefs = [
      { key: "availability", color: "var(--chart-avail)", width: 1.6 },
      { key: "performance", color: "var(--chart-perf)", width: 1.6 },
      { key: "quality", color: "var(--chart-qual)", width: 1.6 },
      { key: "oee", color: "var(--brand)", width: 2.6 }
    ];
    var gridLines = [0, 0.25, 0.5, 0.75, 1].map(function (g) {
      var y = yFor(g);
      return '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (padL + innerW) + '" y2="' + y.toFixed(1) + '" stroke="var(--border-soft)" stroke-width="1"></line>' +
        '<text x="' + (padL - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="9" fill="var(--ink-muted)">' + Math.round(g * 100) + '%</text>';
    }).join("");
    var labelEvery = Math.max(1, Math.ceil(data.length / 6));
    var xLabels = data.map(function (d, i) {
      if (i % labelEvery !== 0 && i !== data.length - 1) return "";
      return '<text x="' + xFor(i).toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle" font-size="9" fill="var(--ink-muted)">' + fmtDate(d.date).slice(0, 5) + '</text>';
    }).join("");
    var lines = seriesDefs.map(function (sd) {
      var path = data.map(function (d, i) { return (i === 0 ? "M" : "L") + xFor(i).toFixed(1) + "," + yFor(d[sd.key]).toFixed(1); }).join(" ");
      return '<path d="' + path + '" fill="none" stroke="' + sd.color + '" stroke-width="' + sd.width + '" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>';
    }).join("");
    var points = data.map(function (d, i) { return { x: xFor(i), date: d.date, oee: d.oee, availability: d.availability, performance: d.performance, quality: d.quality, count: d.count }; });
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' + gridLines + lines + xLabels + '</svg>';
    return { svg: svg, points: points, w: w };
  }

  function attachTrendHover(wrapEl, points, w) {
    if (!points.length) return;
    var svg = wrapEl.querySelector("svg");
    var tooltip = document.getElementById("tooltip");
    svg.addEventListener("mousemove", function (evt) {
      var rect = svg.getBoundingClientRect();
      var relX = ((evt.clientX - rect.left) / rect.width) * w;
      var nearest = points[0], best = Infinity;
      points.forEach(function (p) { var dd = Math.abs(p.x - relX); if (dd < best) { best = dd; nearest = p; } });
      tooltip.textContent = fmtDate(nearest.date) + " · OEE " + fmtPct(nearest.oee) + " · Dost. " + fmtPct(nearest.availability) + " · Wyd. " + fmtPct(nearest.performance) + " · Jak. " + fmtPct(nearest.quality);
      tooltip.style.left = evt.clientX + "px"; tooltip.style.top = evt.clientY + "px";
      tooltip.classList.add("show");
    });
    svg.addEventListener("mouseleave", function () { tooltip.classList.remove("show"); });
  }

  // Pareto: słupki = udział % danego powodu w sumie przestoju (jedna wspólna oś
  // 0–100% z linią narastająco — nigdy surowe minuty na drugiej osi), z linią
  // odniesienia na 80% (klasyczna zasada Pareto: 2–3 powody zwykle ją przekraczają)
  function buildParetoChart(rows) {
    var w = 720, h = 240, padL = 34, padR = 10, padT = 14, padB = 46;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    if (!rows.length) return '<svg viewBox="0 0 ' + w + ' ' + h + '"></svg>';
    var n = rows.length;
    var slot = innerW / n;
    var barW = Math.min(slot * 0.6, 46);
    function xCenter(i) { return padL + slot * i + slot / 2; }
    function yFor(v) { return padT + innerH - clamp01(v) * innerH; }
    var gridLines = [0, 0.25, 0.5, 0.75, 1].map(function (g) {
      var y = yFor(g);
      return '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (padL + innerW) + '" y2="' + y.toFixed(1) + '" stroke="var(--border-soft)" stroke-width="1"></line>' +
        '<text x="' + (padL - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="9" fill="var(--ink-muted)">' + Math.round(g * 100) + '%</text>';
    }).join("");
    var refLine = '<line x1="' + padL + '" y1="' + yFor(0.8).toFixed(1) + '" x2="' + (padL + innerW) + '" y2="' + yFor(0.8).toFixed(1) + '" stroke="var(--status-warn)" stroke-width="1" stroke-dasharray="4 3"></line>';
    var bars = rows.map(function (r, i) {
      var x = xCenter(i) - barW / 2;
      var y = yFor(r.pct);
      var barH = (padT + innerH) - y;
      var name = escAttr(reasonName(r.reasonId));
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(0, barH).toFixed(1) + '" rx="3" fill="var(--brand)"><title>' +
        name + ': ' + Math.round(r.minutes) + ' min (' + Math.round(r.pct * 100) + '%), narastająco ' + Math.round(r.cumPct * 100) + '%</title></rect>';
    }).join("");
    var cumPoints = rows.map(function (r, i) { return { x: xCenter(i), y: yFor(r.cumPct) }; });
    var cumPath = cumPoints.map(function (p, i) { return (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
    var cumLine = '<path d="' + cumPath + '" fill="none" stroke="var(--status-warn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>' +
      cumPoints.map(function (p) { return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="2.6" fill="var(--status-warn)"></circle>'; }).join("");
    var labels = rows.map(function (r, i) {
      var full = reasonName(r.reasonId);
      var short = full.length > 14 ? full.slice(0, 13) + "…" : full;
      var x = xCenter(i), y1 = h - padB + 12, y2 = h - padB + 24;
      // dwie linijki, żeby dłuższe nazwy powodów zmieściły się bez nachodzenia na sąsiednie słupki
      var mid = Math.ceil(short.length / 2);
      var line1 = short.length > 8 ? short.slice(0, mid) : short;
      var line2 = short.length > 8 ? short.slice(mid) : "";
      return '<text x="' + x.toFixed(1) + '" y="' + y1 + '" text-anchor="middle" font-size="9" fill="var(--ink-muted)"><title>' + escAttr(full) + '</title>' + escAttr(line1) + '</text>' +
        (line2 ? '<text x="' + x.toFixed(1) + '" y="' + y2 + '" text-anchor="middle" font-size="9" fill="var(--ink-muted)">' + escAttr(line2) + '</text>' : '');
    }).join("");
    return '<svg viewBox="0 0 ' + w + ' ' + h + '">' + gridLines + refLine + bars + cumLine + labels + '</svg>';
  }

  function machineFilterOptionsHtml(selected) {
    return '<option value=""' + (selected ? "" : " selected") + '>Wszystkie maszyny</option>' +
      state.machines.map(function (m) { return '<option value="' + m.id + '"' + (m.id === selected ? " selected" : "") + '>' + escAttr(m.name) + '</option>'; }).join("");
  }

  function analyticsHtml(period) {
    var machineId = analyticsMachineFilter || null;
    var trend = analyticsTrendData(period, machineId);
    var pareto = downtimeParetoData(period, machineId);

    var trendSection = '<div class="panel"><div class="section-head"><div class="eyebrow">Analityka</div><h2 class="section-title small">Trend OEE w czasie</h2>' +
      '<div class="section-sub">Średnie dzienne z wybranego okresu' + (machineId ? " — tylko " + escAttr(machineName(machineId)) : " — wszystkie maszyny razem") + '. Jedna wspólna oś (0–100%): łatwo zobaczyć, który z trzech czynników ciągnie OEE w dół w danym dniu.</div></div>' +
      (trend.length >= 2
        ? '<div class="legend-row"><span class="legend-item"><span class="legend-swatch" style="background:var(--brand)"></span>OEE</span>' +
          '<span class="legend-item"><span class="legend-swatch" style="background:var(--chart-avail)"></span>Dostępność</span>' +
          '<span class="legend-item"><span class="legend-swatch" style="background:var(--chart-perf)"></span>Wydajność</span>' +
          '<span class="legend-item"><span class="legend-swatch" style="background:var(--chart-qual)"></span>Jakość</span></div>' +
          '<div id="trendChartBox" style="margin-top:10px;"></div>'
        : '<div class="empty-hint">Za mało dni z danymi w tym okresie na wykres trendu (potrzeba przynajmniej dwóch różnych dni ze zmianami).</div>') +
      '</div>';

    var paretoRows = pareto.rows.map(function (r) {
      return '<tr><td>' + escAttr(reasonName(r.reasonId)) + '</td>' +
        '<td class="num tabular">' + Math.round(r.minutes) + '</td>' +
        '<td class="num tabular">' + Math.round(r.pct * 100) + '%</td>' +
        '<td class="num tabular">' + Math.round(r.cumPct * 100) + '%</td></tr>';
    }).join("");
    var paretoSection = '<div class="panel" style="margin-top:16px;"><div class="section-head"><div class="eyebrow">Analityka</div><h2 class="section-title small">Pareto przyczyn przestojów</h2>' +
      '<div class="section-sub">Tylko zatwierdzony przestój, z tych samych zmian co wykres wyżej. Słupki = udział powodu w sumie przestoju, pomarańczowa linia = suma narastająco — przerywana linia to próg 80%: powody na lewo od miejsca, gdzie linia go przekracza, to zwykle te 2–3, na których najbardziej opłaca się skupić.</div></div>' +
      (pareto.rows.length
        ? '<div class="legend-row"><span class="legend-item"><span class="legend-swatch" style="background:var(--brand)"></span>Udział w przestojach</span>' +
          '<span class="legend-item"><span class="legend-swatch" style="background:var(--status-warn)"></span>Suma narastająco</span></div>' +
          '<div style="margin-top:10px;">' + buildParetoChart(pareto.rows) + '</div>' +
          '<div class="table-scroll" style="margin-top:14px;"><table class="compact"><thead><tr><th>Powód</th><th class="num">Minuty</th><th class="num">Udział</th><th class="num">Narastająco</th></tr></thead><tbody>' + paretoRows + '</tbody></table></div>'
        : '<div class="empty-hint">Brak zatwierdzonego przestoju w tym okresie — albo nic się nie zdarzyło, albo zgłoszenia czekają jeszcze na zatwierdzenie w zakładce Przestoje.</div>') +
      '</div>';

    return periodPickerHtml(period, "manager") +
      '<div class="field" style="max-width:280px;margin-top:14px;"><label for="analyticsMachineFilter">Maszyna</label>' +
      '<select id="analyticsMachineFilter">' + machineFilterOptionsHtml(analyticsMachineFilter) + '</select></div>' +
      trendSection + paretoSection;

  function mountAnalyticsCharts() {
    var box = document.getElementById("trendChartBox");
    if (!box) return;
    var machineId = analyticsMachineFilter || null;
    var trend = analyticsTrendData(managerPeriod, machineId);
    var chart = buildTrendChart(trend);
    box.innerHTML = chart.svg;
    attachTrendHover(box, chart.points, chart.w);
  }

  /* =====================================================================
     ALERTY — liczone na bieżąco z tego, co już jest w state (żadnej nowej
     tabeli): (1) OEE poniżej progu w ostatnich 7 dniach, per maszyna,
     (2) przestój czeka na decyzję dłużej niż ustawiony próg, (3) norma
     niewykonana na tej samej maszynie kilka zmian z rzędu. Progi ustawia
     kierownik w Panelu administratora → Ustawienia (companies.alert_*).
     Na razie widoczne TYLKO w aplikacji (baner + licznik przy „Panel
     kierownika") — bez maila, patrz komentarz przy dostawie.
     ===================================================================== */
  function computeAlerts() {
    var out = [];
    var oeeThreshold = state.settings.alertOeeThreshold;
    var pendingHours = state.settings.alertDowntimePendingHours;
    var missStreak = Math.max(1, Math.round(state.settings.alertNormMissStreak));

    // 1) OEE poniżej progu — średnia z ostatnich 7 dni, per maszyna
    var from7 = daysAgoStr(6);
    state.machines.forEach(function (m) {
      var hist = machineShifts(m.id).filter(function (s) { return s.date >= from7; });
      if (!hist.length) return;
      var ms = hist.map(calc);
      var avgOee = ms.reduce(function (sum, x) { return sum + x.oee; }, 0) / ms.length;
      if (avgOee < oeeThreshold) {
        out.push({
          severity: "crit",
          text: "OEE „" + m.name + "” poniżej progu",
          detail: fmtPct(avgOee) + " średnio z ostatnich 7 dni (próg: " + fmtPct(oeeThreshold) + ")"
        });
      }
    });

    // 2) przestój czeka na decyzję dłużej niż próg
    var nowMs = Date.now();
    state.shiftDowntimes.filter(function (d) { return d.status === "pending"; }).forEach(function (d) {
      if (!d.createdAt) return;
      var waitedH = (nowMs - new Date(d.createdAt).getTime()) / 3600000;
      if (waitedH >= pendingHours) {
        var shift = state.shifts.filter(function (s) { return s.id === d.shiftId; })[0];
        out.push({
          severity: "warn",
          text: "Przestój czeka na decyzję",
          detail: reasonName(d.reasonId) + " — " + d.minutes + " min" + (shift ? " (" + machineName(shift.machineId) + ", " + fmtDate(shift.date) + ")" : "") + " · czeka " + Math.round(waitedH) + " godz."
        });
      }
    });

    // 3) norma niewykonana kilka zmian z rzędu, per maszyna (licząc od najnowszej
    // wstecz; zmiany bez policzonego celu — normMet null — pomijamy, nie przerywają serii)
    state.machines.forEach(function (m) {
      var hist = machineShifts(m.id).slice().reverse();
      var streak = 0;
      for (var i = 0; i < hist.length; i++) {
        var c = calc(hist[i]);
        if (c.normMet === null) continue;
        if (c.normMet === false) { streak++; if (streak >= missStreak) break; }
        else break;
      }
      if (streak >= missStreak) {
        out.push({
          severity: "crit",
          text: "Norma niewykonana kilka zmian z rzędu",
          detail: "„" + m.name + "” — ostatnie " + streak + " zmian(y) z policzonym celem poniżej normy"
        });
      }
    });

    // 4) stan poniżej progu minimalnego, per surowiec/produkt — TYLKO dla pozycji z wpisanym
    // minQty, licząc sumę ze WSZYSTKICH magazynów (materialStockQty/productStockQty z null
    // zamiast listy magazynów). Pomijamy pozycje bez żadnego zarejestrowanego stanu (null) —
    // brak danych to nie to samo co potwierdzone zero, nie chcemy fałszywego alarmu tam, gdzie
    // stanu magazynowego w ogóle nie prowadzi się przez ten moduł.
    state.materials.forEach(function (m) {
      if (m.minQty == null) return;
      var total = materialStockQty(m.id, null);
      if (total == null || total >= m.minQty) return;
      out.push({
        severity: "warn",
        text: "Niski stan surowca",
        detail: (m.code ? m.code + " — " : "") + m.name + ": " + fmtQty(total) + " " + (unitLabel(m.unit) || m.unit) + " (próg: " + fmtQty(m.minQty) + ")"
      });
    });
    state.products.forEach(function (p) {
      if (p.minQty == null) return;
      var total = productStockQty(p.id, null);
      if (total == null || total >= p.minQty) return;
      out.push({
        severity: "warn",
        text: "Niski stan produktu",
        detail: (p.code ? p.code + " — " : "") + p.name + ": " + fmtQty(total) + " szt. (próg: " + fmtQty(p.minQty) + ")"
      });
    });

    return out;
  }

  /* =====================================================================
     RAPORT — podsumowanie okresu gotowe do wysłania (Excel albo PDF przez
     druk przeglądarki), z tych samych danych co Przegląd/Analityka. Zero
     nowej tabeli w bazie: to widok + eksport tego, co już liczymy.
     ===================================================================== */
  function reportData(period) {
    var pool = state.shifts.filter(isActiveShift);
    var inPeriod = periodShiftsFor(pool, period); // malejąco: [0] najnowsza
    var ms = inPeriod.map(calc);
    function avg(key) { return ms.length ? ms.reduce(function (s, x) { return s + x[key]; }, 0) / ms.length : 0; }
    var shop = { availability: avg("availability"), performance: avg("performance"), quality: avg("quality") };
    shop.oee = shop.availability * shop.performance * shop.quality;
    var totalGood = inPeriod.reduce(function (s, x) { return s + x.good; }, 0);
    var totalBad = inPeriod.reduce(function (s, x) { return s + x.bad; }, 0);

    // koszt przestojów w okresie — TYLKO zmiany na maszynach z wpisanym kosztem minuty się liczą
    // (patrz downtimeCostFor); jeśli choć jedna maszyna w okresie go nie ma, suma jest dolną
    // granicą ("≥"), nie pełnym kosztem — hasDowntimeCost=false ukrywa kafelek całkowicie,
    // gdy nikt nic nie wpisał, żeby nie sugerować fałszywego 0 zł
    var costedShifts = inPeriod.filter(function (s) { return downtimeCostFor(s) != null; });
    var totalDowntimeCost = costedShifts.reduce(function (s, x) { return s + downtimeCostFor(x); }, 0);
    var hasDowntimeCost = costedShifts.length > 0;
    var downtimeCostComplete = costedShifts.length === inPeriod.length;

    var perMachine = state.machines.map(function (m) {
      var hist = inPeriod.filter(function (s) { return s.machineId === m.id; });
      if (!hist.length) return null;
      var hms = hist.map(calc);
      function avgM(key) { return hms.reduce(function (s, x) { return s + x[key]; }, 0) / hms.length; }
      var a = avgM("availability"), p = avgM("performance"), q = avgM("quality");
      return {
        name: m.name, availability: a, performance: p, quality: q, oee: a * p * q, shiftCount: hist.length,
        good: hist.reduce(function (s, x) { return s + x.good; }, 0), bad: hist.reduce(function (s, x) { return s + x.bad; }, 0)
      };
    }).filter(Boolean).sort(function (a, b) { return b.oee - a.oee; });

    var byOp = {};
    inPeriod.forEach(function (s) {
      if (!s.operatorId) return;
      if (!byOp[s.operatorId]) byOp[s.operatorId] = [];
      byOp[s.operatorId].push(s);
    });
    var perOperator = Object.keys(byOp).map(function (opId) {
      var list = byOp[opId], oms = list.map(calc);
      return { name: operatorName(opId), count: list.length, avgOee: oms.reduce(function (s, x) { return s + x.oee; }, 0) / oms.length };
    }).sort(function (a, b) { return b.avgOee - a.avgOee; });

    return {
      period: period, shop: shop, totalGood: totalGood, totalBad: totalBad, shiftCount: inPeriod.length,
      perMachine: perMachine, perOperator: perOperator, pareto: downtimeParetoData(period, null),
      totalDowntimeCost: totalDowntimeCost, hasDowntimeCost: hasDowntimeCost, downtimeCostComplete: downtimeCostComplete,
      from: inPeriod.length ? inPeriod[inPeriod.length - 1].date : null, to: inPeriod.length ? inPeriod[0].date : null,
      generatedAt: todayStr()
    };
  }
