  /* =====================================================================
     RECEPTURY — surowce (BOM) + ścisła kolejność etapów na maszynach
     (routing) dla produktu. Fundament pod przyszłe autoplanowanie; na
     razie tylko dane + formularz + import, bez wpływu na Wpis zmiany ani
     Planowanie (patrz komentarz w migracji).
     ===================================================================== */

  // szkic receptury w edycji — istnieje tylko w pamięci, dopóki nie klikniesz "Zapisz
  // recepturę" (wtedy: skasuj wszystko co było dla tego produktu, wstaw na nowo aktualny
  // szkic). recipeEditingProductId === null -> edytor zwinięty, widać tylko listę produktów.
  var recipeEditingProductId = null;
  var recipeDraftMaterials = []; // [{materialId, qty}]
  var recipeDraftSteps = [];     // [{machineId, cycleTimeSec}] — kolejność w tablicy = kolejność etapów

  function openRecipeEditor(productId) {
    recipeEditingProductId = productId;
    // druga linia obrony: pomiń wiersze wskazujące na surowiec/maszynę, których już
    // nie ma na aktualnej liście (np. usunięto je, gdy ten szkic nie był odświeżany)
    var currentMaterialIds = {};
    state.materials.forEach(function (m) { currentMaterialIds[m.id] = true; });
    var currentMachineIds = {};
    state.machines.forEach(function (m) { currentMachineIds[m.id] = true; });
    recipeDraftMaterials = (state.recipeMaterialsByProduct[productId] || [])
      .filter(function (r) { return currentMaterialIds[r.materialId]; })
      .map(function (r) { return { materialId: r.materialId, qty: r.qtyPerUnit }; });
    recipeDraftSteps = (state.recipeStepsByProduct[productId] || [])
      .filter(function (r) { return currentMachineIds[r.machineId]; })
      .map(function (r) { return { machineId: r.machineId, cycleTimeSec: r.cycleTimeSec }; });
  }
  function closeRecipeEditor() {
    recipeEditingProductId = null;
    recipeDraftMaterials = [];
    recipeDraftSteps = [];
  }
  // zanim cokolwiek doda/usunie/przesunie wiersz i przerysuje cały ekran, przepisz do szkicu
  // to, co jest AKTUALNIE wpisane w polach — inaczej pełne przerysowanie zgubiłoby wartość,
  // którą ktoś właśnie wpisywał w innym wierszu
  function syncRecipeDraftFromDom() {
    recipeDraftMaterials.forEach(function (row, idx) {
      var sel = document.getElementById("recMatSel" + idx), qty = document.getElementById("recMatQty" + idx);
      if (sel) row.materialId = sel.value;
      if (qty) row.qty = parseFloat(qty.value) || row.qty;
    });
    recipeDraftSteps.forEach(function (row, idx) {
      var sel = document.getElementById("recStepMach" + idx), t = document.getElementById("recStepTime" + idx);
      if (sel) row.machineId = sel.value;
      if (t) row.cycleTimeSec = parseFloat(t.value) || row.cycleTimeSec;
    });
  }

  function recipeMaterialRowHtml(row, idx) {
    var matOpts = state.materials.map(function (m) { return '<option value="' + m.id + '"' + (m.id === row.materialId ? " selected" : "") + '>' + escAttr((m.code ? m.code + " — " + m.name : m.name)) + ' (' + unitLabel(m.unit) + ')</option>'; }).join("");
    return '<div class="downtime-row" data-recipe-material-row="' + idx + '">' +
      '<select id="recMatSel' + idx + '">' + matOpts + '</select>' +
      '<input type="number" id="recMatQty' + idx + '" min="0.001" step="0.001" placeholder="ilość / szt." value="' + (row.qty || "") + '">' +
      '<button type="button" class="small" data-remove-recipe-material="' + idx + '" aria-label="Usuń">✕</button></div>';
  }

  function recipeStepRowHtml(row, idx, total) {
    var machOpts = state.machines.map(function (m) { return '<option value="' + m.id + '"' + (m.id === row.machineId ? " selected" : "") + '>' + escAttr(m.name) + '</option>'; }).join("");
    return '<div class="downtime-row" data-recipe-step-row="' + idx + '">' +
      '<span class="hint tabular" style="flex:none;width:22px;">' + (idx + 1) + '.</span>' +
      '<select id="recStepMach' + idx + '">' + machOpts + '</select>' +
      '<input type="number" id="recStepTime' + idx + '" min="0.1" step="0.1" placeholder="czas cyklu (s/szt.)" value="' + (row.cycleTimeSec || "") + '">' +
      '<button type="button" class="small" data-recipe-step-up="' + idx + '"' + (idx === 0 ? " disabled" : "") + ' aria-label="Wyżej">↑</button>' +
      '<button type="button" class="small" data-recipe-step-down="' + idx + '"' + (idx === total - 1 ? " disabled" : "") + ' aria-label="Niżej">↓</button>' +
      '<button type="button" class="small" data-remove-recipe-step="' + idx + '" aria-label="Usuń">✕</button></div>';
  }

  function recipeEditorHtml() {
    var product = state.products.filter(function (p) { return p.id === recipeEditingProductId; })[0];
    if (!product) return "";
    var totalTime = recipeDraftSteps.reduce(function (sum, s) { return sum + (s.cycleTimeSec || 0); }, 0);
    return '<div class="panel" style="margin-top:16px;"><div class="section-head"><div class="eyebrow">Receptura</div><h2 class="section-title small">' + escAttr(product.code ? product.code + " — " + product.name : product.name) + '</h2>' +
      '<div class="section-sub">Surowce liczone na SZTUKĘ produktu. Etapy w ścisłej kolejności — tak, jak fizycznie przechodzi przez maszyny (etap 2 dopiero po etapie 1).</div></div>' +

      '<div class="field" style="max-width:none;"><label>Surowce</label>' +
      '<div id="recipeMaterialRows">' + (recipeDraftMaterials.length ? recipeDraftMaterials.map(recipeMaterialRowHtml).join("") : '<div class="empty-hint">Brak surowców w recepturze.</div>') + '</div>' +
      (state.materials.length
        ? '<button type="button" class="ghost small" id="addRecipeMaterialBtn" style="margin-top:6px;align-self:flex-start;">+ Dodaj surowiec</button>'
        : '<span class="hint warn">Najpierw dodaj przynajmniej jeden surowiec w zakładce Surowce.</span>') +
      '<div class="import-box" style="margin-top:10px;"><div class="import-head"><span class="eyebrow">Wczytaj surowce z pliku</span><span class="hint">Jeden surowiec w linii: Nazwa;Ilość na sztukę (np. Blacha 2mm;1.5). Surowiec musi już być na liście Surowce — dopisze się tylko ilość.</span></div>' +
      '<div class="inline-add"><input type="file" id="importRecipeMaterialsFile" accept=".csv,.txt,.xlsx,.xls"><button type="button" class="ghost small" id="importRecipeMaterialsBtn">Wczytaj</button></div>' +
      '<span class="form-msg" id="importRecipeMaterialsMsg"></span></div></div>' +

      '<div class="field" style="max-width:none;margin-top:18px;"><label>Etapy (kolejność maszyn)</label>' +
      '<div id="recipeStepRows">' + (recipeDraftSteps.length ? recipeDraftSteps.map(function (r, i) { return recipeStepRowHtml(r, i, recipeDraftSteps.length); }).join("") : '<div class="empty-hint">Brak etapów w recepturze.</div>') + '</div>' +
      (state.machines.length
        ? '<button type="button" class="ghost small" id="addRecipeStepBtn" style="margin-top:6px;align-self:flex-start;">+ Dodaj etap</button>'
        : '<span class="hint warn">Najpierw dodaj przynajmniej jedną maszynę w zakładce Maszyny.</span>') +
      (totalTime > 0 ? '<span class="hint" style="margin-top:6px;">Łączny czas marszruty: ' + Math.round(totalTime) + ' s/szt. (' + recipeDraftSteps.length + ' ' + (recipeDraftSteps.length === 1 ? "etap" : "etapy/etapów") + ')</span>' : '') +
      '<div class="import-box" style="margin-top:10px;"><div class="import-head"><span class="eyebrow">Wczytaj etapy z pliku</span><span class="hint">Jeden etap w linii, W KOLEJNOŚCI marszruty: Maszyna;Czas cyklu w s/szt. (np. Tokarka 1;45). Maszyna musi już istnieć na liście Maszyny.</span></div>' +
      '<div class="inline-add"><input type="file" id="importRecipeStepsFile" accept=".csv,.txt,.xlsx,.xls"><button type="button" class="ghost small" id="importRecipeStepsBtn">Wczytaj</button></div>' +
      '<span class="form-msg" id="importRecipeStepsMsg"></span></div></div>' +

      '<div class="form-actions" style="margin-top:16px;"><button type="button" class="primary" id="saveRecipeBtn">Zapisz recepturę</button>' +
      '<button type="button" class="ghost" id="closeRecipeBtn">Zamknij</button>' +
      '<span class="form-msg" id="recipeMsg">Zapisano.</span></div></div>';
  }

  function recipesAdminHtml() {
    if (!state.products.length) {
      return '<div class="panel"><div class="section-head"><div class="eyebrow">Receptury</div><h2 class="section-title small">Receptury produktów</h2></div>' +
        '<div class="empty-hint">Dodaj najpierw przynajmniej jeden produkt (zakładka Produkty), żeby móc zdefiniować dla niego recepturę.</div></div>';
    }
    var withRecipe = state.products.filter(function (p) { return (state.recipeMaterialsByProduct[p.id] || []).length || (state.recipeStepsByProduct[p.id] || []).length; });
    var rows = withRecipe.map(function (p) {
      var mats = (state.recipeMaterialsByProduct[p.id] || []).length;
      var steps = state.recipeStepsByProduct[p.id] || [];
      var totalTime = steps.reduce(function (sum, s) { return sum + s.cycleTimeSec; }, 0);
      return '<tr><td>' + escAttr(p.code ? p.code + " — " + p.name : p.name) + '</td>' +
        '<td class="num tabular">' + mats + '</td>' +
        '<td class="num tabular">' + steps.length + '</td>' +
        '<td class="num tabular">' + (totalTime > 0 ? Math.round(totalTime) + " s/szt." : "—") + '</td>' +
        '<td style="width:1%;white-space:nowrap;"><button type="button" class="small" data-edit-recipe="' + p.id + '">Edytuj</button></td></tr>';
    }).join("");
    var table = withRecipe.length
      ? '<div class="table-scroll" style="margin-top:12px;"><table class="compact"><thead><tr><th>Produkt</th><th class="num">Surowców</th><th class="num">Etapów</th><th class="num">Łączny czas</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="empty-hint">Żaden produkt nie ma jeszcze receptury — wybierz produkt poniżej, żeby dodać pierwszą.</div>';

    var withoutRecipe = state.products.filter(function (p) { return withRecipe.indexOf(p) === -1; });
    var pickOpts = '<option value="">— wybierz produkt —</option>' + withoutRecipe.map(function (p) { return '<option value="' + p.id + '">' + escAttr(p.code ? p.code + " — " + p.name : p.name) + '</option>'; }).join("");

    return '<div class="panel"><div class="section-head"><div class="eyebrow">Receptury</div><h2 class="section-title small">Receptury produktów</h2>' +
      '<div class="section-sub">Surowce (ile na sztukę) i ścisła kolejność maszyn (routing) dla produktu. Na razie tylko dane — nie zmienia to jeszcze dzisiejszego Wpisu zmiany ani Planowania.</div></div>' +
      table +
      (withoutRecipe.length ? '<div class="inline-add" style="margin-top:14px;"><select id="newRecipeProduct">' + pickOpts + '</select><button type="button" class="primary" id="newRecipeBtn">Dodaj recepturę</button></div>' : '') +
      '</div>' +
      (recipeEditingProductId ? recipeEditorHtml() : '');
  }

  function leaderboardHtml(period) {
    var byOp = {};
    state.shifts.forEach(function (s) {
      if (!s.operatorId || !isActiveShift(s)) return;
      if (!byOp[s.operatorId]) byOp[s.operatorId] = [];
      byOp[s.operatorId].push(s);
    });
    var rows = Object.keys(byOp).map(function (opId) {
      var periodShifts = periodShiftsFor(byOp[opId], period);
      if (!periodShifts.length) return null;
      var ms = periodShifts.map(calc);
      var oeeSum = ms.reduce(function (sum, m) { return sum + m.oee; }, 0);
      var perfSum = ms.reduce(function (sum, m) { return sum + m.performance; }, 0);
      var last = periodShifts.reduce(function (mx, s) { return s.date > mx ? s.date : mx; }, periodShifts[0].date);
      return { name: operatorName(opId), count: periodShifts.length, avgOee: oeeSum / periodShifts.length, avgPerf: perfSum / periodShifts.length, last: last };
    }).filter(Boolean).sort(function (a, b) { return b.avgOee - a.avgOee; });

    var body = rows.map(function (r, i) {
      return '<tr class="' + (i === 0 ? "rank-1" : "") + '"><td>' + (i + 1) + '. ' + r.name + '</td>' +
        '<td class="num tabular">' + r.count + '</td>' +
        '<td class="num tabular">' + fmtPct(r.avgOee) + '</td>' +
        '<td class="num tabular">' + fmtPct(r.avgPerf) + '</td>' +
        '<td class="num tabular">' + fmtDate(r.last) + '</td></tr>';
    }).join("");

    var table = rows.length
      ? '<div class="table-scroll"><table class="compact"><thead><tr><th>Operator</th><th class="num">Zmian</th><th class="num">Śr. OEE</th><th class="num">Śr. wydajność</th><th class="num">Ostatnia zmiana</th></tr></thead><tbody>' + body + '</tbody></table></div>'
      : '<div class="empty-hint">Brak jeszcze żadnych zmian przypisanych do operatorów.</div>';

    return '<section aria-labelledby="lbTitle"><div class="section-head"><div class="eyebrow">Do porównania i premii</div>' +
      '<h2 id="lbTitle" class="section-title small">Wyniki operatorów</h2>' +
      '<div class="section-sub">Średnia liczona ze zmian danej osoby w wybranym okresie, niezależnie od maszyny.</div></div>' + table + '</section>';
  }

  function settingsHtml() {
    var n = state.settings.shiftsPerDay;
    function seg(v, label) { return '<button type="button" class="' + (n === v ? "active" : "") + '" data-shifts="' + v + '">' + label + '</button>'; }
    var suggestedNote = "Przykład: " + state.settings.shiftLengthMin + " − " + state.settings.breakMin + " (przerwa) − " + state.settings.ineffectiveMin + " (nieefektywny) − TPZ maszyny = czas planowany, który podpowiemy operatorowi (zawsze może go poprawić).";
    return '<div class="panel"><div class="section-head"><div class="eyebrow">Konfiguracja</div><h2 class="section-title small">Ustawienia</h2></div>' +
      '<div class="settings-row"><div><div class="label">Liczba zmian dziennie</div><div class="sub">Dostosuj do organizacji pracy w zakładzie</div></div>' +
      '<div class="segmented">' + seg(1, "1") + seg(2, "2") + seg(3, "3") + '</div></div>' +
      '<div class="settings-row" style="flex-direction:column;align-items:stretch;gap:12px;">' +
      '<div><div class="label">Czas zmiany</div><div class="sub">Odejmujemy przerwę i czas nieefektywny (WC, raportowanie itp.) od długości zmiany, a przy wpisie zmiany dodatkowo TPZ wybranej maszyny (ustawiasz go w zakładce Maszyny) — tak liczymy podpowiedź „czasu planowanego".</div></div>' +
      '<div class="form-grid" style="grid-template-columns:repeat(3,1fr);margin-top:0;">' +
      '<div class="field"><label for="setShiftLength">Długość zmiany (min)</label><input id="setShiftLength" type="number" min="0" step="5" value="' + state.settings.shiftLengthMin + '"></div>' +
      '<div class="field"><label for="setBreak">Przerwa (min)</label><input id="setBreak" type="number" min="0" step="5" value="' + state.settings.breakMin + '"></div>' +
      '<div class="field"><label for="setIneffective">Czas nieefektywny (min)</label><input id="setIneffective" type="number" min="0" step="5" value="' + state.settings.ineffectiveMin + '"></div>' +
      '</div><div class="hint">' + suggestedNote + '</div>' +
      '<div class="form-actions" style="margin-top:0;"><button type="button" class="ghost" id="saveShiftTimeBtn">Zapisz</button><span class="form-msg" id="shiftTimeMsg">Zapisano.</span></div>' +
      '</div>' +
      '<div class="settings-row" style="flex-direction:column;align-items:stretch;gap:12px;">' +
      '<div><div class="label">Progi alertów</div><div class="sub">Kiedy Panel kierownika ma pokazać coś jako „wymaga uwagi" (baner na Przeglądzie i licznik przy „Panel kierownika"). Bez maila na razie — trzeba wejść do aplikacji, żeby zobaczyć.</div></div>' +
      '<div class="form-grid" style="grid-template-columns:repeat(3,1fr);margin-top:0;">' +
      '<div class="field"><label for="setAlertOee">OEE poniżej (%), śr. z 7 dni</label><input id="setAlertOee" type="number" min="0" max="100" step="1" value="' + Math.round(state.settings.alertOeeThreshold * 100) + '"></div>' +
      '<div class="field"><label for="setAlertPending">Przestój czeka dłużej niż (godz.)</label><input id="setAlertPending" type="number" min="1" step="1" value="' + state.settings.alertDowntimePendingHours + '"></div>' +
      '<div class="field"><label for="setAlertStreak">Norma niewykonana (zmian z rzędu)</label><input id="setAlertStreak" type="number" min="1" step="1" value="' + state.settings.alertNormMissStreak + '"></div>' +
      '</div>' +
      '<div class="form-actions" style="margin-top:0;"><button type="button" class="ghost" id="saveAlertSettingsBtn">Zapisz</button><span class="form-msg" id="alertSettingsMsg">Zapisano.</span></div>' +
      '</div>' +
      '<div class="settings-row"><div><div class="label">Firma</div><div class="sub">' + session.company.name + '</div></div></div>' +
      '<div class="settings-row"><div><div class="label">Twoje konto</div><div class="sub">' + session.user.email + ' · rola: administrator</div></div>' +
      '<button type="button" class="ghost small" id="signOutBtn2">Wyloguj</button></div></div>';
  }

  function downtimeCellHtml(s, m) {
    var claimed = s.downtimeMin, effective = m.downtimeMin;
    if (Math.abs(claimed - effective) < 0.001) return String(effective);
    return effective + ' <span title="Zgłoszono ' + claimed + ' min łącznie — część czeka na zatwierdzenie albo została odrzucona, więc na razie nie liczy się do wyniku" style="color:var(--status-warn);cursor:help;">⏳</span>';
  }
  // "—" jeśli maszyna nie ma wpisanego kosztu minuty przestoju (patrz downtimeCostFor) —
  // orientacyjny koszt liczy się z EFEKTYWNEGO (zatwierdzonego) przestoju, tego samego co OEE
  function downtimeCostCellHtml(shift) {
    var cost = downtimeCostFor(shift);
    return cost == null ? "—" : fmtQty(cost) + " zł";
  }

  // "Norma wykonana?" — porównanie sztuk zrobionych do sztuk, które powinny powstać
  // w czasie plan minus zatwierdzony przestój. Przelicza się na nowo przy każdym
  // renderze, więc zatwierdzenie/odrzucenie przestoju od razu zmienia tę ocenę.
  function normCellHtml(m) {
    if (m.expectedQty <= 0) return '<span class="status-tag" style="color:var(--ink-muted);background:transparent;">—</span>';
    var pct = Math.round((m.produced / m.expectedQty) * 100);
    var cls = m.normMet ? "approved" : "rejected";
    var label = m.normMet ? "wykonana" : "niewykonana";
    return '<span class="status-tag ' + cls + '" title="' + m.produced + ' z ' + m.expectedQty + ' szt. (' + pct + '%), licząc od czasu planowanego pomniejszonego o zatwierdzony przestój">' + label + ' · ' + pct + '%</span>';
  }

  // wiersz edycji zmiany w Historii — pełna szerokość tabeli (colspan), z formularzem
  // poprawki (włącznie z wyborem operatora — tylko kierownik może to zmienić) i wymaganym
  // powodem. white-space:normal na td jest tu celowe: globalna reguła "tbody td {
  // white-space: nowrap}" inaczej "wciąga się" w tekst podpowiedzi i go przecina.
  function historyEditRowHtml(s) {
    return '<tr class="detail-row" data-hist-edit-for="' + s.id + '"><td colspan="16" style="white-space:normal;"><div class="detail-panel">' +
      shiftEditFieldsHtml(s, "histEdit", true) +
      '<div class="form-actions" style="margin-top:10px;">' +
      '<button type="button" class="primary small" data-hist-edit-save="' + s.id + '">Zapisz poprawkę</button>' +
      '<button type="button" class="ghost small" data-hist-edit-discard="' + s.id + '">Anuluj poprawianie</button>' +
      '<span class="form-msg" id="histEditMsg">Podaj powód poprawki.</span>' +
      '</div></div></td></tr>';
  }

  function tableHtml() {
    var rows = state.shifts.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var body = rows.map(function (s) {
      var m = calc(s); var t = tier(m.oee);
      var active = isActiveShift(s);
      var editingHere = historyEditingId === s.id;
      var actionsHtml = active
        ? (editingHere ? '<span class="hint">edycja niżej ↓</span>' : '<button type="button" class="small" data-hist-edit="' + s.id + '">Popraw</button> <button type="button" class="small" data-hist-cancel="' + s.id + '">Anuluj</button>')
        : '<button type="button" class="small" data-hist-restore="' + s.id + '">Przywróć</button>';
      var row = '<tr' + (active ? "" : ' class="cancelled-row"') + '><td class="num tabular">' + fmtDate(s.date) + '</td><td>' + machineName(s.machineId) + '</td>' +
        '<td>' + operatorName(s.operatorId) + '</td><td class="num tabular">' + (s.shiftNumber || "—") + '</td>' +
        '<td>' + productName(s.productId) + '</td>' +
        '<td class="num tabular">' + s.plannedMin + '</td><td class="num tabular">' + downtimeCellHtml(s, m) + '</td>' +
        '<td class="num tabular">' + downtimeCostCellHtml(s) + '</td>' +
        '<td class="num tabular">' + s.good + '</td><td class="num tabular">' + s.bad + '</td>' +
        '<td class="num tabular">' + fmtPct(m.availability) + '</td><td class="num tabular">' + fmtPct(m.performance) + '</td><td class="num tabular">' + fmtPct(m.quality) + '</td>' +
        '<td class="num tabular" style="font-weight:600;">' + fmtPct(m.oee) + '</td>' +
        '<td>' + (active ? normCellHtml(m) : "—") + '</td>' +
        '<td>' + (active ? '<span class="status-pill ' + t.key + '"><span class="dot"></span>' + t.label + '</span>' : '<span class="status-tag cancelled">Anulowana</span>') + '</td>' +
        '<td style="white-space:nowrap;">' + actionsHtml + '</td></tr>';
      return row + (editingHere ? historyEditRowHtml(s) : "");
    }).join("");
    return '<section aria-labelledby="logTitle"><div class="section-head"><div class="eyebrow">Pełne dane</div><h2 id="logTitle" class="section-title small">Dziennik zmian</h2>' +
      '<div class="section-sub">Wszystkie wpisy, od najnowszego. Kolumna „Norma" pokazuje, czy w czasie planowanym (po odjęciu zatwierdzonego przestoju) zrobiono tyle sztuk, ile powinno — po zatwierdzeniu albo odrzuceniu przestoju w zakładce Przestoje ta ocena od razu się przelicza. Anulowane zmiany zostają widoczne (przekreślone) dla śladu, ale nigdzie się nie liczą.</div></div>' +
      '<div class="table-scroll"><table><thead><tr><th>Data</th><th>Maszyna</th><th>Operator</th><th class="num">Zmiana</th><th>Produkt</th>' +
      '<th class="num">Plan (min)</th><th class="num">Przestój (min)</th><th class="num">Koszt przestoju</th><th class="num">Dobre</th><th class="num">Wadliwe</th>' +
      '<th class="num">Dostępność</th><th class="num">Wydajność</th><th class="num">Jakość</th><th class="num">OEE</th><th>Norma</th><th>Status</th><th>Akcje</th></tr></thead>' +
      '<tbody>' + body + '</tbody></table></div></section>';
  }

  function bannerHtml() {
    if (!bannerMsg) return "";
    return '<div class="readonly-banner"><b>Uwaga.</b> ' + bannerMsg + '</div>';
  }

  /* =====================================================================
     ZAKŁADKI PANELU ADMINA
     ===================================================================== */

  // Panel administratora = konfiguracja warsztatu (rzadkie zmiany: co mamy, kto pracuje, jak liczymy).
  // Panel kierownika = codzienna praca nad wynikiem (przegląd, zatwierdzanie przestojów, historia).
  // Oba na razie dostępne tylko dla roli 'admin' (patrz komentarz przy renderApp) — to rozdzielenie
  // ekranów przygotowuje grunt pod prawdziwą, osobną rolę "kierownik", o którą prosiłeś wcześniej.
  var CONFIG_TABS = [
    { key: "machines", label: "Maszyny" },
    { key: "operators", label: "Operatorzy" },
    { key: "products", label: "Produkty" },
    { key: "materials", label: "Surowce" },
    { key: "warehouses", label: "Magazyny" },
    { key: "contractors", label: "Kontrahenci" },
    { key: "recipes", label: "Receptury" },
    { key: "team", label: "Zespół" },
    { key: "settings", label: "Ustawienia" }
  ];
  var MANAGER_TABS = [
    { key: "overview", label: "Przegląd" },
    { key: "analytics", label: "Analityka" },
    { key: "report", label: "Raport" },
    { key: "orders", label: "Planowanie" },
    { key: "materialplan", label: "Zapotrzebowanie" },
    { key: "inventory", label: "Inwentaryzacja" },
    { key: "wzrwmm", label: "WZ / RW / MM" },
    { key: "maintenance", label: "Utrzymanie ruchu" },
    { key: "downtimes", label: "Przestoje" },
    { key: "history", label: "Historia" }
  ];

  // Magazynier widzi w Panelu kierownika tylko Inwentaryzację i WZ/RW/MM — resztę zakładek
  // (Przegląd, Analityka, Raport, Planowanie...) filtrujemy tutaj, w jednym miejscu, tak żeby
  // adminTabsHtml() i sprawdzenie "czy adminTab nadal istnieje w zestawie" (patrz handler kliknięcia
  // roli) automatycznie się zgadzały. RLS w bazie i tak jest twardym backstopem niezależnie od tego.
  var MAGAZYNIER_TABS = MANAGER_TABS.filter(function (t) { return t.key === "inventory" || t.key === "wzrwmm"; });
  function currentTabSet() {
    if (view !== "manager") return CONFIG_TABS;
    return session.profile.role === "magazynier" ? MAGAZYNIER_TABS : MANAGER_TABS;
  }

  function adminTabsHtml() {
    var pendingCount = state.shiftDowntimes.filter(function (d) { return d.status === "pending"; }).length;
    var tabs = currentTabSet().map(function (t) {
      var label = t.label + (t.key === "downtimes" && pendingCount ? " (" + pendingCount + ")" : "");
      return '<button type="button" class="admin-tab' + (adminTab === t.key ? " active" : "") + '" data-admin-tab="' + t.key + '">' + label + '</button>';
    }).join("");
    return '<div class="admin-tabs">' + tabs + '</div>';
  }

  function adminTabContentHtml() {
    switch (adminTab) {
      case "machines": return machinesAdminHtml() + importBlockHtml("machines");
      case "operators": return rosterHtml() + importBlockHtml("operators");
      case "products": return productsHtml() + importBlockHtml("products") + productStockHtml();
      case "materials": return materialsAdminHtml() + importBlockHtml("materials");
      case "warehouses": return warehousesAdminHtml();
      case "contractors": return contractorsAdminHtml();
      case "recipes": return recipesAdminHtml();
      case "team": return teamAdminHtml();
      case "downtimes": return downtimesAdminHtml();
      case "analytics": return analyticsHtml(managerPeriod);
      case "report": return reportTabHtml(reportPeriod);
      case "orders": return ordersAdminHtml();
      case "materialplan": return materialPlanHtml();
      case "inventory": return inventoryHtml();
      case "wzrwmm": return warehouseDocumentsHtml();
      case "maintenance": return maintenanceHtml();
      case "history": return tableHtml();
      case "settings": return settingsHtml();
      case "overview":
      default: return alertsPanelHtml() + periodPickerHtml(managerPeriod, "manager") + heroHtml(managerPeriod) + machineGridHtml(managerPeriod) + leaderboardHtml(managerPeriod);
    }
  }

  function shiftById(id) { return state.shifts.filter(function (s) { return s.id === id; })[0]; }

  function downtimeReviewItemHtml(d) {
    var shift = shiftById(d.shiftId);
    var meta = shift ? fmtDate(shift.date) + " · " + machineName(shift.machineId) + " · " + operatorName(shift.operatorId) : "zmiana niedostępna";
    var normNote = "";
    if (shift) {
      var m = calc(shift);
      if (m.expectedQty > 0) normNote = '<div class="meta" style="margin-top:4px;">Aktualnie (przed tą decyzją): ' + m.produced + ' z ' + m.expectedQty + ' szt. — norma ' + (m.normMet ? "wykonana" : "niewykonana") + '. Zatwierdzenie odejmie ten czas od czasu planowanego i przeliczy tę ocenę (zwykle ją złagodzi) — odrzucenie nic tu nie zmieni.</div>';
    }
    return '<div class="review-item" data-downtime-id="' + d.id + '">' +
      '<div><div class="meta"><b>' + escAttr(reasonName(d.reasonId)) + '</b> — ' + d.minutes + ' min · ' + meta + '</div>' +
      (d.note ? '<div class="meta" style="margin-top:4px;">„' + escAttr(d.note) + '"</div>' : '') + normNote + '</div>' +
      '<div class="review-actions">' +
      '<button type="button" class="small" data-approve-downtime="' + d.id + '">Zatwierdź</button>' +
      '<button type="button" class="small" data-reject-downtime="' + d.id + '">Odrzuć</button>' +
      '</div></div>';
  }

  function downtimeHistoryItemHtml(d) {
    var shift = shiftById(d.shiftId);
    var meta = shift ? fmtDate(shift.date) + " · " + machineName(shift.machineId) + " · " + operatorName(shift.operatorId) : "zmiana niedostępna";
    return '<div class="review-item"><div><div class="meta"><b>' + escAttr(reasonName(d.reasonId)) + '</b> — ' + d.minutes + ' min · ' + meta + '</div></div>' +
      '<span class="status-tag ' + d.status + '">' + (d.status === "approved" ? "zatwierdzony" : "odrzucony") + '</span></div>';
  }

  function downtimesAdminHtml() {
    var pending = state.shiftDowntimes.filter(function (d) { return d.status === "pending"; })
      .sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; });
    var reviewed = state.shiftDowntimes.filter(function (d) { return d.status !== "pending"; })
      .sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; }).slice(0, 25);

    var pendingHtml = pending.length
      ? '<div style="display:flex;flex-direction:column;gap:10px;">' + pending.map(downtimeReviewItemHtml).join("") + '</div>'
      : '<div class="empty-hint">Brak przestojów czekających na zatwierdzenie.</div>';

    var reasonRows = state.downtimeReasons.map(function (r) {
      return '<tr><td><input type="text" data-reason-name="' + r.id + '" value="' + escAttr(r.name) + '" maxlength="120"></td>' +
        '<td style="width:1%;white-space:nowrap;"><button type="button" class="small" data-remove-reason="' + r.id + '">usuń</button></td></tr>';
    }).join("");
    var reasonsTable = state.downtimeReasons.length
      ? '<div class="table-scroll" style="margin-top:12px;"><table class="compact"><thead><tr><th>Powód</th><th></th></tr></thead><tbody>' + reasonRows + '</tbody></table></div>' +
        '<div class="form-actions" style="margin-top:12px;"><button type="button" class="ghost" id="saveReasonsBtn">Zapisz zmiany</button><span class="form-msg" id="reasonsMsg">Zapisano.</span></div>'
      : '<div class="empty-hint">Brak zdefiniowanych powodów — dodaj pierwszy poniżej.</div>';

    var reviewedHtml = reviewed.length
      ? '<div style="display:flex;flex-direction:column;gap:8px;">' + reviewed.map(downtimeHistoryItemHtml).join("") + '</div>'
      : '<div class="empty-hint">Brak jeszcze rozpatrzonych przestojów.</div>';

    return '<div class="panel"><div class="section-head"><div class="eyebrow">Do zatwierdzenia</div><h2 class="section-title small">Przestoje czekające na decyzję</h2>' +
      '<div class="section-sub">Dopóki przestój nie zostanie zatwierdzony, jego minuty nie obniżają strat dostępności w wyliczeniu OEE — traktujemy je jako czas, w którym maszyna teoretycznie powinna była pracować.</div></div>' +
      pendingHtml + '</div>' +
      '<div class="panel" style="margin-top:16px;"><div class="section-head"><div class="eyebrow">Słownik</div><h2 class="section-title small">Powody przestojów</h2>' +
      '<div class="section-sub">Lista do wyboru przy wpisie zmiany. Nazwę możesz poprawić bezpośrednio w tabeli.</div></div>' +
      reasonsTable +
      '<form class="inline-add" id="addReasonForm"><input type="text" id="newReasonName" placeholder="Nazwa powodu" maxlength="120"><button type="submit" class="primary">Dodaj</button></form></div>' +
      '<div class="panel" style="margin-top:16px;"><div class="section-head"><div class="eyebrow">Ostatnio rozpatrzone</div><h2 class="section-title small">Historia decyzji</h2></div>' +
      reviewedHtml + '</div>';
  }

  /* =====================================================================
     PLANOWANIE — kolejka zleceń na maszynę (Panel kierownika). Zarządza
     wyłącznie kierownik/admin — operator tylko widzi tę kolejkę przy
     wpisie zmiany (patrz renderOrderQueue w renderOperator).
     ===================================================================== */

  function orderRowsHtml(machineId) {
    var list = ordersForMachine(machineId);
    return list.map(function (o, idx) {
      var produced = producedForOrder(o.id);
      var pct = o.targetQty > 0 ? Math.round((produced / o.targetQty) * 100) : 0;
      var done = orderDone(o);
      var overdue = orderOverdue(o);
      var badge = done ? '<span class="status-tag approved">zrealizowane</span>'
        : overdue ? '<span class="status-tag rejected">przeterminowane</span>'
        : '<span class="status-tag pending">w kolejce</span>';
      if (o.priority) badge = '<span class="status-tag priority">pilne</span> ' + badge;
      var dueTxt = o.dueDate ? fmtDate(o.dueDate) : "—";
      var chainTxt = "";
      if (o.chainId && o.chainTotal > 1) {
        chainTxt = '<div class="hint">Etap ' + o.chainSeq + '/' + o.chainTotal + ' z receptury</div>';
        var prevO = prevChainOrder(o);
        if (prevO) {
          var prevProduced = producedForOrder(prevO.id);
          chainTxt += '<div class="hint">Poprzedni etap (' + escAttr(machineName(prevO.machineId)) + '): ' +
            (prevO.status === "cancelled" ? "anulowany" : prevProduced + "/" + prevO.targetQty + " szt.") +
            ' — informacyjnie, nie blokuje</div>';
        }
      }
      return '<tr><td class="num tabular">' + (idx + 1) + '</td>' +
        '<td>' + escAttr(productName(o.productId)) + (o.note ? '<div class="hint">' + escAttr(o.note) + '</div>' : '') + chainTxt + '</td>' +
        '<td class="num tabular">' + o.targetQty + '</td>' +
        '<td class="num tabular">' + produced + ' z ' + o.targetQty + ' (' + pct + '%)</td>' +
        '<td class="num tabular">' + dueTxt + '</td>' +
        '<td>' + badge + '</td>' +
        '<td style="white-space:nowrap;">' +
        '<button type="button" class="small" data-order-priority="' + o.id + '">' + (o.priority ? "Cofnij pilne" : "Oznacz jako pilne") + '</button> ' +
        '<button type="button" class="small" data-order-cancel="' + o.id + '">Anuluj</button>' +
        '</td></tr>';
    }).join("");
  }

  // ---- planowanie z receptury: jedno kliknięcie -> zlecenie na KAŻDĄ maszynę z marszruty
  // produktu, po kolei, w tej samej ilości. Sekwencja jest tylko informacyjna (patrz notatka
  // "poprzedni etap" w orderRowsHtml/renderOrderQueue) — nic nigdy nie blokuje ręcznego
  // rozpoczęcia produkcji, zgodnie z tym, co ustaliliśmy (zakłady mają problem z niekompletnymi/
  // zmieniającymi się recepturami, więc obejście musi zawsze działać). Etap, którego maszyna+
  // produkt nie ma ustawionej wydajności (product_rates) jest pomijany — bo operator i tak nie
  // mógłby na niego wpisać zmiany z policzoną normą (patrz refreshProducts w renderOperator) —
  // kierownik jest o tym jawnie informowany i może taki etap dodać ręcznie poniżej.
  function recipeOrderFormHtml() {
    var withRecipeSteps = state.products.filter(function (p) { return (state.recipeStepsByProduct[p.id] || []).length > 0; });
    if (!withRecipeSteps.length) {
      return '<div class="panel"><div class="section-head"><div class="eyebrow">Planowanie z receptury</div><h2 class="section-title small">Automatyczne zlecenie na kilku maszynach</h2></div>' +
        '<div class="empty-hint">Żaden produkt nie ma jeszcze receptury z etapami (zakładka Receptury) — jak dodasz, jednym kliknięciem rozpiszesz tu zlecenie na wszystkie jego maszyny po kolei.</div></div>';
    }
    var opts = '<option value="">— wybierz produkt —</option>' + withRecipeSteps.map(function (p) {
      return '<option value="' + p.id + '">' + escAttr(p.code ? p.code + " — " + p.name : p.name) + '</option>';
    }).join("");
    return '<div class="panel"><div class="section-head"><div class="eyebrow">Planowanie z receptury</div><h2 class="section-title small">Automatyczne zlecenie na kilku maszynach</h2>' +
      '<div class="section-sub">Wybierz produkt z receptury — dopiszemy po jednym zleceniu na KAŻDĄ maszynę jego marszruty, w tej samej ilości. Kolejne etapy operator widzi informacyjnie jako „poprzedni etap: X z Y szt." — to nigdy nie blokuje ręcznego rozpoczęcia produkcji.</div></div>' +
      '<form class="form-grid" id="addRecipeOrderForm">' +
      '<div class="field span-3"><label for="recOrdProduct">Produkt (z recepturą)</label><select id="recOrdProduct">' + opts + '</select></div>' +
      '<div class="field span-3"><label for="recOrdQty">Ilość docelowa (szt.)</label><input id="recOrdQty" type="number" min="1" step="1"></div>' +
      '<div class="field" style="grid-column:1/-1;"><span class="hint" id="recOrdPreview"></span></div>' +
      '<div class="field span-3"><label for="recOrdDue">Termin</label><input id="recOrdDue" type="date" required></div>' +
      '<div class="field span-3"><label for="recOrdNote">Notatka (opcjonalnie)</label><input id="recOrdNote" type="text" maxlength="250" placeholder="np. dla klienta X"></div>' +
      '<div class="form-actions"><button type="submit" class="primary">Utwórz zlecenia z receptury</button><span class="form-msg" id="addRecipeOrderMsg">Utworzono.</span></div>' +
      '</form></div>';
  }

  function ordersAdminHtml() {
    var recipeSection = recipeOrderFormHtml();
    var machinesWithQueue = state.machines.filter(function (m) { return ordersForMachine(m.id).length > 0; });
    var sections = machinesWithQueue.map(function (m) {
      return '<div class="panel" style="margin-top:16px;"><div class="section-head"><div class="eyebrow">Kolejka</div><h2 class="section-title small">' + escAttr(m.name) + '</h2></div>' +
        '<div class="table-scroll"><table class="compact"><thead><tr><th>#</th><th>Produkt</th><th class="num">Cel</th><th class="num">Zrobiono</th><th>Termin</th><th>Status</th><th>Akcje</th></tr></thead><tbody>' +
        orderRowsHtml(m.id) + '</tbody></table></div></div>';
    }).join("");

    if (!state.machines.length || !state.products.length) {
      return recipeSection + '<div class="panel" style="margin-top:16px;"><div class="section-head"><div class="eyebrow">Planowanie</div><h2 class="section-title small">Kolejka zleceń</h2></div>' +
        '<div class="empty-hint">Dodaj najpierw przynajmniej jedną maszynę i produkt z ustawioną wydajnością (zakładki Maszyny i Produkty w Panelu administratora), żeby móc planować zlecenia.</div></div>';
    }

    var machOpts = state.machines.map(function (m) { return '<option value="' + m.id + '">' + escAttr(m.name) + '</option>'; }).join("");

    return recipeSection +
      '<div class="panel" style="margin-top:16px;"><div class="section-head"><div class="eyebrow">Planowanie</div><h2 class="section-title small">Kolejka zleceń</h2>' +
      '<div class="section-sub">Co i w jakiej ilości ma powstać na każdej maszynie. Kolejka sortuje się sama od najwcześniejszego terminu — przeterminowane zlecenia są zawsze na górze. Jeśli coś musi powstać szybciej z innego powodu niż termin (np. zwolniła się maszyna), oznacz je jako „Pilne" — wskoczy na samą górę, a termin zostaje bez zmian, więc Zapotrzebowanie i Raport nadal liczą uczciwie. Operator widzi tę kolejkę przy wpisie zmiany i jednym kliknięciem wypełnia nią formularz — „Zrobiono" liczy się samo, z wpisów zapisanych z tego zlecenia.</div></div>' +
      '<form class="form-grid" id="addOrderForm">' +
      '<div class="field span-2"><label for="ordMachine">Maszyna</label><select id="ordMachine">' + machOpts + '</select></div>' +
      '<div class="field span-2"><label for="ordProduct">Produkt</label><select id="ordProduct"></select></div>' +
      '<div class="field span-2"><label for="ordQty">Ilość docelowa (szt.)</label><input id="ordQty" type="number" min="1" step="1"></div>' +
      '<div class="field span-3"><label for="ordDue">Termin</label><input id="ordDue" type="date" required></div>' +
      '<div class="field span-3"><label for="ordNote">Notatka (opcjonalnie)</label><input id="ordNote" type="text" maxlength="250" placeholder="np. dla klienta X"></div>' +
      '<div class="form-actions"><button type="submit" class="primary">Dodaj do kolejki</button><span class="form-msg" id="addOrderMsg">Dodano.</span></div>' +
      '</form></div>' +
      (sections || '<div class="empty-hint" style="margin-top:16px;">Żadna maszyna nie ma jeszcze nic w kolejce — dodaj pierwsze zlecenie powyżej.</div>');
  }

  // checkboxy magazynów — te same 3 linijki logiki użyte i w Zapotrzebowaniu, i w formularzu
  // nowej inwentaryzacji: reprezentacja "które id są zaznaczone" to null = wszystkie (domyślnie,
  // dopóki użytkownik czegoś nie odznaczy) albo tablica zaznaczonych id.
  function warehouseCheckboxesHtml(namePrefix, selectedIds) {
    return state.warehouses.map(function (w) {
      var checked = (selectedIds === null || selectedIds.indexOf(w.id) !== -1);
      return '<label class="checkbox-inline"><input type="checkbox" data-' + namePrefix + '-warehouse="' + w.id + '"' + (checked ? " checked" : "") + '> ' + escAttr(w.name) + '</label>';
    }).join(" ");
  }
  function readWarehouseCheckboxes(root, namePrefix) {
    var boxes = root.querySelectorAll('[data-' + namePrefix + '-warehouse]');
    var checkedIds = [], total = 0;
    boxes.forEach(function (b) {
      total++;
      if (b.checked) checkedIds.push(b.getAttribute('data-' + namePrefix + '-warehouse'));
    });
    if (!total) return null;
    return checkedIds.length === total ? null : checkedIds;
  }

  function materialPlanHtml() {
    var req = materialRequirements();
    var relevant = state.materials.filter(function (m) { return (req[m.id] && req[m.id].total > 0) || materialStockQty(m.id, null) != null; });
    relevant.sort(function (a, b) {
      var ra = req[a.id] ? req[a.id].total : 0, rb = req[b.id] ? req[b.id].total : 0;
      return rb - ra; // największe zapotrzebowanie na górze
    });
    var rows = relevant.map(function (m) {
      var r = req[m.id] || { total: 0, overdue: 0, soon: 0, month: 0, later: 0, none: 0 };
      var stock = materialStockQty(m.id, zapWarehouseFilter);
      var diff = stock != null ? (stock - r.total) : null;
      var diffTxt = diff == null ? "—" : (diff < 0 ? '<span class="status-tag rejected">brakuje ' + fmtQty(-diff) + '</span>' : fmtQty(diff));
      var stockTxt = stock != null ? fmtQty(stock) : "—";
      return '<tr><td>' + escAttr(m.code ? m.code + " — " + m.name : m.name) + '</td>' +
        '<td>' + unitLabel(m.unit) + '</td>' +
        '<td class="num tabular">' + (r.overdue > 0 ? fmtQty(r.overdue) : "—") + '</td>' +
        '<td class="num tabular">' + (r.soon > 0 ? fmtQty(r.soon) : "—") + '</td>' +
        '<td class="num tabular">' + (r.month > 0 ? fmtQty(r.month) : "—") + '</td>' +
        '<td class="num tabular">' + ((r.later + r.none) > 0 ? fmtQty(r.later + r.none) : "—") + '</td>' +
        '<td class="num tabular"><b>' + (r.total > 0 ? fmtQty(r.total) : "—") + '</b></td>' +
        '<td class="num tabular">' + stockTxt + '</td>' +
        '<td class="num tabular">' + diffTxt + '</td></tr>';
    }).join("");

    var table = rows
      ? '<div class="table-scroll" style="margin-top:12px;"><table class="compact"><thead><tr><th>Surowiec</th><th>Jedn.</th><th class="num">Zaległe</th><th class="num">≤7 dni</th><th class="num">≤30 dni</th><th class="num">Później</th><th class="num">Razem potrzeba</th><th class="num">Stan' + (zapWarehouseFilter ? " (wybrane magazyny)" : "") + '</th><th class="num">Różnica</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="empty-hint">Brak zapotrzebowania — żadne aktywne zlecenie nie ma jeszcze receptury z surowcami (albo wszystkie zlecenia są zrealizowane), i żaden surowiec nie ma jeszcze wczytanego stanu.</div>';

    var warehouseFilterBlock = state.warehouses.length
      ? '<div class="inline-add" style="margin-top:10px;flex-wrap:wrap;"><span class="hint">Licz stan z magazynów:</span> ' + warehouseCheckboxesHtml("zap", zapWarehouseFilter) + '</div>'
      : '<div class="empty-hint">Brak zdefiniowanych magazynów — dodaj je w zakładce Magazyny, żeby móc wczytać stan.</div>';

    var importWhOptions = state.warehouses.map(function (w) { return '<option value="' + w.id + '">' + escAttr(w.name) + '</option>'; }).join("");
    var importBlock = state.warehouses.length
      ? '<div class="import-box" style="margin-top:14px;"><div class="import-head"><span class="eyebrow">Wczytaj stan magazynowy</span><span class="hint">Jeden surowiec w linii: Kod albo Nazwa;Ilość na stanie (np. SUR-001;120 albo Blacha 2mm;120 — działa też przecinek albo tabulator). Dopasowujemy po kodzie, a jeśli go nie ma — po nazwie; surowiec musi już być na liście Surowce. Nadpisuje stan TYLKO w wybranym niżej magazynie i tylko surowcom z pliku — reszta zostaje bez zmian. Plik Excel (.xlsx): pierwsza kolumna kod/nazwa, druga ilość.</span></div>' +
      '<div class="inline-add"><select id="importStockWarehouse">' + importWhOptions + '</select><input type="file" id="importStockFile" accept=".csv,.txt,.xlsx,.xls"><button type="button" class="ghost small" id="importStockBtn">Wczytaj</button></div>' +
      '<span class="form-msg" id="importStockMsg"></span></div>'
      : '';

    return '<div class="panel"><div class="section-head"><div class="eyebrow">Planowanie surowców</div><h2 class="section-title small">Zapotrzebowanie na surowce</h2>' +
      '<div class="section-sub">Ile którego surowca potrzeba na to, co ZOSTAŁO do zrobienia z aktywnych zleceń (nie na całe zlecenie — to, co już zrobione, ma surowiec już zużyty), według receptur produktów. Kolumny „Zaległe" / „≤7 dni" / „≤30 dni" / „Później" to ten sam surowiec rozbity wg terminu zlecenia, do którego jest potrzebny — dla orientacji, co jest pilne (suma tych czterech = „Razem potrzeba"). Kolumna „Stan" to suma stanu z zaznaczonych niżej magazynów. Zlecenia rozpisane automatycznie z jednej receptury na kilka maszyn liczą się raz — surowiec zużywa się przy starcie, nie na każdym etapie z osobna.</div></div>' +
      warehouseFilterBlock + table + importBlock + '</div>';
  }

  /* =====================================================================
     INWENTARYZACJA — dwa NIEZALEŻNE liczenia tej samej listy towarów (spis
     z natury), porównywane na końcu, żeby wyłapać rozbieżności. JEDEN
     ARKUSZ (stocktake_item) = JEDEN surowiec/produkt W JEDNYM magazynie —
     ten sam towar w dwóch magazynach dostaje dwa osobne, niezależnie liczone
     arkusze z własnymi numerami (sheetNo, unikalny w obrębie spisu). Arkusz
     może też być "pusty" (bez material_id/product_id) — na towar znaleziony
     na hali bez ewidencji, spisywany ręcznie kodem/nazwą wprost na kartce.
     Lista pozycji to ZDJĘCIE stanu w chwili utworzenia spisu — kod/nazwa/
     jednostka skopiowane jako tekst, więc stara inwentaryzacja zostaje
     dokładnie taka, jaka była na wydruku, nawet jeśli później zmienisz/
     usuniesz surowiec czy produkt (patrz komentarz w migracji). Jedna
     tabela na ekranie robi podwójną robotę: wpisywanie OBU liczeń
     I porównanie na żywo — nie ma potrzeby osobnego "trzeciego" widoku.
     ===================================================================== */

  function stocktakeById(id) { return state.stocktakes.filter(function (s) { return s.id === id; })[0]; }
  // state.stocktakeItems jest już posortowane po sheetNo przy wczytaniu (patrz loadCompanyData),
  // więc grupowanie po stocktakeId zachowuje tę kolejność — nic tu nie trzeba dosortowywać.
  function stocktakeItemsFor(id) { return state.stocktakeItemsByStocktake[id] || []; }

  function stocktakeItemStatus(item) {
    if (item.count1Qty == null || item.count2Qty == null) return "missing";
    return item.count1Qty === item.count2Qty ? "match" : "diff";
  }

  function stocktakeSummary(items) {
    var match = 0, diff = 0, missing = 0;
    items.forEach(function (i) {
      var s = stocktakeItemStatus(i);
      if (s === "match") match++; else if (s === "diff") diff++; else missing++;
    });
    return { match: match, diff: diff, missing: missing, total: items.length };
  }

  // filtr "które numery arkuszy teraz wpisujemy/drukujemy" — na ekranie szczegółu spisu.
  // null/null = bez filtra (wszystkie arkusze).
  function filteredStocktakeItems(id) {
    var items = stocktakeItemsFor(id);
    if (stocktakeSheetFrom == null && stocktakeSheetTo == null) return items;
    return items.filter(function (i) {
      if (stocktakeSheetFrom != null && i.sheetNo < stocktakeSheetFrom) return false;
      if (stocktakeSheetTo != null && i.sheetNo > stocktakeSheetTo) return false;
      return true;
    });
  }

  function isBlankStocktakeItem(i) { return !i.materialId && !i.productId; }
  var STOCKTAKE_KIND_LABEL = { material: "surowiec", product: "produkt" };
  function stocktakeItemKindLabel(i) { return STOCKTAKE_KIND_LABEL[i.itemKind] || "puste"; }

  // etykieta arkusza pokazywana na ekranie/wydruku/eksporcie: "DD_MM_RRRR-N", gdzie data to
  // dzień UTWORZENIA TEGO KONKRETNEGO arkusza (dla dołożonych później pustych arkuszy — dzień
  // dołożenia, nie dzień założenia całego spisu) i N to jego numer w obrębie spisu. N zostaje
  // zwykłą liczbą (patrz sheetNo) — to on rządzi sortowaniem/filtrem zakresu, etykieta służy
  // tylko do czytania/drukowania.
  function fmtSheetDate(isoStr) {
    var d = new Date((isoStr || "").slice(0, 10) + "T00:00:00");
    if (isNaN(d.getTime())) return "00_00_0000";
    var dd = ("0" + d.getDate()).slice(-2), mm = ("0" + (d.getMonth() + 1)).slice(-2);
    return dd + "_" + mm + "_" + d.getFullYear();
  }
  function sheetLabel(item) { return fmtSheetDate(item.createdAt) + "-" + item.sheetNo; }

  // buduje pełny "przekrój" (surowce/produkty × magazyny) + puste arkusze dla nowej
  // inwentaryzacji "z systemu" — CELOWO bez filtrowania po istniejącym stanie magazynowym
  // (żeby dało się policzyć też towar, który jeszcze nigdy nie miał wczytanego stanu).
  // Czysta funkcja (bez DOM/sieci) — łatwa do przetestowania i do ponownego użycia przy
  // dokładaniu pustych arkuszy do już istniejącego, otwartego spisu.
  function buildStocktakeItemsCrossProduct(warehouseIds, kinds, blankPerWarehouse, startSheetNo) {
    var items = [];
    var sheetNo = startSheetNo || 1;
    warehouseIds.forEach(function (whId) {
      if (kinds.material) {
        state.materials.forEach(function (m) {
          items.push({ sheet_no: sheetNo++, material_id: m.id, product_id: null, item_kind: "material", warehouse_id: whId, code: m.code || null, name: m.name, unit: m.unit });
        });
      }
      if (kinds.product) {
        state.products.forEach(function (p) {
          items.push({ sheet_no: sheetNo++, material_id: null, product_id: p.id, item_kind: "product", warehouse_id: whId, code: p.code || null, name: p.name, unit: null });
        });
      }
      for (var b = 0; b < (blankPerWarehouse || 0); b++) {
        items.push({ sheet_no: sheetNo++, material_id: null, product_id: null, item_kind: null, warehouse_id: whId, code: null, name: null, unit: null });
      }
    });
    return items;
  }

  function inventoryHtml() {
    if (activeStocktakeId) {
      var st = stocktakeById(activeStocktakeId);
      if (st) return stocktakeDetailHtml(st);
      activeStocktakeId = null; // spis skasowany/niedostępny w międzyczasie — wróć do listy
    }
    return stocktakeListHtml();
  }

  function stocktakeListHtml() {
    var sorted = state.stocktakes.slice().sort(function (a, b) { return b.createdAt < a.createdAt ? -1 : 1; });
    var rows = sorted.map(function (s) {
      var items = stocktakeItemsFor(s.id);
      var sum = stocktakeSummary(items);
      var statusTxt = s.closedAt
        ? '<span class="status-tag cancelled">zamknięta ' + fmtDate(s.closedAt.slice(0, 10)) + '</span>'
        : '<span class="status-tag pending">w toku</span>';
      return '<tr><td>' + escAttr(s.name) + '</td>' +
        '<td>' + fmtDate(s.createdAt.slice(0, 10)) + '</td>' +
        '<td class="num tabular">' + sum.total + '</td>' +
        '<td>' + statusTxt + (sum.diff ? ' <span class="status-tag rejected">' + sum.diff + ' z różnicą</span>' : '') + '</td>' +
        '<td style="white-space:nowrap;"><button type="button" class="small primary" data-open-stocktake="' + s.id + '">Otwórz</button> ' +
        '<button type="button" class="small" data-remove-stocktake="' + s.id + '">usuń</button></td></tr>';
    }).join("");
    var table = state.stocktakes.length
      ? '<div class="table-scroll" style="margin-top:12px;"><table class="compact"><thead><tr><th>Nazwa</th><th>Utworzono</th><th class="num">Arkuszy</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="empty-hint">Brak jeszcze żadnej inwentaryzacji — utwórz pierwszą poniżej.</div>';

    var canCreate = state.warehouses.length > 0;
    var whBlock = canCreate
      ? '<div class="inline-add" style="flex-wrap:wrap;"><span class="hint">Magazyny do policzenia:</span> ' + warehouseCheckboxesHtml("newst", newStocktakeWarehouseIds) + '</div>'
      : '<div class="empty-hint">Dodaj najpierw przynajmniej jeden magazyn w zakładce Magazyny — arkusz zawsze należy do konkretnego magazynu.</div>';
    var kindsBlock = canCreate
      ? '<div class="inline-add" style="flex-wrap:wrap;">' +
        '<label class="checkbox-inline"><input type="checkbox" id="newStocktakeKindMaterial"' + (newStocktakeKinds.material ? " checked" : "") + '> Surowce (' + state.materials.length + ')</label>' +
        '<label class="checkbox-inline"><input type="checkbox" id="newStocktakeKindProduct"' + (newStocktakeKinds.product ? " checked" : "") + '> Produkty (' + state.products.length + ')</label></div>'
      : "";

    var newBlock = '<div class="panel" style="margin-top:16px;"><div class="section-head"><div class="eyebrow">Nowa inwentaryzacja</div><h2 class="section-title small">Zacznij nowy spis</h2>' +
      '<div class="section-sub">Każdy arkusz to JEDEN surowiec albo produkt W JEDNYM magazynie — ten sam towar w dwóch magazynach dostanie dwa osobne, niezależnie liczone arkusze. Zaznacz magazyny i co liczyć, ewentualnie dodaj liczbę pustych arkuszy na magazyn (na towar bez ewidencji, znaleziony na hali) — numeracja arkuszy nada się sama.</div></div>' +
      (canCreate ? '<div class="inline-add"><input type="text" id="newStocktakeName" placeholder="Nazwa inwentaryzacji (opcjonalnie)" style="max-width:260px;"></div>' : "") +
      whBlock + kindsBlock +
      (canCreate ? '<div class="inline-add"><input type="number" id="newStocktakeBlankCount" min="0" step="1" value="0" placeholder="Puste arkusze / magazyn" style="max-width:190px;">' +
        '<button type="button" class="primary" id="createStocktakeBtn">Utwórz inwentaryzację</button></div>' +
        '<span class="form-msg" id="createStocktakeMsg"></span>' : "") +
      (canCreate
        ? '<div class="import-box" style="margin-top:14px;"><div class="import-head"><span class="eyebrow">Albo z pliku</span><span class="hint">Jedna pozycja w linii: Kod;Nazwa;Jednostka (kod opcjonalny — bez kodu: Nazwa;Jednostka). Działa też przecinek albo tabulator. Plik Excel (.xlsx): kolumny w tej samej kolejności. Dopasowujemy po kodzie/nazwie najpierw do Surowców, a jeśli nic nie pasuje — do Produktów; niedopasowane pozycje trafiają jako „puste" (bez powiązania, ale z zapisanym kodem/nazwą z pliku). Cały plik trafia do JEDNEGO wybranego niżej magazynu.</span></div>' +
        '<div class="inline-add"><select id="importStocktakeWarehouse">' + state.warehouses.map(function (w) { return '<option value="' + w.id + '">' + escAttr(w.name) + '</option>'; }).join("") + '</select>' +
        '<input type="text" id="newStocktakeFileName" placeholder="Nazwa inwentaryzacji (opcjonalnie)" style="max-width:220px;">' +
        '<input type="file" id="importStocktakeFile" accept=".csv,.txt,.xlsx,.xls"><button type="button" class="ghost small" id="importStocktakeBtn">Wczytaj i utwórz</button></div>' +
        '<span class="form-msg" id="importStocktakeMsg"></span></div>'
        : '') +
      '</div>';

    return '<div class="panel"><div class="section-head"><div class="eyebrow">Inwentaryzacja</div><h2 class="section-title small">Spisy z natury</h2>' +
      '<div class="section-sub">Dwa niezależne liczenia tej samej listy towarów, porównywane na końcu, żeby wyłapać rozbieżności — standardowy spis z natury.</div></div>' +
      table + '</div>' + newBlock;
  }

  // pojedyncze, ponumerowane "karteczki" na całą szerokość A4, myślane pod cięcie prostą
  // linią (patrz komentarz przy .stocktake-slip w CSS) — jeden arkusz = jedna karteczka.
  // Ten sam układ dla liczenia 1 i 2 (różni się tylko podpisem "Liczenie N").
  function stocktakeSlipHtml(st, items, countNum) {
    var slips = items.map(function (i) {
      var whName = warehouseName(i.warehouseId);
      var blank = isBlankStocktakeItem(i);
      var codeField = blank ? '<span class="slip-blank"></span>' : escAttr(i.code || "—");
      var nameField = blank ? '<span class="slip-blank" style="min-width:220px;"></span>' : escAttr(i.name || "—");
      var unitField = blank ? '<span class="slip-blank" style="min-width:60px;"></span>' : escAttr(unitLabel(i.unit) || "—");
      return '<div class="stocktake-slip">' +
        '<div class="slip-head"><div><div class="slip-company">' + escAttr(session.company.name) + ' — ' + escAttr(st.name) + '</div>' +
        '<div class="slip-title">Magazyn: ' + escAttr(whName) + '</div></div>' +
        '<div class="slip-badge">Arkusz nr<div class="n">' + sheetLabel(i) + '</div>Liczenie ' + countNum + '</div></div>' +
        '<div class="slip-fields">' +
        '<div class="slip-field"><b>Kod:</b> ' + codeField + '</div>' +
        '<div class="slip-field"><b>Magazyn:</b> ' + escAttr(whName) + '</div>' +
        '<div class="slip-field"><b>Nazwa:</b> ' + nameField + '</div>' +
        '<div class="slip-field"><b>J.m.:</b> ' + unitField + '</div></div>' +
        '<div class="slip-bottom"><span><b>Data:</b> <span class="slip-blank"></span></span>' +
        '<span><b>Ilość:</b> <span class="slip-blank"></span></span>' +
        '<span><b>Podpis:</b> <span class="slip-blank"></span></span></div></div>';
    }).join("");
    return '<div class="stocktake-slips">' + slips + '</div>';
  }

  // wpisywanie Liczenia 1 i Liczenia 2 to osobne zakładki (każda pokazuje TYLKO swoją kolumnę
  // ilości — łatwiej wpisywać jedno liczenie na raz, bez patrzenia na drugie), a "Różnice" to
  // trzecia zakładka z gotową listą tylko tych arkuszy, gdzie oba liczenia się nie zgadzają.
  function stocktakeCountTabHtml(st, allItems, countNum, closed, maxSheetNo) {
    var items = filteredStocktakeItems(st.id);
    var rows = items.map(function (i) {
      var blank = isBlankStocktakeItem(i);
      var qty = countNum === 1 ? i.count1Qty : i.count2Qty;
      var qCell = closed ? (qty != null ? fmtQty(qty) : "—")
        : '<input type="number" min="0" step="0.001" data-l' + countNum + '-qty="' + i.id + '" value="' + (qty != null ? qty : "") + '" style="width:90px;">';
      // kod/nazwa/jednostka edytowalne TYLKO dla pustych arkuszy (bez material_id/product_id) —
      // nazwane arkusze pokazują je jako statyczny tekst, żeby nie rozjechać się z powiązanym FK
      var codeCell = (blank && !closed) ? '<input type="text" data-blank-code="' + i.id + '" value="' + escAttr(i.code || "") + '" maxlength="30" style="width:90px;">' : escAttr(i.code || "—");
      var nameCell = (blank && !closed) ? '<input type="text" data-blank-name="' + i.id + '" value="' + escAttr(i.name || "") + '" maxlength="250" style="min-width:160px;">' : escAttr(i.name || "(puste)");
      var unitCell = (blank && !closed) ? '<input type="text" data-blank-unit="' + i.id + '" value="' + escAttr(i.unit || "") + '" maxlength="20" style="width:70px;">' : escAttr(unitLabel(i.unit) || "—");
      return '<tr><td class="tabular">' + sheetLabel(i) + '</td>' +
        '<td>' + escAttr(warehouseName(i.warehouseId)) + '</td>' +
        '<td>' + codeCell + '</td><td>' + nameCell + '</td><td>' + unitCell + '</td>' +
        '<td class="hint">' + stocktakeItemKindLabel(i) + '</td>' +
        '<td class="num tabular">' + qCell + '</td></tr>';
    }).join("");

    var table = items.length
      ? '<div class="table-scroll" style="margin-top:12px;"><table class="compact"><thead><tr><th>Arkusz</th><th>Magazyn</th><th>Kod</th><th>Nazwa</th><th>J.m.</th><th>Rodzaj</th><th class="num">Liczenie ' + countNum + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="empty-hint">Brak arkuszy w wybranym zakresie numerów.</div>';

    var filterBlock = '<div class="inline-add" style="margin-top:10px;">' +
      '<span class="hint">Pokaż arkusze o numerze od</span><input type="number" id="stFilterFrom" min="1" step="1" value="' + (stocktakeSheetFrom != null ? stocktakeSheetFrom : "") + '" style="max-width:90px;">' +
      '<span class="hint">do</span><input type="number" id="stFilterTo" min="1" step="1" value="' + (stocktakeSheetTo != null ? stocktakeSheetTo : "") + '" style="max-width:90px;">' +
      '<button type="button" class="ghost small" id="stFilterApplyBtn">Filtruj</button>' +
      (stocktakeSheetFrom != null || stocktakeSheetTo != null ? '<button type="button" class="ghost small" id="stFilterClearBtn">Pokaż wszystkie (' + allItems.length + ')</button>' : '') +
      '<span class="hint">— wpisz sam numer, bez daty (np. „1", nie „' + fmtSheetDate(todayStr()) + '-1")</span>' +
      '</div>';

    var printBlock = '<div class="form-actions" style="margin-top:10px;"><button type="button" class="ghost" id="printStocktakeBtn">Wydrukuj arkusze — Liczenie ' + countNum + '</button></div>';

    var saveBlock = closed ? "" :
      '<div class="form-actions" style="margin-top:12px;"><button type="button" class="ghost" id="saveStocktakeCountsBtn">Zapisz liczenie ' + countNum + '</button><span class="form-msg" id="stocktakeCountsMsg">Zapisano.</span></div>';

    var addBlankBlock = (!closed && state.warehouses.length)
      ? '<div class="import-box" style="margin-top:14px;"><div class="import-head"><span class="eyebrow">Dodaj puste arkusze</span><span class="hint">Kolejny numer arkusza (od ' + fmtSheetDate(todayStr()) + '-' + (maxSheetNo + 1) + ') bez przypisanego surowca/produktu — na towar znaleziony na hali bez ewidencji.</span></div>' +
        '<div class="inline-add"><select id="addBlankWarehouse">' + state.warehouses.map(function (w) { return '<option value="' + w.id + '">' + escAttr(w.name) + '</option>'; }).join("") + '</select>' +
        '<input type="number" id="addBlankCount" min="1" step="1" value="5" style="max-width:90px;">' +
        '<button type="button" class="ghost small" id="addBlankBtn">Dodaj puste arkusze</button></div>' +
        '<span class="form-msg" id="addBlankMsg"></span></div>'
      : "";

    return filterBlock + table + printBlock + saveBlock + addBlankBlock;
  }

  function stocktakeDiffTabHtml(allItems, sum) {
    var diffItems = allItems.filter(function (i) { return stocktakeItemStatus(i) === "diff"; });
    var rows = diffItems.map(function (i) {
      return '<tr><td class="tabular">' + sheetLabel(i) + '</td>' +
        '<td>' + escAttr(warehouseName(i.warehouseId)) + '</td>' +
        '<td>' + escAttr(i.code || "—") + '</td><td>' + escAttr(i.name || "(puste)") + '</td>' +
        '<td>' + escAttr(unitLabel(i.unit) || "—") + '</td>' +
        '<td class="num tabular">' + fmtQty(i.count1Qty) + '</td>' +
        '<td class="num tabular">' + fmtQty(i.count2Qty) + '</td>' +
        '<td class="num tabular"><b>' + fmtQty(i.count2Qty - i.count1Qty) + '</b></td></tr>';
    }).join("");
    var table = diffItems.length
      ? '<div class="table-scroll" style="margin-top:12px;"><table class="compact"><thead><tr><th>Arkusz</th><th>Magazyn</th><th>Kod</th><th>Nazwa</th><th>J.m.</th><th class="num">Liczenie 1</th><th class="num">Liczenie 2</th><th class="num">Różnica</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="empty-hint">Brak rozbieżności — wszystkie policzone jak dotąd arkusze się zgadzają.' + (sum.missing ? " (" + sum.missing + " arkuszy ma jeszcze niepełne liczenie — brak Liczenia 1 albo 2, patrz odpowiednie zakładki.)" : "") + '</div>';
    var missingNote = (diffItems.length && sum.missing)
      ? '<div class="hint" style="margin-top:8px;">Dodatkowo ' + sum.missing + ' arkuszy ma jeszcze niepełne liczenie — nie liczą się tu jako różnica, dopóki nie zostaną wpisane oba liczenia.</div>'
      : '';
    return table + missingNote;
  }

  function stocktakeDetailHtml(st) {
    var allItems = stocktakeItemsFor(st.id);
    var sum = stocktakeSummary(allItems);
    var closed = !!st.closedAt;
    var maxSheetNo = allItems.reduce(function (mx, i) { return Math.max(mx, i.sheetNo); }, 0);
    var subTab = stocktakeSubTab;

    var subTabsHtml = '<div class="admin-tabs" style="margin-top:12px;">' +
      '<button type="button" class="admin-tab' + (subTab === "count1" ? " active" : "") + '" data-stocktake-subtab="count1">Liczenie 1</button>' +
      '<button type="button" class="admin-tab' + (subTab === "count2" ? " active" : "") + '" data-stocktake-subtab="count2">Liczenie 2</button>' +
      '<button type="button" class="admin-tab' + (subTab === "diff" ? " active" : "") + '" data-stocktake-subtab="diff">Różnice' + (sum.diff ? " (" + sum.diff + ")" : "") + '</button>' +
      '</div>';

    var body = subTab === "diff" ? stocktakeDiffTabHtml(allItems, sum) : stocktakeCountTabHtml(st, allItems, subTab === "count2" ? 2 : 1, closed, maxSheetNo);

    var summaryTxt = "Arkuszy: " + sum.total + " · zgodnych: " + sum.match + " · z różnicą: " + sum.diff + " · bez pełnego liczenia: " + sum.missing;

    var closeBlock = closed
      ? '<div class="hint" style="margin-top:10px;">Zamknięta ' + fmtDate(st.closedAt.slice(0, 10)) + ".</div>"
      : '<div class="form-actions" style="margin-top:14px;"><button type="button" class="primary" id="closeStocktakeBtn">Zamknij inwentaryzację</button><span class="form-msg" id="closeStocktakeMsg"></span></div>';

    return '<div class="panel"><div class="section-head">' +
      '<div class="eyebrow">Inwentaryzacja</div><h2 class="section-title small">' + escAttr(st.name) + '</h2>' +
      '<div class="section-sub">Utworzono ' + fmtDate(st.createdAt.slice(0, 10)) + (closed ? " · zamknięta " + fmtDate(st.closedAt.slice(0, 10)) : " · w toku") + ". " + summaryTxt + '. Liczenie 1 i Liczenie 2 wpisujesz w osobnych zakładkach niżej (nie muszą być tego samego dnia) — zakładka „Różnice" pokazuje same arkusze, na których się nie zgadzały. Filtr numerów arkuszy w zakładkach liczenia zawęża tabelę I wydruk — przydatny, gdy wpisujesz właśnie zebraną partię kartek.' + (closed ? "" : ' Zamknięcie inwentaryzacji zaktualizuje stan magazynowy dla arkuszy, gdzie oba liczenia się zgadzają i są dopasowane do surowca/produktu.') + '</div></div>' +
      '<div class="form-actions" style="flex-wrap:wrap;"><button type="button" class="ghost" id="backToStocktakesBtn">← Wróć do listy</button> ' +
      '<button type="button" class="ghost" id="exportStocktakeXlsxBtn">Pobierz XLSX</button> ' +
      '<button type="button" class="ghost" id="exportStocktakeTxtBtn">Pobierz TXT</button></div>' +
      subTabsHtml + body + closeBlock +

  }

  var STOCKTAKE_IMPORT_HEADER_WORDS = ["kod", "code", "nazwa", "name", "surowiec", "produkt", "jednostka", "unit"];

  // parsuje plik "z pliku" dla nowej inwentaryzacji: Kod;Nazwa;Jednostka, albo bez kodu:
  // Nazwa;Jednostka — ta sama heurystyka wykrywania kolumny Kod co przy imporcie Surowców/
  // Produktów (nagłówek "kod"/"code" w pierwszej kolumnie, albo liczba kolumn). Magazyn NIE
  // jest tu kolumną — cały plik trafia do jednego magazynu wybranego w formularzu. Jednostka
  // NIE jest walidowana do MATERIAL_UNITS (w przeciwieństwie do importu Surowców) — to tylko
  // migawka na wydruk/eksport, dowolny tekst z pliku się nadaje.
  function rowsToStocktakeItems(rows) {
    var header0 = rows[0] || [];
    var header0Cols = Array.isArray(header0) ? header0 : [header0];
    var header0First = (header0Cols[0] == null ? "" : header0Cols[0]).toString().trim().toLowerCase();
    var hasCodeCol = (header0First === "kod" || header0First === "code" || header0Cols.length >= 3);
    var out = [];
    rows.forEach(function (r) {
      var cols = Array.isArray(r) ? r : [r];
      var code, name, unit;
      if (hasCodeCol) { code = cols[0]; name = cols[1]; unit = cols[2]; }
      else { code = ""; name = cols[0]; unit = cols[1]; }
      code = clampCode(code);
      name = (name == null ? "" : name).toString().trim();
      if (!name) return;
      var low = name.toLowerCase();
      if (STOCKTAKE_IMPORT_HEADER_WORDS.indexOf(low) !== -1) return;
      unit = (unit == null ? "" : unit).toString().trim();
      out.push({ code: code, name: name, unit: unit });
    });
    return out;
  }

  function exportStocktakeXlsx(st, items) {
    if (!window.XLSX) { bannerMsg = "Biblioteka do zapisu Excela się nie wczytała. Odśwież stronę i spróbuj ponownie."; renderApp(); return; }
    var wb = XLSX.utils.book_new();
    var header = ["Arkusz", "Magazyn", "Rodzaj", "Kod", "Nazwa", "J.m.", "Liczenie 1", "Liczenie 2", "Różnica", "Status"];
    var STATUS_LABEL = { match: "zgodne", diff: "różnica", missing: "brak liczenia" };
    var body = items.map(function (i) {
      var status = stocktakeItemStatus(i);
      var diff = (i.count1Qty != null && i.count2Qty != null) ? (i.count2Qty - i.count1Qty) : "";
      return [sheetLabel(i), warehouseName(i.warehouseId), stocktakeItemKindLabel(i), i.code, i.name, unitLabel(i.unit), i.count1Qty != null ? i.count1Qty : "", i.count2Qty != null ? i.count2Qty : "", diff, STATUS_LABEL[status]];
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([header].concat(body)), "Inwentaryzacja");
    var fname = "inwentaryzacja-" + st.name.replace(/[^a-z0-9]+/gi, "_").toLowerCase() + "-" + todayStr() + ".xlsx";
    XLSX.writeFile(wb, fname);
  }

  function exportStocktakeTxt(st, items) {
    var STATUS_LABEL = { match: "zgodne", diff: "różnica", missing: "brak liczenia" };
    var lines = ["Arkusz;Magazyn;Rodzaj;Kod;Nazwa;J.m.;Liczenie 1;Liczenie 2;Różnica;Status"];
    items.forEach(function (i) {
      var status = stocktakeItemStatus(i);
      var diff = (i.count1Qty != null && i.count2Qty != null) ? fmtQty(i.count2Qty - i.count1Qty) : "";
      lines.push([sheetLabel(i), warehouseName(i.warehouseId), stocktakeItemKindLabel(i), i.code, i.name, unitLabel(i.unit),
        i.count1Qty != null ? fmtQty(i.count1Qty) : "", i.count2Qty != null ? fmtQty(i.count2Qty) : "",
        diff, STATUS_LABEL[status]].join(";"));
    });
    var blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "inwentaryzacja-" + st.name.replace(/[^a-z0-9]+/gi, "_").toLowerCase() + "-" + todayStr() + ".txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* =====================================================================

     targetWarehouseId) — po zatwierdzeniu dokument jest trwały, aplikacja

     stocktake_items, warehouse_document_items to ZDJĘCIE towaru w chwili

  var DOC_TYPE_META = {

  /* =====================================================================
     UTRZYMANIE RUCHU — osobny, prosty rejestr awarii/przeglądów/serwisów
     maszyn (maintenance_logs), NIEZALEŻNY od przestojów w ramach zmiany.
     Cel: widzieć, czy konkretna maszyna zaczyna się psuć częściej — bez
     nowego wykresu, prostym porównaniem ostatnich 90 dni z poprzednimi 90.
     ===================================================================== */

  var MAINTENANCE_KINDS = [
    { key: "awaria", label: "Awaria" },
    { key: "przeglad", label: "Przegląd" },
    { key: "serwis", label: "Serwis" }
  ];
  function maintenanceKindLabel(k) { var m = MAINTENANCE_KINDS.filter(function (x) { return x.key === k; })[0]; return m ? m.label : k; }

  // porównanie ostatnich 90 dni z poprzednimi 90 — tylko dla wpisów typu "awaria"
  // (przeglądy/serwisy są planowane, nie mówią same z siebie, że maszyna się psuje).
  // Zwraca wiersze tylko dla maszyn, które mają CHOĆ JEDEN wpis w rejestrze — reszta
  // maszyn nie zaśmieca tabeli samymi kreskami.
  function maintenanceFrequencyRows() {
    var from90 = daysAgoStr(89), fromPrev90 = daysAgoStr(179);
    var byMachine = {};
    state.maintenanceLogs.forEach(function (l) {
      if (!byMachine[l.machineId]) byMachine[l.machineId] = [];
      byMachine[l.machineId].push(l);
    });
    return Object.keys(byMachine).map(function (machineId) {
      var logs = byMachine[machineId];
      var awarie = logs.filter(function (l) { return l.kind === "awaria"; });
      var last90 = awarie.filter(function (l) { return l.date >= from90; }).length;
      var prev90 = awarie.filter(function (l) { return l.date >= fromPrev90 && l.date < from90; }).length;
      var lastDate = logs.reduce(function (max, l) { return !max || l.date > max ? l.date : max; }, null);
      var trend;
      if (last90 === 0 && prev90 === 0) trend = '<span class="hint">— brak awarii</span>';
      else if (last90 > prev90) trend = '<span class="status-tag rejected">▲ częściej</span>';
      else if (last90 < prev90) trend = '<span class="status-tag approved">▼ rzadziej</span>';
      else trend = '<span class="status-tag cancelled">→ bez zmian</span>';
      return { machineId: machineId, last90: last90, prev90: prev90, lastDate: lastDate, trend: trend };
    }).sort(function (a, b) { return b.last90 - a.last90; });
  }
