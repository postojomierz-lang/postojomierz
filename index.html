  /* =====================================================================
     IMPORT Z PLIKU (Excel .xlsx/.xls albo tekst .csv/.txt) — dla maszyn,
     operatorów i produktów. Format tekstowy: jedna pozycja w linii,
     opcjonalnie z drugą kolumną oddzieloną przecinkiem/średnikiem/tabem
     (używane tylko dla operatorów, jako Imię;PIN). Plik Excel: pierwszy
     arkusz, pierwsza kolumna to nazwa, druga (dla operatorów) to PIN.
     ===================================================================== */

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  var IMPORT_LABELS = {
    machines: { hint: 'Jedna maszyna w linii. Plik .txt/.csv: sama nazwa w każdej linii. Plik Excel (.xlsx): jedna kolumna z nazwami.' },
    operators: { hint: 'Jedna osoba w linii, w formacie: Imię i nazwisko;PIN (działa też przecinek albo tabulator). Plik Excel (.xlsx): pierwsza kolumna imię, druga PIN.' },
    products: { hint: 'Jeden produkt w linii: Produkt;Maszyna;Ilość maksymalna dzienna (np. Wspornik A;Tokarka 1;850) — albo z kodem na początku: Kod;Produkt;Maszyna;Ilość maksymalna dzienna. Maszyna musi już istnieć na liście Maszyny — z ilości dziennej przeliczymy orientacyjny czas cyklu na podstawie ustawień czasu zmiany (zakładka Ustawienia) i TPZ tej maszyny, co zawsze możesz poprawić ręcznie w tabeli obok. Jeśli produkt z takim kodem/nazwą już istnieje, dopiszemy tylko brakującą wydajność (i uzupełnimy kod, jeśli go jeszcze nie było).' },
    materials: { hint: 'Jeden surowiec w linii: Nazwa;Jednostka (np. Blacha 2mm;kg) — albo z kodem na początku: Kod;Nazwa;Jednostka (działa też przecinek albo tabulator). Jednostka musi być jedną z: ' + MATERIAL_UNITS.map(function (u) { return u.key; }).join(", ") + '. Plik Excel (.xlsx): kolumny w tej samej kolejności.' }
  };

  function importBlockHtml(kind) {
    var meta = IMPORT_LABELS[kind];
    var k = cap(kind);
    return '<div class="import-box"><div class="import-head"><span class="eyebrow">Import z pliku</span><span class="hint">' + meta.hint + '</span></div>' +
      '<div class="inline-add">' +
      '<input type="file" id="import' + k + 'File" accept=".csv,.txt,.xlsx,.xls">' +
      '<button type="button" class="ghost small" id="import' + k + 'Btn">Importuj</button>' +
      '</div><span class="form-msg" id="import' + k + 'Msg"></span></div>';
  }

  function parseImportFile(file, cb) {
    var lower = file.name.toLowerCase();
    if (lower.endsWith(".xlsx") || lower.endsWith(".xls")) {
      if (!window.XLSX) { cb(null, new Error("Biblioteka do czytania plików Excel się nie wczytała. Odśwież stronę albo użyj pliku .csv/.txt.")); return; }
      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var data = new Uint8Array(e.target.result);
          var wb = XLSX.read(data, { type: "array" });
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
          cb(rows, null);
        } catch (err) { cb(null, err); }
      };
      reader.onerror = function () { cb(null, new Error("Nie udało się odczytać pliku.")); };
      reader.readAsArrayBuffer(file);
    } else {
      var reader2 = new FileReader();
      reader2.onload = function (e) {
        var text = (e.target.result || "").toString();
        var lines = text.split(/\r\n|\r|\n/).filter(function (l) { return l.trim() !== ""; });
        var rows = lines.map(function (l) {
          var delim = l.indexOf(";") !== -1 ? ";" : (l.indexOf(",") !== -1 ? "," : (l.indexOf("\t") !== -1 ? "\t" : null));
          return delim ? l.split(delim).map(function (x) { return x.trim(); }) : [l.trim()];
        });
        cb(rows, null);
      };
      reader2.onerror = function () { cb(null, new Error("Nie udało się odczytać pliku.")); };
      reader2.readAsText(file, "UTF-8");
    }
  }

  var IMPORT_HEADER_WORDS = ["nazwa", "name", "maszyna", "machine", "produkt", "product", "imię", "imie", "operator", "imię i nazwisko"];

  function rowsToNewNames(rows, existing) {
    var existingLower = existing.map(function (x) { return x.name.trim().toLowerCase(); });
    var seen = {}, out = [];
    rows.forEach(function (r) {
      var v = (Array.isArray(r) ? r[0] : r);
      v = (v == null ? "" : v).toString().trim();
      if (!v) return;
      var low = v.toLowerCase();
      if (IMPORT_HEADER_WORDS.indexOf(low) !== -1) return;
      if (existingLower.indexOf(low) !== -1) return;
      if (seen[low]) return;
      seen[low] = true;
      out.push(v);
    });
    return out;
  }

  function rowsToNewOperators(rows, existing) {
    var existingLower = existing.map(function (x) { return x.name.trim().toLowerCase(); });
    var seen = {}, out = [];
    rows.forEach(function (r) {
      var name = (Array.isArray(r) ? r[0] : "");
      var pin = (Array.isArray(r) ? r[1] : "");
      name = (name == null ? "" : name).toString().trim();
      pin = (pin == null ? "" : pin).toString().trim();
      if (!name) return;
      var low = name.toLowerCase();
      if (IMPORT_HEADER_WORDS.indexOf(low) !== -1) return;
      if (!pin) return;
      if (existingLower.indexOf(low) !== -1) return;
      if (seen[low]) return;
      seen[low] = true;
      out.push({ name: name, pin: pin });
    });
    return out;
  }

  // dopasowuje wpisaną jednostkę do jednej z MATERIAL_UNITS po kluczu ALBO po etykiecie,
  // bez rozróżniania wielkości liter/spacji — "Kg", "kg", "KILOGRAM" nie muszą się różnić
  // dla kogoś eksportującego z Excela, ale "m2"/"m²" muszą trafić w to samo
  function matchUnit(raw) {
    var v = (raw == null ? "" : raw).toString().trim().toLowerCase();
    var hit = MATERIAL_UNITS.filter(function (u) { return u.key.toLowerCase() === v || u.label.toLowerCase() === v; })[0];
    return hit ? hit.key : null;
  }

  function rowsToNewMaterials(rows, existing) {
    var existingLower = existing.map(function (x) { return x.name.trim().toLowerCase(); });
    // wykryj czy plik ma kolumnę Kod na początku — tak samo jak przy produktach: nagłówek
    // "kod"/"code" w pierwszej kolumnie, albo po prostu 3+ kolumny w wierszu nagłówkowym
    var header0 = rows[0] || [];
    var header0Cols = Array.isArray(header0) ? header0 : [header0];
    var header0First = (header0Cols[0] == null ? "" : header0Cols[0]).toString().trim().toLowerCase();
    var hasCodeCol = (header0First === "kod" || header0First === "code" || header0Cols.length >= 3);
    var seen = {}, out = [];
    rows.forEach(function (r) {
      var cols = Array.isArray(r) ? r : [r];
      var code, name, unitRaw;
      if (hasCodeCol) { code = cols[0]; name = cols[1]; unitRaw = cols[2]; }
      else { code = ""; name = cols[0]; unitRaw = cols[1]; }
      code = clampCode(code);
      name = (name == null ? "" : name).toString().trim();
      if (!name) return;
      var low = name.toLowerCase();
      if (IMPORT_HEADER_WORDS.indexOf(low) !== -1) return;
      var unit = matchUnit(unitRaw);
      if (!unit) return;
      if (existingLower.indexOf(low) !== -1) return;
      if (seen[low]) return;
      seen[low] = true;
      out.push({ name: name, unit: unit, code: code || null });
    });
    return out;
  }

  function wireImportHandler(kind, table, mapRowsToRecords) {
    var btn = document.getElementById("import" + cap(kind) + "Btn");
    var fileInput = document.getElementById("import" + cap(kind) + "File");
    var msgEl = document.getElementById("import" + cap(kind) + "Msg");
    if (!btn || !fileInput) return;
    btn.addEventListener("click", function () {
      msgEl.classList.remove("show", "error");
      var file = fileInput.files[0];
      if (!file) { msgEl.textContent = "Najpierw wybierz plik."; msgEl.classList.add("show", "error"); return; }
      btn.disabled = true;
      parseImportFile(file, async function (rows, err) {
        if (err) { btn.disabled = false; msgEl.textContent = "Błąd odczytu pliku: " + err.message; msgEl.classList.add("show", "error"); return; }
        var records = mapRowsToRecords(rows);
        if (!records.length) {
          btn.disabled = false;
          msgEl.textContent = "Nie znaleziono żadnych nowych, poprawnych wierszy do zaimportowania (puste, bez PIN-u albo już na liście).";
          msgEl.classList.add("show", "error");
          return;
        }
        var res = await sb.from(table).insert(records);
        btn.disabled = false;
        if (res.error) { msgEl.textContent = "Nie udało się zaimportować: " + res.error.message; msgEl.classList.add("show", "error"); return; }
        var importedCount = records.length;
        await loadCompanyData();
        renderAdmin(document.getElementById("adminRoot"));
        var freshMsg = document.getElementById("import" + cap(kind) + "Msg");
        if (freshMsg) {
          freshMsg.textContent = "Zaimportowano: " + importedCount + ".";
          freshMsg.classList.add("show");
          setTimeout(function () { freshMsg.classList.remove("show"); }, 3000);
        }
      });
    });
  }

  var IMPORT_HEADER_WORDS_PRODUCTS = ["produkt", "product", "nazwa", "maszyna", "machine", "ilość", "ilosc", "ilość maksymalna dzienna", "ilosc maksymalna dzienna", "qty", "max", "kod", "code"];

  function wireProductsImportHandler() {
    var btn = document.getElementById("importProductsBtn");
    var fileInput = document.getElementById("importProductsFile");
    var msgEl = document.getElementById("importProductsMsg");
    if (!btn || !fileInput) return;
    btn.addEventListener("click", function () {
      msgEl.classList.remove("show", "error");
      var file = fileInput.files[0];
      if (!file) { msgEl.textContent = "Najpierw wybierz plik."; msgEl.classList.add("show", "error"); return; }
      btn.disabled = true;
      parseImportFile(file, async function (rows, err) {
        if (err) { btn.disabled = false; msgEl.textContent = "Błąd odczytu pliku: " + err.message; msgEl.classList.add("show", "error"); return; }

        // wykryj czy plik ma kolumnę Kod na początku — patrzymy na wiersz nagłówkowy
        // (nazwa "kod"/"code" w pierwszej kolumnie, albo po prostu 4+ kolumny w nagłówku)
        var header0 = rows[0] || [];
        var header0Cols = Array.isArray(header0) ? header0 : [header0];
        var header0First = (header0Cols[0] == null ? "" : header0Cols[0]).toString().trim().toLowerCase();
        var hasCodeCol = (header0First === "kod" || header0First === "code" || header0Cols.length >= 4);

        var parsed = [];
        rows.forEach(function (r) {
          var cols = Array.isArray(r) ? r : [r];
          var code, name, machineName, qtyRaw;
          if (hasCodeCol) {
            code = cols[0]; name = cols[1]; machineName = cols[2]; qtyRaw = cols[3];
          } else {
            code = ""; name = cols[0]; machineName = cols[1]; qtyRaw = cols[2];
          }
          code = clampCode(code);
          name = clampName(name);
          machineName = (machineName == null ? "" : machineName).toString().trim();
          qtyRaw = (qtyRaw == null ? "" : qtyRaw).toString().trim();
          if (!name) return;
          if (IMPORT_HEADER_WORDS_PRODUCTS.indexOf(name.toLowerCase()) !== -1) return;
          if (code && IMPORT_HEADER_WORDS_PRODUCTS.indexOf(code.toLowerCase()) !== -1 && IMPORT_HEADER_WORDS_PRODUCTS.indexOf(name.toLowerCase()) !== -1) return;
          parsed.push({ name: name, code: code, machineName: machineName, qty: parseFloat(qtyRaw.replace(",", ".")) });
        });

        if (!parsed.length) {
          btn.disabled = false;
          msgEl.textContent = "Nie znaleziono żadnych poprawnych wierszy (oczekiwany format: Produkt;Maszyna;Ilość maksymalna dzienna, opcjonalnie z kodem na początku).";
          msgEl.classList.add("show", "error");
          return;
        }

        // indeks istniejących produktów — po kodzie (jeśli jest) i po nazwie, oba wskazują to samo id
        var existingIndex = {};
        state.products.forEach(function (p) {
          if (p.code) existingIndex["code:" + p.code.trim().toLowerCase()] = p.id;
          existingIndex["name:" + p.name.trim().toLowerCase()] = p.id;
        });
        function keyFor(row) { return row.code ? "code:" + row.code.toLowerCase() : "name:" + row.name.toLowerCase(); }
        // dopasuj po kodzie ALBO po nazwie (kod może być podany dopiero teraz dla już istniejącego produktu)
        function findExistingId(row) {
          if (row.code && existingIndex["code:" + row.code.toLowerCase()]) return existingIndex["code:" + row.code.toLowerCase()];
          if (existingIndex["name:" + row.name.toLowerCase()]) return existingIndex["name:" + row.name.toLowerCase()];
          return null;
        }

        // 1) dopisz brakujące produkty
        var newRows = [], seenNewKeys = {};
        parsed.forEach(function (row) {
          if (findExistingId(row)) return;
          var k = keyFor(row);
          if (seenNewKeys[k]) return;
          seenNewKeys[k] = true;
          newRows.push(row);
        });
        var insertedCount = 0;
        var justInsertedIds = {};
        if (newRows.length) {
          var insRes = await sb.from("products").insert(newRows.map(function (row) { return { company_id: session.company.id, name: row.name, code: row.code || null }; })).select();
          if (insRes.error) {
            btn.disabled = false;
            msgEl.textContent = "Nie udało się dodać nowych produktów: " + insRes.error.message;
            msgEl.classList.add("show", "error");
            return;
          }
          insertedCount = newRows.length;
          (insRes.data || []).forEach(function (p) {
            justInsertedIds[p.id] = true;
            if (p.code) existingIndex["code:" + p.code.trim().toLowerCase()] = p.id;
            existingIndex["name:" + p.name.trim().toLowerCase()] = p.id;
          });
        }

        // 2) uzupełnij kod istniejącym (nie dopiero co dodanym) produktom, które dotąd go nie miały
        var codeById = {};
        state.products.forEach(function (p) { codeById[p.id] = p.code || ""; });
        var codeUpdates = [];
        parsed.forEach(function (row) {
          if (!row.code) return;
          var pid = findExistingId(row);
          if (!pid || justInsertedIds[pid]) return;
          if ((codeById[pid] || "") === "") { codeById[pid] = row.code; codeUpdates.push({ id: pid, code: row.code }); }
        });
        var codeErrorCount = 0;
        for (var c = 0; c < codeUpdates.length; c++) {
          var cRes = await sb.from("products").update({ code: codeUpdates[c].code }).eq("id", codeUpdates[c].id);
          if (cRes.error) codeErrorCount++;
        }

        // 3) dopasuj maszyny po nazwie i przelicz orientacyjny czas cyklu z ilości dziennej —
        // korzystając z Twoich realnych ustawień czasu zmiany (Ustawienia) i TPZ konkretnej maszyny (Maszyny),
        // a nie ze sztywnego założenia 8h
        var machinesByLower = {};
        state.machines.forEach(function (m) { machinesByLower[m.name.trim().toLowerCase()] = m.id; });

        var upserts = [], skippedMachine = 0, skippedQty = 0;
        parsed.forEach(function (row) {
          var pid = findExistingId(row);
          var mid = machinesByLower[row.machineName.toLowerCase()];
          if (!mid) { skippedMachine++; return; }
          if (!row.qty || row.qty <= 0) { skippedQty++; return; }
          var dailyMinutes = effectiveShiftMinutes(mid) * (state.settings.shiftsPerDay || 1);
          if (dailyMinutes <= 0) { skippedQty++; return; }
          upserts.push({ product_id: pid, machine_id: mid, ideal_cycle_sec: (dailyMinutes * 60) / row.qty });
        });

        var rateError = null;
        if (upserts.length) {
          var upRes = await sb.from("product_rates").upsert(upserts, { onConflict: "product_id,machine_id" });
          if (upRes.error) rateError = upRes.error;
        }

        btn.disabled = false;
        await loadCompanyData();
        renderAdmin(document.getElementById("adminRoot"));
        var freshMsg = document.getElementById("importProductsMsg");
        if (freshMsg) {
          if (rateError) {
            freshMsg.textContent = "Produkty dodane, ale zapisanie wydajności nie powiodło się: " + rateError.message;
            freshMsg.classList.add("show", "error");
          } else {
            var parts = [];
            if (insertedCount) parts.push("nowych produktów: " + insertedCount);
            if (codeUpdates.length) parts.push("uzupełnionych kodów: " + (codeUpdates.length - codeErrorCount));
            parts.push("zapisanych wydajności: " + upserts.length);
            if (skippedMachine) parts.push("pominięto, nieznana maszyna: " + skippedMachine);
            if (skippedQty) parts.push("pominięto, brak ilości: " + skippedQty);
            freshMsg.textContent = "Zaimportowano — " + parts.join(", ") + ".";
            freshMsg.classList.add("show");
            setTimeout(function () { freshMsg.classList.remove("show"); }, 6000);
          }
        }
      });
    });
  }

  function renderAdmin(root) {
    root.innerHTML = bannerHtml() + adminTabsHtml() + '<div id="adminTabContent">' + adminTabContentHtml() + '</div>';
    if (adminTab === "overview") mountSparklines();

    root.querySelectorAll("[data-admin-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        adminTab = btn.getAttribute("data-admin-tab");
        historyEditingId = null;
        // porzuć ewentualny otwarty szkic receptury przy zmianie zakładki — inaczej
        // mógłby przeżyć w pamięci usunięcie surowca/maszyny gdzie indziej i przy
        // zapisie po powrocie podstawić stary wiersz pod inny (losowy) surowiec/maszynę
        recipeEditingProductId = null;
        recipeDraftMaterials = [];
        recipeDraftSteps = [];
        renderAdmin(root);
      });
    });

    if (adminTab === "overview") {
      wirePeriodPicker("manager", managerPeriod, function () { renderAdmin(root); });

    if (adminTab === "analytics") {
      wirePeriodPicker("manager", managerPeriod, function () { renderAdmin(root); });

    if (adminTab === "report") {

      // magazynowego. Sumujemy ilości per surowiec/produkt (na wypadek kilku pozycji tego
      // samego towaru na jednym dokumencie), liczymy nowy stan bezwzględny (obecny ± ilość) i
      // zapisujemy go przez upsert — dokładnie tak, jak przy zamykaniu inwentaryzacji. Ujemny
      // wynik NIE blokuje zapisu (użytkownik świadomie na to się zgodził) — tylko ostrzegamy w
      // oknie potwierdzenia przed zapisaniem czegokolwiek.
      var confirmDocBtn = document.getElementById("confirmDocBtn");
      if (confirmDocBtn) confirmDocBtn.addEventListener("click", async function () {
        var doc = warehouseDocumentById(activeDocumentId);
        if (!doc) return;
        var items = warehouseDocumentItemsFor(doc.id);
        var confirmMsgEl = document.getElementById("confirmDocMsg");
        if (!items.length) {
          if (confirmMsgEl) { confirmMsgEl.textContent = "Dodaj przynajmniej jedną pozycję przed zatwierdzeniem."; confirmMsgEl.classList.add("show", "error"); }
          return;
        }
        var isMM = doc.docType === "mm";
        var isPZ = doc.docType === "pz";
        var sign = isPZ ? 1 : -1; // PZ dodaje do stanu, WZ/RW/MM (magazyn źródłowy) odejmują
        var matAgg = {}, prodAgg = {}, matName = {}, prodName = {}, skipped = 0;
        items.forEach(function (i) {
          if (i.materialId) {
            matAgg[i.materialId] = (matAgg[i.materialId] || 0) + i.qty;
            matName[i.materialId] = (i.code ? i.code + " — " : "") + i.name;
          } else if (i.productId) {
            prodAgg[i.productId] = (prodAgg[i.productId] || 0) + i.qty;
            prodName[i.productId] = (i.code ? i.code + " — " : "") + i.name;
          } else {
            skipped++;
          }
        });
        var nowIso = new Date().toISOString();
        var negWarnings = [];
        var matUpdates = [], prodUpdates = [];
        Object.keys(matAgg).forEach(function (materialId) {
          var cur = materialStockQty(materialId, [doc.warehouseId]) || 0;
          var next = cur + sign * matAgg[materialId];
          if (next < 0) negWarnings.push(matName[materialId] + " (magazyn źródłowy): " + fmtQty(cur) + " → " + fmtQty(next));
          matUpdates.push({ material_id: materialId, warehouse_id: doc.warehouseId, qty: next, updated_at: nowIso });
          if (isMM) {
            var curT = materialStockQty(materialId, [doc.targetWarehouseId]) || 0;
            matUpdates.push({ material_id: materialId, warehouse_id: doc.targetWarehouseId, qty: curT + matAgg[materialId], updated_at: nowIso });
          }
        });
        Object.keys(prodAgg).forEach(function (productId) {
          var cur = productStockQty(productId, [doc.warehouseId]) || 0;
          var next = cur + sign * prodAgg[productId];
          if (next < 0) negWarnings.push(prodName[productId] + " (magazyn źródłowy): " + fmtQty(cur) + " → " + fmtQty(next));
          prodUpdates.push({ product_id: productId, warehouse_id: doc.warehouseId, qty: next, updated_at: nowIso });
          if (isMM) {
            var curT = productStockQty(productId, [doc.targetWarehouseId]) || 0;
            prodUpdates.push({ product_id: productId, warehouse_id: doc.targetWarehouseId, qty: curT + prodAgg[productId], updated_at: nowIso });
          }
        });

        var confirmText = "Zatwierdzić ten dokument " + DOC_TYPE_META[doc.docType].label + "? Zmiana stanu magazynowego jest trwała — dokumentu nie będzie już można edytować ani usunąć.";
        if (negWarnings.length) confirmText += "\n\nUwaga — poniższe pozycje spadną poniżej zera:\n" + negWarnings.join("\n");
        if (skipped) confirmText += "\n\n" + skipped + " pozycji nie ma już powiązanego towaru w bazie — zostaną pominięte przy aktualizacji stanu.";
        if (!confirm(confirmText)) return;

        confirmDocBtn.disabled = true;
        var hadError = false;
        if (matUpdates.length) {
          var mres = await sb.from("material_stock").upsert(matUpdates, { onConflict: "material_id,warehouse_id" });
          if (mres.error) hadError = true;
        }
        if (prodUpdates.length) {
          var pres = await sb.from("product_stock").upsert(prodUpdates, { onConflict: "product_id,warehouse_id" });
          if (pres.error) hadError = true;
        }
        await sb.from("warehouse_documents").update({ confirmed_at: nowIso }).eq("id", doc.id);
        confirmDocBtn.disabled = false;
        await loadCompanyData();
        renderAdmin(root);
        if (hadError) alert("Zatwierdzono dokument, ale część aktualizacji stanu magazynowego nie zapisała się poprawnie.");

      importProdStockMsg.classList.remove("show", "error");

      if (!whId) { importProdStockMsg.textContent = "Wybierz magazyn, do którego wczytujesz stan."; importProdStockMsg.classList.add("show", "error"); return; }
      if (!file) { importProdStockMsg.textContent = "Najpierw wybierz plik."; importProdStockMsg.classList.add("show", "error"); return; }
      importProdStockBtn.disabled = true;
      parseImportFile(file, async function (rows, err) {
        if (err) { importProdStockBtn.disabled = false; importProdStockMsg.textContent = "Błąd odczytu pliku: " + err.message; importProdStockMsg.classList.add("show", "error"); return; }
        var byCode = {}, byName = {};
        state.products.forEach(function (p) {
          if (p.code) byCode[p.code.trim().toLowerCase()] = p;
          byName[p.name.trim().toLowerCase()] = p;
        });
        var STOCK_HEADER_WORDS = ["kod", "code", "nazwa", "name", "produkt", "ilość", "ilosc", "stan", "qty"];
        var updates = [], seen = {}, unmatched = 0, badQty = 0;
        rows.forEach(function (r) {
          var cols = Array.isArray(r) ? r : [r];
          var key = (cols[0] == null ? "" : cols[0]).toString().trim();
          var qtyRaw = (cols[1] == null ? "" : cols[1]).toString().trim();
          if (!key) return;
          var low = key.toLowerCase();
          if (STOCK_HEADER_WORDS.indexOf(low) !== -1) return;
          var p = byCode[low] || byName[low];
          if (!p) { unmatched++; return; }
          var qty = parseFloat(qtyRaw.replace(",", "."));
          if (isNaN(qty) || qty < 0) { badQty++; return; }
          if (seen[p.id]) return;
          seen[p.id] = true;
          updates.push({ product_id: p.id, warehouse_id: whId, qty: qty, updated_at: new Date().toISOString() });
        });
        if (!updates.length) {
          importProdStockBtn.disabled = false;
          importProdStockMsg.textContent = "Nie znaleziono żadnych rozpoznanych produktów w pliku" + (unmatched ? " (nierozpoznanych: " + unmatched + " — dodaj je najpierw powyżej)" : "") + ".";
          importProdStockMsg.classList.add("show", "error");
          return;
        }
        var sres = await sb.from("product_stock").upsert(updates, { onConflict: "product_id,warehouse_id" });
        var errCount = sres.error ? updates.length : 0;
        importProdStockBtn.disabled = false;
        await loadCompanyData();
        renderAdmin(root);
        var freshMsg2 = document.getElementById("importProdStockMsg");
        if (freshMsg2) {
          var parts2 = ["zaktualizowano: " + (updates.length - errCount)];
          if (unmatched) parts2.push("nierozpoznanych: " + unmatched);
          if (badQty) parts2.push("bez poprawnej ilości: " + badQty);
          if (errCount) parts2.push("błędów zapisu: " + errCount);
          freshMsg2.textContent = "Wczytano — " + parts2.join(", ") + ".";
          freshMsg2.classList.add("show");

    var hintSlot = document.getElementById("rateHintSlot");
    // zlecenie z kolejki (Panel kierownika → Planowanie), z którego operator kliknął "Rozpocznij"
    // — zapamiętane tylko, dopóki maszyna/produkt się nie zmienią na coś innego (patrz niżej),
    // żeby przy zapisie zmiany dopiąć shifts.order_id i policzyć postęp zlecenia
    var selectedOrderId = null;

    function renderOrderQueue() {
      var box = document.getElementById("orderQueueBox");
      if (!box) return;
      var machineId = machSel.value;
      var queue = ordersForMachine(machineId).filter(function (o) { return !orderDone(o); });
      if (!queue.length) { box.innerHTML = ""; return; }
      box.innerHTML = '<div class="target-banner" style="background:var(--surface-2);border-color:var(--border);">' +
        '<b style="font-family:inherit;font-size:13px;">Kolejka na tej maszynie</b>' +
        '<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">' +
        queue.map(function (o) {
          var produced = producedForOrder(o.id);
          var active = selectedOrderId === o.id;
          var overdue = orderOverdue(o);
          var dueTxt = (o.priority ? ' · pilne' : '') + (o.dueDate ? (' · termin ' + fmtDate(o.dueDate) + (overdue ? ' (przeterminowane)' : '')) : '');
          var chainTxt = "";
          if (o.chainId && o.chainTotal > 1) {
            chainTxt = ' · etap ' + o.chainSeq + '/' + o.chainTotal;
            var prevO = prevChainOrder(o);
            if (prevO) {
              var prevProduced = producedForOrder(prevO.id);
              chainTxt += prevO.status === "cancelled"
                ? ' (poprzedni etap anulowany)'
                : ' (poprzedni etap na ' + escAttr(machineName(prevO.machineId)) + ': ' + prevProduced + '/' + prevO.targetQty + ' szt. — informacyjnie)';
            }
          }
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">' +
            '<span>' + escAttr(productName(o.productId)) + ' — ' + produced + ' z ' + o.targetQty + ' szt.' + dueTxt + chainTxt + '</span>' +
            '<button type="button" class="small' + (active ? ' primary' : '') + '" data-start-order="' + o.id + '">' + (active ? 'Wybrano ✓' : 'Rozpocznij') + '</button>' +
            '</div>';
        }).join("") +
        '</div></div>';
      box.querySelectorAll("[data-start-order]").forEach(function (btn) {
        btn.addEventListener("click", function () { startFromOrder(btn.getAttribute("data-start-order")); });
      });
    }
    // wypełnia formularz maszyną/produktem ze zlecenia jednym kliknięciem — woła te same
    // funkcje co ręczna zmiana pól (bez "change" na machSel/prodSel, więc listenery niżej,
    // które czyszczą selectedOrderId przy RĘCZNEJ zmianie, tu się nie odpalają)
    function startFromOrder(orderId) {
      var order = orderById(orderId);
      if (!order) return;
      machSel.value = order.machineId;
      refreshProducts();
      suggestPlanned();
      prodSel.value = order.productId;
      updateCycle();
      selectedOrderId = orderId;
      renderOrderQueue();
    }

    function refreshProducts() {
      var machineId = machSel.value;
      var matching = productsForMachine(machineId);
      if (matching.length) {
        prodSel.disabled = false;
        prodSel.innerHTML = matching.map(function (p) { return '<option value="' + p.id + '">' + (p.code ? p.code + " — " + p.name : p.name) + '</option>'; }).join("");
        hintSlot.innerHTML = "";
        updateCycle();
      } else {
        prodSel.innerHTML = '<option value="">— brak zdefiniowanych produktów —</option>';
        cycleAuto.value = "";
        hintSlot.innerHTML = '<div class="field" style="max-width:280px;"><label for="fCycleManual">Czas cyklu ręcznie (s/szt.)</label><input id="fCycleManual" type="number" min="0.1" step="0.1"><span class="hint warn">Administrator nie ustawił jeszcze wydajności produktów dla tej maszyny.</span></div>';
        var manualInp = document.getElementById("fCycleManual");
        if (manualInp) manualInp.addEventListener("input", updateTarget);
      }
      updateTarget();
    }
    function updateCycle() {
      var machineId = machSel.value, productId = prodSel.value;
      var rate = state.productRates[productId] ? state.productRates[productId][machineId] : null;
      cycleAuto.value = rate ? (rate + " s/szt.") : "";
      updateTarget();
    }
    function suggestPlanned() {
      var machineId = machSel.value;
      var m = state.machines.filter(function (x) { return x.id === machineId; })[0];
      var suggested = effectiveShiftMinutes(machineId);
      var plannedInput = document.getElementById("fPlanned");
      var hintEl = document.getElementById("plannedHint");
      var unlockBtn = document.getElementById("unlockPlannedBtn");
      if (plannedInput) { plannedInput.value = suggested; plannedInput.disabled = true; }
      if (unlockBtn) { unlockBtn.disabled = false; unlockBtn.textContent = "Odblokuj"; }
      if (hintEl) hintEl.textContent = "Wyliczone: " + state.settings.shiftLengthMin + " − przerwa " + state.settings.breakMin + " − nieefektywny " + state.settings.ineffectiveMin + " − TPZ " + (m ? (m.tpzMin || 0) : 0) + " = " + suggested + " min. Zwykły wpis go nie zmienia — poprawić ręcznie może administrator przyciskiem obok.";
      updateTarget();
    }
    // pokazuje operatorowi, ile sztuk POWINIEN zrobić w tej zmianie — żeby wiedział to
    // od razu, a nie dopiero po zapisaniu. Orientacyjnie: norma × czas planowany, jeszcze
    // bez odjęcia przestoju (bo ten dopiero się zdarzy) — ostateczna ocena normy przeliczy
    // się po zapisaniu zmiany, z uwzględnieniem zatwierdzonego przestoju.
    function updateTarget() {
      var box = document.getElementById("targetBox");
      if (!box) return;
      var machineId = machSel.value, productId = prodSel.value;
      var manualCycle = document.getElementById("fCycleManual");
      var idealCycleSec = productId ? (state.productRates[productId] ? state.productRates[productId][machineId] : null) : (manualCycle ? parseFloat(manualCycle.value) : null);
      var plannedMin = parseFloat((document.getElementById("fPlanned") || {}).value) || 0;
      if (idealCycleSec && plannedMin > 0) {
        var qty = Math.floor((plannedMin * 60) / idealCycleSec);
        box.className = "target-banner";
        box.innerHTML = "Cel na tę zmianę: <b>" + qty + " szt.</b> <span class=\"hint\">(norma " + idealCycleSec + " s/szt. przy " + plannedMin + " min czasu planowanego — orientacyjnie, bo ostateczna ocena uwzględni jeszcze zatwierdzony przestój)</span>";
      } else {
        box.className = "target-banner empty";
        box.textContent = "Cel pojawi się po wybraniu maszyny i produktu.";
      }
    }
    machSel.addEventListener("change", refreshProducts);
    machSel.addEventListener("change", suggestPlanned);
    // RĘCZNA zmiana maszyny/produktu (nie ta z startFromOrder, patrz komentarz tam) odczepia
    // wybrane zlecenie — inaczej dałoby się zapisać zmianę z order_id niepasującym do tego,
    // co faktycznie wpisano
    machSel.addEventListener("change", function () { selectedOrderId = null; renderOrderQueue(); });
    prodSel.addEventListener("change", function () {
      if (selectedOrderId) {
        var order = orderById(selectedOrderId);
        if (!order || order.productId !== prodSel.value) selectedOrderId = null;
      }
      renderOrderQueue();
    });
    var fPlannedInput = document.getElementById("fPlanned");
    if (fPlannedInput) fPlannedInput.addEventListener("input", updateTarget);
    prodSel.addEventListener("change", updateCycle);
    refreshProducts();
    suggestPlanned();
    renderOrderQueue();

    var unlockPlannedBtn = document.getElementById("unlockPlannedBtn");
    if (unlockPlannedBtn) unlockPlannedBtn.addEventListener("click", function () {
      var plannedInput = document.getElementById("fPlanned");
      plannedInput.disabled = false;
      plannedInput.focus();
      unlockPlannedBtn.disabled = true;
      unlockPlannedBtn.textContent = "Odblokowane";
    });

    function downtimeReasonOptionsHtml() {
      if (!state.downtimeReasons.length) return '<option value="">— brak powodów, dodaj je w Panelu kierownika → Przestoje —</option>';
      return state.downtimeReasons.map(function (r) { return '<option value="' + r.id + '">' + escAttr(r.name) + '</option>'; }).join("");
    }
    function addDowntimeRow() {
      var container = document.getElementById("downtimeRows");
      if (!container) return;
      var rowEl = document.createElement("div");
      rowEl.className = "downtime-row";
      rowEl.innerHTML =
        '<select data-dt-reason>' + downtimeReasonOptionsHtml() + '</select>' +
        '<input type="number" min="0" step="1" placeholder="minuty" data-dt-minutes>' +
        '<input type="text" placeholder="notatka (opcjonalnie)" data-dt-note maxlength="250">' +
        '<button type="button" class="small" data-dt-remove aria-label="Usuń">✕</button>';
      container.appendChild(rowEl);
      rowEl.querySelector("[data-dt-remove]").addEventListener("click", function () { rowEl.remove(); });
    }
    var addDowntimeRowBtn = document.getElementById("addDowntimeRowBtn");
    if (addDowntimeRowBtn) addDowntimeRowBtn.addEventListener("click", addDowntimeRow);

    // zabezpieczenie przed podwójnym wpisem: jeśli ten sam operator już ma zapisaną zmianę
    // dla tej samej maszyny, produktu, daty i numeru zmiany, ostrzegamy zamiast od razu
    // zapisywać — pierwsze kliknięcie "Zapisz zmianę" pokazuje ostrzeżenie i zamienia
    // przycisk na "Zapisz mimo to", dopiero drugie kliknięcie faktycznie zapisuje. Zmiana
    // któregokolwiek z pól, które współtworzą to rozpoznanie, kasuje potwierdzenie —
    // żeby nie "przykleiło się" przypadkiem do innej kombinacji.
    var duplicateConfirmed = false;
    function resetDuplicateGuard() {
      duplicateConfirmed = false;
      var btn = document.getElementById("opSubmitBtn");
      if (btn) btn.textContent = "Zapisz zmianę";
      var opMsg = document.getElementById("opFormMsg");
      if (opMsg) opMsg.classList.remove("show", "warn");
    }
    ["fMachine", "fProduct", "fDate", "fShiftNum", "fOperator"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener("change", resetDuplicateGuard);
    });

    document.getElementById("opForm").addEventListener("submit", async function (evt) {
      evt.preventDefault();
      var opMsg = document.getElementById("opFormMsg");
      opMsg.classList.remove("show", "error", "warn");

      var operatorId = document.getElementById("fOperator").value;
      var enteredPin = document.getElementById("fPin").value.trim();
      var chosenOp = state.operators.filter(function (o) { return o.id === operatorId; })[0];
      if (!chosenOp || enteredPin !== chosenOp.pin) {
        opMsg.textContent = "Błędny PIN dla wybranej osoby.";
        opMsg.classList.add("show", "error");
        document.getElementById("fPin").focus();
        return;
      }

      var machineId = machSel.value, productId = prodSel.value || null;
      var manualCycle = document.getElementById("fCycleManual");
      var idealCycleSec = productId ? (state.productRates[productId] ? state.productRates[productId][machineId] : null) : (manualCycle ? parseFloat(manualCycle.value) : null);
      if (!idealCycleSec) { (manualCycle || cycleAuto).focus(); return; }

      var shiftDateVal = document.getElementById("fDate").value || new Date().toISOString().slice(0, 10);
      var shiftNumVal = parseInt(document.getElementById("fShiftNum").value, 10);
      var isDuplicate = state.shifts.some(function (s) {
        return s.machineId === machineId && s.operatorId === operatorId && s.productId === productId &&
          s.date === shiftDateVal && s.shiftNumber === shiftNumVal;
      });
      if (isDuplicate && !duplicateConfirmed) {
        duplicateConfirmed = true;
        opMsg.textContent = "Masz już zapisany wpis dla tej maszyny, produktu, daty i numeru zmiany — jeśli to nie pomyłka, kliknij jeszcze raz „Zapisz mimo to”.";
        opMsg.classList.add("show", "warn");
        var submitBtnWarn = document.getElementById("opSubmitBtn");
        if (submitBtnWarn) submitBtnWarn.textContent = "Zapisz mimo to";
        return;
      }

      var downtimeItems = [], totalDowntimeMin = 0;
      document.querySelectorAll(".downtime-row").forEach(function (rowEl) {
        var minInp = rowEl.querySelector("[data-dt-minutes]");
        var mins = parseFloat(minInp ? minInp.value : "");
        if (!mins || mins <= 0) return;
        var reasonSel = rowEl.querySelector("[data-dt-reason]");
        var noteInp = rowEl.querySelector("[data-dt-note]");
        downtimeItems.push({ reason_id: (reasonSel && reasonSel.value) || null, minutes: mins, note: noteInp ? (noteInp.value.trim().slice(0, 250) || null) : null });
        totalDowntimeMin += mins;
      });

      // powiąż ze zleceniem tylko jeśli maszyna/produkt w formularzu wciąż pasują do tego, co
      // wybrano przyciskiem "Rozpocznij" — zabezpieczenie na wypadek, gdyby coś ręcznie
      // przestawiono, a listenery czyszczące selectedOrderId (patrz wyżej) czegoś nie złapały
      var linkedOrder = selectedOrderId ? orderById(selectedOrderId) : null;
      if (linkedOrder && (linkedOrder.machineId !== machineId || linkedOrder.productId !== productId)) linkedOrder = null;
      // ZABEZPIECZENIE: jeśli operator nie kliknął "Rozpocznij" (albo w ogóle nie zobaczył
      // kolejki, bo np. wszedł od razu z klawiatury), ale to, co i tak wpisał, pasuje maszyną
      // i produktem do zlecenia czekającego w tej kolejce — dolicz automatycznie. Inaczej
      // produkcja "znika" z planowania tylko dlatego, że ktoś zapomniał kliknąć przycisk, mimo
      // że realnie robił dokładnie to zlecenie. Przy kilku pasujących zleceniach na raz liczy
      // się to najwcześniejsze w kolejce (ordersForMachine sortuje po position) — to samo,
      // które i tak pokazałoby się na górze listy z przyciskiem "Rozpocznij".
      if (!linkedOrder) {
        var autoMatches = ordersForMachine(machineId).filter(function (o) { return o.productId === productId && !orderDone(o); });
        if (autoMatches.length) linkedOrder = autoMatches[0];
      }

      var row = {
        company_id: session.company.id,
        machine_id: machineId,
        operator_id: operatorId,
        shift_number: shiftNumVal,
        product_id: productId,
        shift_date: shiftDateVal,
        planned_min: parseFloat(document.getElementById("fPlanned").value) || 0,
        downtime_min: totalDowntimeMin,
        ideal_cycle_sec: idealCycleSec,
        good_count: parseFloat(document.getElementById("fGood").value) || 0,
        bad_count: parseFloat(document.getElementById("fBad").value) || 0,
        order_id: linkedOrder ? linkedOrder.id : null
      };
      var submitBtn = document.getElementById("opSubmitBtn");
      submitBtn.disabled = true;
      var res = await sb.from("shifts").insert(row).select().single();

      if (res.error || !res.data) {
        submitBtn.disabled = false;
        var msg = document.getElementById("opFormMsg");
        if (msg) { msg.textContent = "Nie udało się zapisać: " + (res.error ? res.error.message : "nieznany błąd"); msg.classList.add("show", "error"); }
        return;
      }

      var newShiftId = res.data.id;
      if (downtimeItems.length) {
        var dtRes = await sb.from("shift_downtimes").insert(downtimeItems.map(function (it) {
          return { shift_id: newShiftId, company_id: session.company.id, reason_id: it.reason_id, minutes: it.minutes, note: it.note, status: "pending" };
        }));
        if (dtRes.error) { bannerMsg = "Zmiana zapisana, ale nie udało się zapisać szczegółów przestoju: " + dtRes.error.message; }
      }
      submitBtn.disabled = false;

      await loadCompanyData();
      var shiftForCalc = { id: newShiftId, plannedMin: row.planned_min, downtimeMin: row.downtime_min, idealCycleSec: row.ideal_cycle_sec, good: row.good_count, bad: row.bad_count };
      var m = calc(shiftForCalc); var t = tier(m.oee);
      renderOperator(root); // odśwież formularz (pusty, gotowy na kolejny wpis) PRZED wypełnieniem podsumowania
      document.getElementById("opFeedbackOee").textContent = fmtPct(m.oee) + " OEE";
      document.getElementById("opFeedbackOee").style.color = "var(--status-" + t.key + ")";
      var noteText = "— " + t.label + ", zapisano dla " + machineName(machineId);
      if (m.expectedQty > 0) noteText += ". Norma: " + m.produced + " z " + m.expectedQty + " szt. — " + (m.normMet ? "wykonana" : "niewykonana") + ".";
      if (linkedOrder) noteText += " Zlecenie „" + productName(linkedOrder.productId) + "”: " + producedForOrder(linkedOrder.id) + " z " + linkedOrder.targetQty + " szt.";
      if (totalDowntimeMin > 0) noteText += " Zgłoszony przestój (" + totalDowntimeMin + " min) czeka na zatwierdzenie administratora — do tego czasu nie obniża wyniku OEE, a ocena normy przeliczy się ponownie po decyzji.";
      document.getElementById("opFeedbackNote").textContent = noteText;
      document.getElementById("opFeedback").classList.add("show");
    });
  }

  /* =====================================================================
     POPRAWIANIE I ANULOWANIE ZMIAN — współdzielone między samodzielną
     poprawką operatora (Moje wyniki, w oknie tego samego dnia) a poprawką
     kierownika (Historia, bez ograniczenia czasowego). Patrz też
     isActiveShift/selfEditWindowOpen/shiftSnapshot/insertShiftEdit wyżej.
     ===================================================================== */

  // po zmianie maszyny w formularzu poprawki odśwież listę produktów do tych, które mają
  // ustawioną wydajność na NOWO wybranej maszynie — inaczej dałoby się zapisać nieistniejącą
  // w słowniku parę maszyna+produkt (tak samo jak refreshProducts() przy wpisie zmiany)
  function wireShiftEditMachineProductSync(prefix) {
    var machSel = document.getElementById(prefix + "Machine");
    var prodSel = document.getElementById(prefix + "Product");
    if (!machSel || !prodSel) return;
    machSel.addEventListener("change", function () {
      var machineId = machSel.value;
      var matching = state.products.filter(function (p) { return state.productRates[p.id] && state.productRates[p.id][machineId] != null; });
      prodSel.innerHTML = '<option value="">— brak —</option>' + matching.map(function (p) {
        return '<option value="' + p.id + '">' + escAttr(p.code ? p.code + " — " + p.name : p.name) + '</option>';
      }).join("");
    });
  }

  // pola formularza poprawki — te same co przy wpisie zmiany, ale bez blokad/podpowiedzi
  // (to świadoma poprawka, nie pierwszy wpis). includeOperator: tylko kierownik może
  // przepisać zmianę na innego operatora — sam operator poprawia wyłącznie swój wpis.
  function shiftEditFieldsHtml(s, prefix, includeOperator) {
    var machOpts = state.machines.map(function (m) { return '<option value="' + m.id + '"' + (m.id === s.machineId ? " selected" : "") + '>' + escAttr(m.name) + '</option>'; }).join("");
    var matching = state.products.filter(function (p) { return state.productRates[p.id] && state.productRates[p.id][s.machineId] != null; });
    var prodList = matching.slice();
    if (s.productId && !prodList.some(function (p) { return p.id === s.productId; })) {
      var cur = state.products.filter(function (p) { return p.id === s.productId; })[0];
      if (cur) prodList.unshift(cur);
    }
    var prodOpts = '<option value="">— brak —</option>' + prodList.map(function (p) {
      return '<option value="' + p.id + '"' + (p.id === s.productId ? " selected" : "") + '>' + escAttr(p.code ? p.code + " — " + p.name : p.name) + '</option>';
    }).join("");
    var opOpts = includeOperator ? state.operators.map(function (o) {
      return '<option value="' + o.id + '"' + (o.id === s.operatorId ? " selected" : "") + '>' + escAttr(o.name) + '</option>';
    }).join("") : "";
    return '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;">' +
      (includeOperator ? '<div class="field" style="width:170px;"><label for="' + prefix + 'Operator">Operator</label><select id="' + prefix + 'Operator">' + opOpts + '</select></div>' : '') +
      '<div class="field" style="width:120px;"><label for="' + prefix + 'ShiftNum">Zmiana</label><select id="' + prefix + 'ShiftNum">' + shiftOptionsHtml(state.settings.shiftsPerDay, s.shiftNumber) + '</select></div>' +
      '<div class="field" style="width:170px;"><label for="' + prefix + 'Machine">Maszyna</label><select id="' + prefix + 'Machine">' + machOpts + '</select></div>' +
      '<div class="field" style="width:150px;"><label for="' + prefix + 'Date">Data</label><input id="' + prefix + 'Date" type="date" value="' + s.date + '"></div>' +
      '<div class="field" style="width:200px;"><label for="' + prefix + 'Product">Produkt</label><select id="' + prefix + 'Product">' + prodOpts + '</select></div>' +
      '<div class="field" style="width:150px;"><label for="' + prefix + 'Planned">Czas planowany (min)</label><input id="' + prefix + 'Planned" type="number" min="1" step="1" value="' + s.plannedMin + '"></div>' +
      '<div class="field" style="width:120px;"><label for="' + prefix + 'Good">Sztuki dobre</label><input id="' + prefix + 'Good" type="number" min="0" step="1" value="' + s.good + '"></div>' +
      '<div class="field" style="width:120px;"><label for="' + prefix + 'Bad">Sztuki wadliwe</label><input id="' + prefix + 'Bad" type="number" min="0" step="1" value="' + s.bad + '"></div>' +
      '<div class="field" style="width:100%;"><label for="' + prefix + 'Reason">Powód poprawki' + (includeOperator ? '' : ' (opcjonalnie)') + '</label><input id="' + prefix + 'Reason" type="text" maxlength="200" placeholder="np. pomyłka przy wpisywaniu ilości"></div>' +
      '</div>';
  }

  // czyta wartości z formularza poprawki (wypełnionego przez shiftEditFieldsHtml), zapisuje
  // zmianę + wpis w shift_edits, i zwraca {ok, reasonMissing} — UI decyduje, co dalej.
  async function submitShiftEdit(s, prefix, editedAs, includeOperator) {
    var machineId = document.getElementById(prefix + "Machine").value;
    var productId = document.getElementById(prefix + "Product").value || null;
    // norma (s/szt.) zależy od pary maszyna+produkt — jeśli poprawka zmienia maszynę albo
    // produkt, trzeba ją przeliczyć tak samo jak przy pierwszym wpisie, inaczej OEE/norma
    // liczyłyby się dalej starą, już nieaktualną wartością. Gdy dla nowej pary nie ma
    // ustawionej wydajności w słowniku, zostaw poprzednią wartość (lepsze niż wyzerowanie).
    var rate = productId && state.productRates[productId] ? state.productRates[productId][machineId] : null;
    var idealCycleSec = rate != null ? rate : s.idealCycleSec;

    var patch = {
      machine_id: machineId,
      shift_number: parseInt(document.getElementById(prefix + "ShiftNum").value, 10) || 1,
      product_id: productId,
      shift_date: document.getElementById(prefix + "Date").value || s.date,
      planned_min: parseFloat(document.getElementById(prefix + "Planned").value) || s.plannedMin,
      ideal_cycle_sec: idealCycleSec,
      good_count: parseFloat(document.getElementById(prefix + "Good").value) || 0,
      bad_count: parseFloat(document.getElementById(prefix + "Bad").value) || 0
    };
    if (includeOperator) patch.operator_id = document.getElementById(prefix + "Operator").value;
    var reasonInp = document.getElementById(prefix + "Reason");
    var reason = reasonInp ? reasonInp.value.trim() : "";
    if (editedAs === "kierownik" && !reason) return { ok: false, reasonMissing: true };

    var newSnap = {
      machineId: patch.machine_id, operatorId: includeOperator ? patch.operator_id : s.operatorId,
      shiftNumber: patch.shift_number, productId: patch.product_id, date: patch.shift_date,
      plannedMin: patch.planned_min, good: patch.good_count, bad: patch.bad_count, status: s.status,
      idealCycleSec: patch.ideal_cycle_sec
    };
    var res = await sb.from("shifts").update(patch).eq("id", s.id);
    if (res.error) { bannerMsg = "Nie udało się zapisać poprawki: " + res.error.message; return { ok: false }; }
    await insertShiftEdit(s.id, "edit", editedAs, reason, shiftSnapshot(s), newSnap);
    await loadCompanyData();
    return { ok: true };
  }

  async function submitShiftCancel(s, editedAs, reason) {
    var newSnap = Object.assign({}, shiftSnapshot(s), { status: "cancelled" });
    var res = await sb.from("shifts").update({ status: "cancelled" }).eq("id", s.id);
    if (res.error) { bannerMsg = "Nie udało się anulować zmiany: " + res.error.message; return false; }
    await insertShiftEdit(s.id, "cancel", editedAs, reason, shiftSnapshot(s), newSnap);
    await loadCompanyData();
    return true;
  }

  async function submitShiftRestore(s) {
    var newSnap = Object.assign({}, shiftSnapshot(s), { status: "active" });
    var res = await sb.from("shifts").update({ status: "active" }).eq("id", s.id);
    if (res.error) { bannerMsg = "Nie udało się przywrócić zmiany: " + res.error.message; return false; }
    await insertShiftEdit(s.id, "restore", "kierownik", null, shiftSnapshot(s), newSnap);
    await loadCompanyData();
    return true;
  }

  /* =====================================================================
     WIDOK "MOJE WYNIKI" — operator sam sprawdza swoją historię i OEE,
     bez wchodzenia do panelu administratora. Jak przy wpisie zmiany,
     wybiera siebie z listy i potwierdza PIN-em (to nie jest prawdziwe
     logowanie — chroni tylko przed przypadkowym podejrzeniem cudzych
     wyników na współdzielonym urządzeniu). PIN trzeba wpisać ponownie
     za każdym wejściem na ten ekran.
     ===================================================================== */

  function resultDetailRowHtml(s, m) {
    var items = state.downtimesByShift[s.id] || [];
    var dtHtml = items.length
      ? items.map(function (d) {
          var st = d.status === "pending" ? "oczekuje" : (d.status === "approved" ? "zatwierdzony" : "odrzucony");
          return '<div class="review-item"><div class="meta"><b>' + escAttr(reasonName(d.reasonId)) + '</b> — ' + d.minutes + ' min' +
            (d.note ? ' · „' + escAttr(d.note) + '"' : '') + '</div><span class="status-tag ' + d.status + '">' + st + '</span></div>';
        }).join("")
      : '<div class="empty-hint">Brak zgłoszonych przestojów w tej zmianie.</div>';

    var cancelledNote = !isActiveShift(s)
      ? '<div class="readonly-banner" style="margin-bottom:10px;"><b>Anulowana.</b> Ta zmiana nie liczy się do OEE, normy ani podsumowań.</div>'
      : '';

    var editingHere = resultsEditingId === s.id;
    var actionsHtml = "";
    if (isActiveShift(s) && !editingHere) {
      if (selfEditWindowOpen(s)) {
        actionsHtml = '<div class="form-actions" style="margin-top:12px;">' +
          '<button type="button" class="ghost small" data-self-edit="' + s.id + '">Popraw</button>' +
          '<button type="button" class="ghost small" data-self-cancel="' + s.id + '">Anuluj zmianę</button>' +
          '<span class="hint">Możesz poprawić albo anulować własny wpis tylko dziś — potem tylko kierownik, w Historii.</span>' +
          '</div>';
      } else {
        actionsHtml = '<div class="hint" style="margin-top:12px;">Okno samodzielnej poprawki (tylko dzień wpisu) już minęło — o zmianę poproś kierownika w Historii.</div>';
      }
    }

    var bodyHtml = editingHere
      ? shiftEditFieldsHtml(s, "selfEdit", false) +
        '<div class="form-actions" style="margin-top:10px;">' +
        '<button type="button" class="primary small" data-self-edit-save="' + s.id + '">Zapisz poprawkę</button>' +
        '<button type="button" class="ghost small" data-self-edit-discard="' + s.id + '">Anuluj poprawianie</button>' +
        '<span class="form-msg" id="selfEditMsg">Podaj powód poprawki.</span>' +
        '</div>'
      : '<div class="apq-rows" style="max-width:420px;">' +
        apqRow("Dostępność", m.availability, "var(--chart-avail)") + apqRow("Wydajność", m.performance, "var(--chart-perf)") + apqRow("Jakość", m.quality, "var(--chart-qual)") +
        '</div>' +
        '<div class="detail-kv">' +
        '<div><span class="k">Zmiana</span><span class="v">' + (s.shiftNumber || "—") + '</span></div>' +
        '<div><span class="k">Czas planowany</span><span class="v">' + s.plannedMin + ' min</span></div>' +
        '<div><span class="k">Przestój — zatwierdzony</span><span class="v">' + downtimeCellHtml(s, m) + ' min</span></div>' +
        '<div><span class="k">Dobre / wadliwe</span><span class="v">' + s.good + ' / ' + s.bad + ' szt.</span></div>' +
        '<div><span class="k">Norma — ile powinno powstać</span><span class="v">' + (m.expectedQty > 0 ? (m.produced + ' z ' + m.expectedQty + ' szt.') : '—') + '</span>' +
        (m.expectedQty > 0 ? '<span class="hint">to nie to samo co „czas planowany" (' + s.plannedMin + ' min) — norma liczona jest w sztukach: ' + s.idealCycleSec + ' s/szt. w dostępnym czasie ' + Math.max(0, s.plannedMin - m.downtimeMin) + ' min</span>' : '') +
        '</div>' +
        '<div><span class="k">OEE</span><span class="v">' + fmtPct(m.oee) + '</span></div>' +
        '</div>' +
        '<div class="detail-dt-title">Przestoje w tej zmianie</div>' + dtHtml +
        actionsHtml;

    return '<tr class="detail-row" data-detail-for="' + s.id + '"><td colspan="7"><div class="detail-panel">' + cancelledNote + bodyHtml + '</div></td></tr>';
  }

  function renderOperatorResults(root) {
    if (!state.operators.length) {
      root.innerHTML = bannerHtml() + '<div class="op-hero"><div class="op-card"><div class="op-title">Jeszcze nie ma żadnego operatora</div>' +
        '<div class="op-sub">Administrator musi najpierw dodać operatora w panelu administratora.</div></div></div>';
      return;
    }

    if (!resultsVerified || !resultsOperatorId) {
      var opOpts = state.operators.map(function (o) { return '<option value="' + o.id + '">' + o.name + '</option>'; }).join("");
      root.innerHTML = bannerHtml() + '<div class="op-hero"><div class="op-card">' +
        '<div class="op-title">Moje wyniki</div><div class="op-sub">Wybierz siebie z listy i podaj swój PIN, żeby zobaczyć ostatnie zmiany i wynik.</div>' +
        '<form class="form-grid" id="resultsGateForm" style="margin-top:20px;">' +
        '<div class="field span-3"><label for="rOperator">Kto sprawdza wyniki?</label><select id="rOperator">' + opOpts + '</select></div>' +
        '<div class="field span-3"><label for="rPin">Twój PIN</label><input id="rPin" type="text" inputmode="numeric" maxlength="6"></div>' +
        '<div class="form-actions"><button type="submit" class="primary">Pokaż moje wyniki</button><span class="form-msg" id="resultsGateMsg">Błędny PIN dla wybranej osoby.</span></div>' +
        '</form></div></div>';
      document.getElementById("resultsGateForm").addEventListener("submit", function (evt) {
        evt.preventDefault();
        var id = document.getElementById("rOperator").value;
        var pin = document.getElementById("rPin").value.trim();
        var op = state.operators.filter(function (o) { return o.id === id; })[0];
        var msg = document.getElementById("resultsGateMsg");
        if (!op || pin !== op.pin) { msg.classList.add("show", "error"); document.getElementById("rPin").focus(); return; }
        resultsOperatorId = id;
        resultsVerified = true;
        resultsExpandedId = null;
        renderOperatorResults(root);
      });
      return;
    }

    var op = state.operators.filter(function (o) { return o.id === resultsOperatorId; })[0];
    if (!op) { resultsVerified = false; resultsOperatorId = null; renderOperatorResults(root); return; }

    var mine = state.shifts.filter(function (s) { return s.operatorId === resultsOperatorId; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    // "recentAll" (z anulowanymi) do wyświetlenia w tabeli — operator ma widzieć, że jego
    // korekta/anulowanie zadziałały; "recentActive" (bez anulowanych) do wszystkich wyliczeń.
    var recentAll = filterByPeriod(mine, resultsPeriod);
    var recentActive = recentAll.filter(isActiveShift);
    var withM = recentActive.map(function (s) { return calc(s); });
    var avgOee = withM.length ? withM.reduce(function (sum, m) { return sum + m.oee; }, 0) / withM.length : 0;
    // "Norma" w podsumowaniu okresu = łączna liczba zrobionych sztuk podzielona przez łączną
    // liczbę sztuk, które powinny powstać (suma expectedQty) — czyli dokładnie to, co pokazuje
    // linijka "Łącznie w tym okresie" niżej, żeby ten procent zawsze miał jasny punkt odniesienia.
    // Liczy się tylko ze zmian, dla których w ogóle da się wyliczyć normę (ustawiony czas cyklu).
    var withNormBasis = withM.filter(function (m) { return m.expectedQty > 0; });
    var totalExpectedQty = withNormBasis.reduce(function (sum, m) { return sum + m.expectedQty; }, 0);
    var totalProducedForNorm = withNormBasis.reduce(function (sum, m) { return sum + m.produced; }, 0);
    // celowo BEZ clamp01 — norma może być przekroczona (tak jak pojedynczy wiersz w tabeli
    // potrafi pokazać np. "402%"), apqRow() i tak przytnie tylko wypełnienie paska do 100%,
    // ale liczba obok ma pokazywać prawdziwy wynik, a nie sztucznie ograniczony do 100%
    var normRate = totalExpectedQty > 0 ? (totalProducedForNorm / totalExpectedQty) : null;
    var totalGood = recentActive.reduce(function (sum, s) { return sum + s.good; }, 0);
    var totalBad = recentActive.reduce(function (sum, s) { return sum + s.bad; }, 0);
    var totalDowntimeMin = withM.reduce(function (sum, m) { return sum + m.downtimeMin; }, 0);
    // czy WSZYSTKIE zmiany z okresu mają ustaloną normę (czas cyklu) — jeśli tak, nie trzeba
    // osobno pokazywać "z tego X szt.", bo to ta sama liczba co suma sztuk wyżej
    var allInNormBasis = normRate != null && totalProducedForNorm === (totalGood + totalBad);
    var cancelledCount = recentAll.length - recentActive.length;

    var rows = recentAll.map(function (s) {
      var m = calc(s);
      var open = resultsExpandedId === s.id;
      var active = isActiveShift(s);
      var badgeHtml = active
        ? '<span class="status-pill ' + tier(m.oee).key + '"><span class="dot"></span>' + tier(m.oee).label + '</span>'
        : '<span class="status-tag cancelled">Anulowana</span>';
      var row = '<tr class="result-row' + (open ? " open" : "") + (active ? "" : " cancelled-row") + '" data-shift-id="' + s.id + '"><td class="num tabular">' + fmtDate(s.date) + '</td>' +
        '<td class="num tabular">' + (s.shiftNumber || "—") + '</td><td>' + machineName(s.machineId) + '</td><td>' + productName(s.productId) + '</td>' +
        '<td class="num tabular" style="font-weight:600;">' + (active ? fmtPct(m.oee) : "—") + '</td>' +
        '<td>' + (active ? normCellHtml(m) : "—") + '</td>' +
        '<td>' + badgeHtml + '</td></tr>';
      return row + (open ? resultDetailRowHtml(s, m) : "");
    }).join("");

    // table-layout:fixed + kolgrupa — bez tego siatka ze szczegółami zmiany (detail-kv) w
    // rozwiniętym wierszu nie ma jasno określonej szerokości do policzenia i potrafi się
    // rozjechać w bok (kolumna "Norma" z długim komentarzem uciekała poza kartę)
    var colgroupHtml = '<colgroup><col style="width:12%"><col style="width:8%"><col style="width:16%"><col style="width:22%"><col style="width:9%"><col style="width:18%"><col style="width:15%"></colgroup>';

    root.innerHTML = bannerHtml() + '<div class="op-hero wide"><div class="op-card">' +
      '<div class="card-top" style="align-items:flex-start;"><div><div class="op-title">Moje wyniki — ' + escAttr(op.name) + '</div>' +
      '<div class="op-sub">' + periodSummaryLabel(resultsPeriod, recentActive.length) + (recentAll.length ? ' Kliknij wiersz, żeby zobaczyć szczegóły.' : '') + '</div></div>' +
      '<button type="button" class="ghost small" id="resultsSwitchBtn">Zmień osobę</button></div>' +
      periodPickerHtml(resultsPeriod, "results") +
      '<div class="apq-rows" style="margin-top:4px;max-width:360px;">' +
      apqRow("Śr. OEE", avgOee, "var(--chart-avail)") +
      (normRate != null ? apqRow("Norma (łącznie)", normRate, "var(--chart-perf)") : '') +
      '</div>' +
      (recentActive.length
        ? '<div class="hint" style="margin-top:10px;">Łącznie w tym okresie: <b>' + (totalGood + totalBad) + ' szt.</b>' +
          (normRate == null ? '' : allInNormBasis
            ? ' wobec normy <b>' + totalExpectedQty + ' szt.</b> (' + Math.round(normRate * 100) + '%)'
            : ' — z tego <b>' + totalProducedForNorm + ' szt.</b> wobec normy <b>' + totalExpectedQty + ' szt.</b> (' + Math.round(normRate * 100) + '%)') +
          ' (w tym ' + totalBad + ' wadliwych), zatwierdzony przestój <b>' + totalDowntimeMin + ' min</b>' +
          (cancelledCount ? ' · ' + cancelledCount + (cancelledCount === 1 ? ' anulowana zmiana pominięta' : ' anulowane zmiany pominięte') : '') + '.</div>'
        : '') +
      (recentAll.length
        ? '<div class="table-scroll" style="margin-top:16px;"><table class="compact fixed-layout">' + colgroupHtml + '<thead><tr><th>Data</th><th class="num">Zmiana</th><th>Maszyna</th><th>Produkt</th><th class="num">OEE</th><th>Norma</th><th>Ocena</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty-hint" style="margin-top:16px;">Brak zapisanych zmian w wybranym okresie.</div>') +
      '</div></div>';

    document.getElementById("resultsSwitchBtn").addEventListener("click", function () {
      resultsVerified = false; resultsOperatorId = null; resultsExpandedId = null; resultsEditingId = null; renderOperatorResults(root);
    });
    wirePeriodPicker("results", resultsPeriod, function () { resultsExpandedId = null; resultsEditingId = null; renderOperatorResults(root); });
    if (resultsEditingId) wireShiftEditMachineProductSync("selfEdit");
    root.querySelectorAll("tr.result-row").forEach(function (tr) {
      tr.addEventListener("click", function () {
        var id = tr.getAttribute("data-shift-id");
        resultsExpandedId = resultsExpandedId === id ? null : id;
        resultsEditingId = null;
        renderOperatorResults(root);
      });
    });
    root.querySelectorAll("[data-self-edit]").forEach(function (btn) {
      btn.addEventListener("click", function (evt) {
        evt.stopPropagation();
        resultsEditingId = btn.getAttribute("data-self-edit");
        renderOperatorResults(root);
      });
    });
    root.querySelectorAll("[data-self-cancel]").forEach(function (btn) {
      btn.addEventListener("click", async function (evt) {
        evt.stopPropagation();
        var id = btn.getAttribute("data-self-cancel");
        var s = shiftById(id);
        if (!s || !confirm("Na pewno anulować tę zmianę? Zniknie z wyliczeń OEE i normy, ale zostanie widoczna (przekreślona) w historii.")) return;
        btn.disabled = true;
        await submitShiftCancel(s, "operator", null);
        renderOperatorResults(root);
      });
    });
    root.querySelectorAll("[data-self-edit-discard]").forEach(function (btn) {
      btn.addEventListener("click", function (evt) {
        evt.stopPropagation();
        resultsEditingId = null;
        renderOperatorResults(root);
      });
    });
    root.querySelectorAll("[data-self-edit-save]").forEach(function (btn) {
      btn.addEventListener("click", async function (evt) {
        evt.stopPropagation();
        var id = btn.getAttribute("data-self-edit-save");
        var s = shiftById(id);
        if (!s) return;
        btn.disabled = true;
        var res = await submitShiftEdit(s, "selfEdit", "operator", false);
        if (res.ok) resultsEditingId = null;
        renderOperatorResults(root);
      });
    });
  }

  function loginScreenHtml() {
    if (authScreen === "check-email") {
      return '<div class="gate-card"><div class="section-head"><div class="eyebrow">Sprawdź skrzynkę</div><div class="section-title small">Wysłaliśmy link logowania</div>' +
        '<div class="section-sub">Kliknij link w wiadomości e-mail, żeby się zalogować. Możesz zamknąć tę kartę.</div></div>' +
        '<button type="button" class="ghost" id="backToLoginBtn">Wróć</button></div>';
    }
    var isSignup = authScreen === "signup";
    return '<div class="gate-card' + (isSignup ? ' wide' : '') + '">' +
      '<div class="brand-block" style="margin-bottom:2px;"><div class="wordmark">POSTOJOMIERZ<span>+</span></div></div>' +
      '<div class="section-head"><div class="eyebrow">' + (isSignup ? "Nowy warsztat" : "Logowanie") + '</div>' +
      '<div class="section-title small">' + (isSignup ? "Załóż konto firmy" : "Zaloguj się") + '</div>' +
      '<div class="section-sub">' + (isSignup ? "Dostaniesz e-mailem link logowania — bez hasła do zapamiętania." : "Podaj e-mail, wyślemy link logowania.") + '</div></div>' +
      '<form id="authForm">' +
      (isSignup ? '<div class="field"><label for="authCompany">Nazwa firmy</label><input id="authCompany" type="text" placeholder="np. Warsztat Kowalski" required></div>' +
        '<div class="field"><label for="authName">Twoje imię i nazwisko</label><input id="authName" type="text" placeholder="Jan Kowalski" required></div>' : '') +
      '<div class="field"><label for="authEmail">E-mail</label><input id="authEmail" type="email" placeholder="ty@firma.pl" required></div>' +
      '<button type="submit" class="primary">Wyślij link logowania</button>' +
      (authError ? '<div class="form-msg show error">' + authError + '</div>' : '') +
      '</form>' +
      '<button type="button" class="ghost" id="toggleAuthMode">' + (isSignup ? "Masz już konto? Zaloguj się" : "Zakładasz warsztat pierwszy raz? Załóż konto firmy") + '</button>' +
      '</div>';
  }

  function wireLoginEvents() {
    var toggle = document.getElementById("toggleAuthMode");
    if (toggle) toggle.addEventListener("click", function () {
      authScreen = authScreen === "signup" ? "login" : "signup";
      authError = "";
      renderApp();
    });
    var back = document.getElementById("backToLoginBtn");
    if (back) back.addEventListener("click", function () { authScreen = "login"; renderApp(); });

    var form = document.getElementById("authForm");
    if (form) form.addEventListener("submit", async function (evt) {
      evt.preventDefault();
      authError = "";
      var email = document.getElementById("authEmail").value.trim();
      if (!email) return;
      var opts = { emailRedirectTo: REDIRECT_TO };
      if (authScreen === "signup") {
        var company = document.getElementById("authCompany").value.trim();
        var name = document.getElementById("authName").value.trim();
        if (!company || !name) return;
        opts.data = { company_name: company, display_name: name };
      }
      var submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      var res = await sb.auth.signInWithOtp({ email: email, options: opts });
      submitBtn.disabled = false;
      if (res.error) { authError = res.error.message; renderApp(); return; }
      authScreen = "check-email";
      renderApp();
    });
  }

  function headerHtml() {
    var isAdmin = session.profile.role === "admin";
    // magazynier dostaje Panel kierownika (ograniczony do Inwentaryzacji i WZ/RW/MM przez
    // MAGAZYNIER_TABS/currentTabSet), ale nigdy Panel administratora ani licznik alertów
    // (alerty admin-only, jak dotąd).
    var canManager = isAdmin || session.profile.role === "magazynier";
    var alertCount = isAdmin ? computeAlerts().length : 0;
    return '<header class="topbar"><div class="brand-block"><div class="wordmark">POSTOJOMIERZ<span>+</span></div>' +
      '<div class="tagline">Widzisz w minutę, gdzie warsztat traci produkcję.</div></div>' +
      '<div class="topbar-right"><div class="role-tabs">' +
      '<button type="button" class="role-tab ' + (view === "operator" ? "active" : "") + '" data-role="operator">Wpis operatora</button>' +
      '<button type="button" class="role-tab ' + (view === "results" ? "active" : "") + '" data-role="results">Moje wyniki</button>' +
      (canManager ? '<button type="button" class="role-tab ' + (view === "manager" ? "active" : "") + '" data-role="manager">Panel kierownika' + (alertCount ? " (" + alertCount + ")" : "") + '</button>' : '') +
      (isAdmin ? '<button type="button" class="role-tab ' + (view === "admin" ? "active" : "") + '" data-role="admin">Panel administratora</button>' : '') +
      '</div><div class="topbar-meta"><span class="num tabular" id="todayLabel"></span>' +
      '<button type="button" class="ghost small" id="signOutBtn">Wyloguj (' + session.user.email + ')</button></div></div></header>';
  }

  function footerHtml() {
    return '<footer><span>Dane firmy „' + session.company.name + '" są bezpiecznie oddzielone od danych innych firm.</span><span>Postojomierz+ — ' + new Date().getFullYear() + '</span></footer>';
  }

  function renderApp() {
    var app = document.getElementById("app");

    if (booting) { app.innerHTML = '<div class="boot-loading">Wczytywanie…</div>'; return; }

    if (!session) {
      app.innerHTML = loginScreenHtml();
      wireLoginEvents();
      return;
    }

    // Panel administratora zostaje 'admin'-only. Panel kierownika dopuszcza też 'magazynier' —
    // ale MAGAZYNIER_TABS/currentTabSet w środku i tak pokazuje mu tylko Inwentaryzację i
    // WZ/RW/MM, nie cały panel. RLS w bazie jest twardym backstopem niezależnie od tych bramek.
    if (view === "admin" && session.profile.role !== "admin") view = "operator";
    if (view === "manager" && session.profile.role !== "admin" && session.profile.role !== "magazynier") view = "operator";

    var viewportHtml = view === "admin" ? '<div id="adminRoot"></div>'
      : view === "manager" ? '<div id="managerRoot"></div>'
      : view === "results" ? '<div id="resultsRoot"></div>'
      : '<div id="operatorRoot"></div>';
    app.innerHTML = headerHtml() + '<div id="viewport">' + viewportHtml + '</div>' + footerHtml();
    document.getElementById("todayLabel").textContent = new Date().toLocaleDateString("pl-PL", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });

    app.querySelectorAll("[data-role]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var nextView = btn.getAttribute("data-role");
        if (nextView !== view) {
          // za każdym wejściem na "Moje wyniki" trzeba potwierdzić PIN na nowo —
          // to współdzielone urządzenie, więc nie zostawiamy cudzych wyników odsłoniętych
          resultsVerified = false; resultsOperatorId = null;
          // panel administratora i panel kierownika mają teraz osobne zestawy zakładek —
          // przy przejściu między nimi wróć na domyślną zakładkę tego panelu, żeby nie
          // pokazać treści zakładki, której przycisku w ogóle tam nie ma
          if (nextView === "manager") {
            var managerTabSet = session.profile.role === "magazynier" ? MAGAZYNIER_TABS : MANAGER_TABS;
            if (!managerTabSet.some(function (t) { return t.key === adminTab; })) adminTab = session.profile.role === "magazynier" ? "inventory" : "overview";
          }
          if (nextView === "admin" && !CONFIG_TABS.some(function (t) { return t.key === adminTab; })) adminTab = "machines";
        }
        view = nextView;
        renderApp();
      });
    });
    var signOutBtn = document.getElementById("signOutBtn");
    if (signOutBtn) signOutBtn.addEventListener("click", function () { sb.auth.signOut(); });

    if (view === "admin") renderAdmin(document.getElementById("adminRoot"));
    else if (view === "manager") renderAdmin(document.getElementById("managerRoot")); // ta sama logika renderowania zakładek, inny zestaw zakładek (patrz currentTabSet)
    else if (view === "results") renderOperatorResults(document.getElementById("resultsRoot"));
    else renderOperator(document.getElementById("operatorRoot"));
  }

  /* ---------- autoryzacja i start ---------- */

  async function handleAuthChange(authSession) {
    if (!authSession) {
      session = null;
      booting = false;
      renderApp();
      return;
    }
    var profR = await sb.from("profiles").select("*, companies(*)").eq("id", authSession.user.id).single();
    if (profR.error || !profR.data) {
      // Trigger, który tworzy profil, mógł jeszcze nie zdążyć — spróbuj raz jeszcze po chwili.
      await new Promise(function (r) { setTimeout(r, 1200); });
      profR = await sb.from("profiles").select("*, companies(*)").eq("id", authSession.user.id).single();
    }
    if (profR.error || !profR.data) {
      authError = "Nie udało się wczytać konta. Odśwież stronę za chwilę.";
      session = null;
      booting = false;
      renderApp();
      return;
    }
    session = {
      user: authSession.user,
      profile: { id: profR.data.id, role: profR.data.role, displayName: profR.data.display_name },
      company: {
        id: profR.data.companies.id, name: profR.data.companies.name, shiftsPerDay: profR.data.companies.shifts_per_day,
        shiftLengthMin: profR.data.companies.shift_length_min != null ? profR.data.companies.shift_length_min : 480,
        breakMin: profR.data.companies.break_min || 0,
        ineffectiveMin: profR.data.companies.ineffective_min || 0,
        alertOeeThreshold: profR.data.companies.alert_oee_threshold != null ? profR.data.companies.alert_oee_threshold : 0.6,
        alertDowntimePendingHours: profR.data.companies.alert_downtime_pending_hours != null ? profR.data.companies.alert_downtime_pending_hours : 24,
        alertNormMissStreak: profR.data.companies.alert_norm_miss_streak != null ? profR.data.companies.alert_norm_miss_streak : 3
      }
    };
    // po zalogowaniu admin trafia od razu na Panel kierownika (przegląd wyników) — to jest
    // ekran, który dawniej był domyślną zakładką jednego wspólnego panelu administratora;
    // po rozdzieleniu na Panel kierownika / Panel administratora to on został "pierwszym ekranem",
    // a konfiguracja (Maszyny/Operatorzy/Produkty/Ustawienia) jest jedno kliknięcie dalej
    view = (session.profile.role === "admin" || session.profile.role === "magazynier") ? "manager" : "operator";
    // adminTab domyślnie startuje na "machines" (zakładka Panelu administratora) — przy
    // pierwszym wejściu prosto na Panel kierownika trzeba go ustawić na jego własną,
    // domyślną zakładkę, inaczej adminTabContentHtml() pokaże zawartość zakładki, której
    // w Panelu kierownika w ogóle nie ma (patrz analogiczny reset przy klikaniu w role-tabs).
    // Magazynier nie ma zakładki "overview" (patrz MAGAZYNIER_TABS) — jego domyślna to Inwentaryzacja.
    if (view === "manager") adminTab = session.profile.role === "magazynier" ? "inventory" : "overview";
    await loadCompanyData();
    booting = false;
    renderApp();
  }

  async function boot() {
    backdrop = document.getElementById("modalBackdrop");
    modalBox = document.getElementById("modalBox");
    backdrop.addEventListener("click", function (evt) { if (evt.target === backdrop) closeModal(); });
    document.addEventListener("keydown", function (evt) { if (evt.key === "Escape" && backdrop.classList.contains("open")) closeModal(); });

    if (!sb) {
      booting = false;
      var app = document.getElementById("app");
      app.innerHTML = '<div class="gate-card"><div class="section-head"><div class="eyebrow">Błąd konfiguracji</div><div class="section-title small">Brak połączenia z bazą danych</div>' +
        '<div class="section-sub">Nie udało się wczytać biblioteki Supabase. Sprawdź połączenie z internetem i odśwież stronę.</div></div></div>';
      return;
    }

    sb.auth.onAuthStateChange(function (event, authSession) {
      if (event === "SIGNED_OUT") { session = null; renderApp(); return; }
      if (event === "INITIAL_SESSION") return; // obsłużone niżej przez getSession()
      handleAuthChange(authSession);
    });

    var got = await sb.auth.getSession();
    await handleAuthChange(got.data ? got.data.session : null);
  }

  boot();
})();
</script>
